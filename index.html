<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f6f5f2">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="PNL">
<meta name="mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
input,button,select,textarea{font-family:inherit}
.tnum{font-variant-numeric:tabular-nums}

/* ==========================================================
   WEB GÖRÜNÜMÜ — mevcut tasarım, olduğu gibi
   ========================================================== */
body.web{
  font-family:'Karla',system-ui,-apple-system,sans-serif;color:#3a342c;
  background:radial-gradient(140% 90% at 50% 0%, #f1eadd 0%, #ece4d6 55%, #e4dac8 100%);
  min-height:100vh;
}
body.web ::-webkit-scrollbar{height:11px;width:11px}
body.web ::-webkit-scrollbar-thumb{background:#cdbfa8;border-radius:8px;border:2px solid #fbf8f2}
body.web ::-webkit-scrollbar-track{background:#f1e8d7}
body.web #root{max-width:1440px;margin:0 auto;padding:28px 32px 48px}
body.web .pnl-cell{transition:background .1s}
body.web .pnl-cell:focus{background:#fff6e6!important;outline:2px solid #e3a23f;border-radius:5px}
body.web .ghostbtn{background:#fbf8f2;border:1px solid #d9ccb5;border-radius:9px;padding:8px 13px;font-size:13px;font-weight:600;color:#6b5f4d;cursor:pointer;transition:background .12s}
body.web .ghostbtn:hover{background:#f3ecdd}
body.web .kpi{display:grid;grid-template-columns:repeat(6,1fr);gap:14px;margin-bottom:16px}
body.web .charts{display:grid;grid-template-columns:1.7fr 1fr;gap:14px;margin-bottom:16px}
@media(max-width:1250px){body.web .kpi{grid-template-columns:repeat(3,1fr)}}
@media(max-width:1100px){body.web .charts{grid-template-columns:1fr}}
@media(max-width:900px){body.web #root{padding:16px 12px 40px}}
@media(max-width:680px){body.web .kpi{grid-template-columns:repeat(2,1fr)}}

/* ==========================================================
   MOBİL GÖRÜNÜMÜ — telefon tasarımı
   ========================================================== */
html.mob{height:100%}
body.mob{
  --ink:#1b1a18; --paper:#f6f5f2; --card:#fff;
  --green:#2f7a5b; --rust:#b4622f;
  --m1:rgba(27,26,24,.06); --m2:rgba(27,26,24,.1); --m3:rgba(27,26,24,.3);
  --m4:rgba(27,26,24,.55); --m5:rgba(27,26,24,.6); --m6:rgba(27,26,24,.72);
  --safeT:env(safe-area-inset-top,0px); --safeB:env(safe-area-inset-bottom,0px);
  background:#eceae5;
  font-family:-apple-system,BlinkMacSystemFont,system-ui,"Segoe UI","Helvetica Neue",sans-serif;
  color:var(--ink);-webkit-font-smoothing:antialiased;
  height:100%;overflow:hidden;overscroll-behavior:none;
  display:flex;align-items:center;justify-content:center;
}
body.mob button,.mobscope button{font:inherit;color:inherit;border:0;background:none;padding:0;cursor:pointer;touch-action:manipulation}
body.mob #root{
  position:relative;width:100%;max-width:480px;height:100%;height:100dvh;
  background:var(--paper);display:flex;flex-direction:column;overflow:hidden;
}
@media(min-width:560px) and (min-height:800px){
  body.mob #root{height:calc(100vh - 40px);height:calc(100dvh - 40px);max-height:920px;border-radius:34px;box-shadow:0 20px 60px rgba(0,0,0,.18)}
}
@keyframes sheetup{from{transform:translateY(100%)}to{transform:translateY(0)}}
@keyframes fadein{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

/* ---- başlık ---- */
body.mob .hdr{padding:calc(10px + var(--safeT)) 18px 6px;display:flex;align-items:flex-end;justify-content:space-between;gap:10px;flex:none}
body.mob .kick{display:inline-flex;align-items:center;gap:7px;height:26px;font-size:12.5px;font-weight:600;color:var(--m5);max-width:100%;white-space:nowrap;overflow:hidden}
body.mob .kick i{width:8px;height:8px;border-radius:999px;flex:none;background:var(--m3)}
body.mob .kick:active{opacity:.55}
body.mob .title{font-size:30px;font-weight:700;letter-spacing:-.02em;line-height:1.08;display:flex;align-items:center;gap:6px;white-space:nowrap;overflow:hidden;max-width:100%}
body.mob .title .chev{font-size:15px;font-weight:700;color:var(--m3);transform:translateY(1px)}
body.mob button.title:active{opacity:.55}
body.mob .nav{display:flex;align-items:center;background:var(--m1);border-radius:999px;padding:3px;gap:2px;flex:none}
body.mob .nav button{width:40px;height:38px;border-radius:999px;color:var(--m6);display:flex;align-items:center;justify-content:center}
body.mob .nav button:active{background:rgba(27,26,24,.1)}
body.mob .nav svg{width:16px;height:16px}

/* ---- içerik ---- */
body.mob .scroll{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;padding:4px 16px calc(112px + var(--safeB))}
body.mob .scroll.flat{overflow:hidden;padding:0;display:flex;flex-direction:column}
body.mob .hero{background:var(--ink);color:var(--paper);border-radius:24px;padding:18px 20px 16px}
body.mob .hero-r{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
body.mob .hero-l{font-size:12px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:rgba(246,245,242,.62)}
body.mob .hero-b{display:flex;justify-content:space-between;align-items:flex-end;margin-top:6px;gap:10px}
body.mob .hero-big{font-size:40px;font-weight:700;letter-spacing:-.03em;line-height:1.05;margin-top:6px}
body.mob .hero-b .hero-big{font-size:32px;margin-top:0}
body.mob .hero-sm{font-size:17px;font-weight:600}
body.mob .hero-note{font-size:13px;font-weight:600;color:rgba(246,245,242,.72);margin-top:5px;line-height:1.4}
body.mob .hero-g{display:flex;gap:8px;margin-top:16px}
body.mob .hero-g>div{flex:1;min-width:0;background:rgba(246,245,242,.09);border-radius:14px;padding:10px 11px}
body.mob .hero-g .k{font-size:11.5px;color:rgba(246,245,242,.62);font-weight:600}
body.mob .hero-g .v{font-size:15px;font-weight:700;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
body.mob .card{margin-top:14px;background:var(--card);border-radius:22px;padding:18px 18px;box-shadow:0 1px 2px rgba(0,0,0,.05)}
body.mob .sh-t,.mobscope .sh-t{font-size:17px;font-weight:700;letter-spacing:-.02em}
body.mob .sh-x,.mobscope .sh-x{font-size:14px;font-weight:600;color:var(--m5);padding:6px 0}
body.mob .tsav{margin-top:14px;display:flex;gap:10px}
body.mob .tsav>div{flex:1;min-width:0;background:var(--m1);border-radius:14px;padding:11px 13px}
body.mob .tsav .k{font-size:12px;font-weight:600;color:var(--m5)}
body.mob .tsav .v{font-size:19px;font-weight:700;letter-spacing:-.02em;margin-top:3px}
body.mob .opn{margin-top:10px;width:100%;text-align:left;font-size:12.5px;font-weight:600;color:var(--m4);padding:4px 2px}
body.mob .opn:active{color:var(--m6)}
body.mob .bar{margin-top:12px;height:10px;border-radius:999px;background:var(--m2);overflow:hidden}
body.mob .bar>div{height:100%;border-radius:999px;background:var(--green);transition:width .4s}
body.mob .rowsm{display:flex;justify-content:space-between;margin-top:9px;font-size:12.5px;color:var(--m5);font-weight:600}
body.mob .sechd{margin-top:24px;display:flex;align-items:baseline;justify-content:space-between;gap:8px;padding:0 2px}
body.mob .sechd .t{font-size:15px;font-weight:700;letter-spacing:-.01em}
body.mob .sechd .m{font-size:12px;font-weight:600;color:var(--m4)}
body.mob .lab,.mobscope .lab{margin-top:18px;font-size:11.5px;letter-spacing:.1em;text-transform:uppercase;font-weight:700;color:var(--m4)}
body.mob .catrow{display:block;width:100%;text-align:left;padding:7px 0}
body.mob .catrow:active{opacity:.6}
body.mob .cat-h{display:flex;align-items:baseline;gap:8px}
body.mob .cat-n{font-size:14px;font-weight:600;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
body.mob .cat-a{font-size:14px;font-weight:600}
body.mob .cat-p{font-size:12px;font-weight:600;color:var(--m4);width:36px;text-align:right}
body.mob .cat-c{font-size:14px;color:var(--m3);font-weight:700;width:10px;text-align:right}
body.mob .cat-b{margin-top:6px;height:6px;border-radius:999px;background:rgba(27,26,24,.07);overflow:hidden}
body.mob .cat-b>div{height:100%;border-radius:999px}
body.mob .spark{margin-top:14px;display:flex;align-items:flex-end;gap:3px;height:46px}
body.mob .spark div{flex:1;border-radius:3px;min-height:2px}
body.mob .sparkx{margin-top:5px;display:flex;gap:3px}
body.mob .sparkx div{flex:1;text-align:center;font-size:9.5px;font-weight:700;color:var(--m3)}
body.mob .warn{margin-top:12px;padding:11px 13px;border-radius:14px;background:rgba(180,98,47,.1);font-size:12.5px;line-height:1.45;color:#8a4a22;font-weight:600}
body.mob .ok{margin-top:12px;padding:11px 13px;border-radius:14px;background:rgba(47,122,91,.1);font-size:12.5px;line-height:1.45;color:#27614a;font-weight:600}

/* ---- bağlı değil uyarısı ---- */
body.mob .banner{margin-top:4px;margin-bottom:12px;display:flex;align-items:center;gap:12px;padding:13px 14px;border-radius:18px;background:rgba(180,98,47,.11);color:#7d4220;font-size:13px;font-weight:600;line-height:1.4;width:100%;text-align:left}
body.mob .banner .go{flex:none;padding:9px 13px;border-radius:999px;background:var(--rust);color:#fff;font-size:13px;font-weight:700}

/* ---- hızlı ekle ---- */
body.mob .hscroll{display:flex;gap:8px;overflow-x:auto;margin:10px -16px 0;padding:2px 16px 6px;scrollbar-width:none;-webkit-overflow-scrolling:touch}
body.mob .hscroll::-webkit-scrollbar{display:none}
body.mob .qchip{flex:none;display:flex;align-items:center;gap:8px;padding:10px 14px;border-radius:999px;background:var(--card);box-shadow:0 1px 2px rgba(0,0,0,.07);font-size:14px;font-weight:600;white-space:nowrap}
body.mob .qchip i{width:8px;height:8px;border-radius:999px;flex:none}
body.mob .qchip b{font-weight:700;color:var(--green)}
body.mob .qchip:active{background:#efeee9}

/* ---- kalem listesi (kaydırarak kaldır) ---- */
body.mob .lgh{display:flex;align-items:baseline;justify-content:space-between;gap:10px;padding:11px 16px 7px;background:rgba(27,26,24,.03);border-bottom:1px solid rgba(27,26,24,.06)}
body.mob .lgh .g{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase}
body.mob .lgh .s{font-size:12.5px;font-weight:700}
body.mob .list{margin-top:10px;background:var(--card);border-radius:20px;box-shadow:0 1px 2px rgba(0,0,0,.05);overflow:hidden}
body.mob .lrow{position:relative;overflow:hidden;border-bottom:1px solid rgba(27,26,24,.06)}
body.mob .lrow:last-child{border-bottom:0}
body.mob .lrow .rm{position:absolute;right:0;top:0;bottom:0;width:96px;background:var(--rust);color:#fff;font-size:13px;font-weight:700;display:flex;align-items:center;justify-content:center}
body.mob .li{position:relative;z-index:1;display:flex;align-items:center;gap:12px;padding:13px 16px;width:100%;text-align:left;background:var(--card);transition:transform .22s cubic-bezier(.2,.8,.2,1);touch-action:pan-y}
body.mob .li:active{background:#faf9f7}
body.mob .li-d{width:32px;height:32px;flex:none;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;color:#fff}
body.mob .li-n{font-size:15px;font-weight:600;letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
body.mob .li-s{font-size:12px;color:var(--m5);margin-top:1px}
body.mob .li-a{font-size:15px;font-weight:600;white-space:nowrap}
body.mob .hint{margin-top:6px;font-size:12px;color:var(--m4);font-weight:500;padding:0 2px}
body.mob .empty{padding:26px 8px;text-align:center;font-size:13.5px;color:var(--m5);line-height:1.5}
body.mob .ghost,.mobscope .ghost{margin-top:10px;padding:14px;border-radius:16px;background:var(--m1);text-align:center;font-size:14px;font-weight:600;color:var(--m6);width:100%;display:block}
body.mob .ghost:active,.mobscope .ghost:active{background:var(--m2)}
body.mob .hero-g.three>div{padding:10px 10px}
body.mob .tot{margin-top:10px;display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 14px;border-radius:14px;background:rgba(47,122,91,.1)}
body.mob .tot .a{font-size:12.5px;font-weight:600;color:#27614a}
body.mob .tot .b{font-size:20px;font-weight:700;letter-spacing:-.02em;color:#27614a}
body.mob .split{display:flex;justify-content:space-between;margin-top:8px;font-size:12px;font-weight:600;color:var(--m5)}

/* ---- alt sekmeler + ortada ekle ---- */
body.mob .tabs{position:absolute;left:0;right:0;bottom:0;padding:6px 8px calc(8px + var(--safeB));background:rgba(246,245,242,.9);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border-top:1px solid rgba(27,26,24,.08);display:flex;align-items:center;z-index:30}
body.mob .tab{flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 0 3px;font-size:11px;font-weight:700;color:var(--m4)}
body.mob .tab svg{width:23px;height:23px}
body.mob .tab.on{color:var(--ink)}
body.mob .tab:active{opacity:.6}
body.mob .tadd{flex:none;width:58px;height:50px;margin:0 4px;border-radius:18px;background:var(--green);color:#fff;display:flex;align-items:center;justify-content:center;box-shadow:0 6px 18px rgba(47,122,91,.35),0 2px 5px rgba(0,0,0,.1);transition:transform .14s}
body.mob .tadd:active{transform:scale(.92)}
body.mob .tadd svg{width:26px;height:26px}
@media(prefers-reduced-motion:reduce){body.mob .tadd,body.mob .li{transition:none}}

/* ---- başlık: ayarlar düğmesi ---- */
body.mob .hbtns{display:flex;gap:8px;align-items:center;flex:none}
body.mob .gear{width:44px;height:44px;border-radius:999px;background:var(--m1);display:flex;align-items:center;justify-content:center;color:var(--m6);flex:none}
body.mob .gear svg{width:21px;height:21px}
body.mob .gear.on{background:var(--ink);color:var(--paper)}
body.mob .gear:active{opacity:.6}

/* ---- 12 aylık şerit (dokun → o ay) ---- */
body.mob .ystrip{display:flex;gap:2px}
body.mob .ys{flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;gap:4px;padding:6px 0 5px;border-radius:10px}
body.mob .ys .bw{height:44px;width:100%;display:flex;align-items:flex-end;justify-content:center}
body.mob .ys .bw i{display:block;width:62%;max-width:16px;border-radius:3px}
body.mob .ys span{font-size:10.5px;font-weight:700;color:var(--m4);letter-spacing:-.02em}
body.mob .ys.cur span{color:#a0621b}
body.mob .ys.in{background:rgba(27,26,24,.07)}
body.mob .ys.sel{background:var(--ink)}
body.mob .ys.sel span{color:var(--paper)}
body.mob .ys:active{opacity:.6}
body.mob .ystrip.slim .ys{padding:4px 0 4px}
body.mob .ystrip.slim .ys .bw{height:22px}

/* ---- özet: yıl kartı ---- */
body.mob .ygrid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}
body.mob .ygrid>div{background:var(--m1);border-radius:14px;padding:10px 12px;min-width:0}
body.mob .ygrid .k{font-size:12px;font-weight:600;color:var(--m5)}
body.mob .ygrid .v{font-size:18px;font-weight:700;letter-spacing:-.02em;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
body.mob .ygrid .s{font-size:11.5px;font-weight:600;color:var(--m4);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
body.mob .goalrow{display:block;width:100%;text-align:left;margin-top:14px;padding-top:12px;border-top:1px solid rgba(27,26,24,.07)}

/* ---- özet: kategori kartları (gör + gir) ---- */
body.mob .gcard{margin-top:12px;background:var(--card);border-radius:20px;box-shadow:0 1px 2px rgba(0,0,0,.05);overflow:hidden}
body.mob .gch{display:flex;align-items:center;gap:10px;width:100%;padding:13px 14px 11px 16px;text-align:left}
body.mob .gch:active{background:#faf9f7}
body.mob .gch>i{width:10px;height:10px;border-radius:999px;flex:none}
body.mob .gch .n{flex:1;min-width:0;font-size:16px;font-weight:700;letter-spacing:-.01em}
body.mob .gch .n small{font-size:11.5px;font-weight:700;color:var(--green);margin-left:4px}
body.mob .gch .a{font-size:16px;font-weight:700;text-align:right}
body.mob .gch .y{font-size:11.5px;font-weight:600;color:var(--m4);text-align:right;margin-top:1px}
body.mob .gch .chev{color:var(--m3);font-weight:700;font-size:16px}
body.mob .gcard .lrow{border-top:1px solid rgba(27,26,24,.06);border-bottom:0}
body.mob .gcard .li{padding:9px 12px 9px 36px}
body.mob .gcard .li-n{font-size:15px;font-weight:600}
body.mob .li .pl{width:38px;height:38px;border-radius:12px;background:rgba(47,122,91,.11);color:var(--green);font-size:23px;font-weight:600;flex:none;display:flex;align-items:center;justify-content:center;line-height:1}
body.mob .li .pl:active{background:rgba(47,122,91,.22)}
body.mob .gadd{display:block;width:100%;padding:12px 16px 13px 36px;text-align:left;font-size:13.5px;font-weight:600;color:var(--green);border-top:1px solid rgba(27,26,24,.06)}
body.mob .gadd:active{background:#faf9f7}
body.mob .chips.one{flex-wrap:nowrap;overflow-x:auto;margin-left:-18px;margin-right:-18px;padding:2px 18px 4px;scrollbar-width:none}
body.mob .chips.one::-webkit-scrollbar{display:none}
body.mob .chips.one button{flex:none;white-space:nowrap}

/* ---- tablo: telefona sığan aylar, yana kaymaz ---- */
body.mob .tbar{flex:none;padding:0 14px 8px}
body.mob .tctl{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:8px;font-size:12px;color:var(--m4);font-weight:500;line-height:1.3}
body.mob .tctl button{flex:none;font-size:12.5px;font-weight:700;color:var(--ink);background:var(--m1);padding:8px 12px;border-radius:999px;white-space:nowrap}
body.mob .tblwrap{flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;touch-action:pan-y;margin-bottom:calc(66px + var(--safeB));border-top:1px solid rgba(27,26,24,.08)}
body.mob table.tbl{width:100%;table-layout:fixed;border-collapse:separate;border-spacing:0;font-size:13px}
body.mob .tbl th,body.mob .tbl td{height:38px;padding:0 6px;text-align:right;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;border-bottom:1px solid rgba(27,26,24,.06);font-variant-numeric:tabular-nums;background:var(--paper)}
body.mob .tbl thead th{position:sticky;top:0;z-index:2;height:34px;font-size:12px;font-weight:700;color:var(--m5);border-bottom:1px solid rgba(27,26,24,.14);cursor:pointer}
body.mob .tbl .nm{text-align:left;padding-left:14px;font-weight:600}
body.mob .tbl tr.it .nm{padding-left:30px;font-weight:500;cursor:pointer}
body.mob .tbl td.z{color:rgba(27,26,24,.2)}
body.mob .tbl .cm{background:#f8edd6}
body.mob .tbl thead th.cm{color:#a0621b}
body.mob .tbl thead th.sm{color:var(--ink);box-shadow:inset 0 -3px 0 var(--green)}
body.mob .tbl tr.it td.sm{background:#eef4f0}
body.mob .tbl tr.it td.sm.cm{background:#f3eedb}
body.mob .tbl tr.gh td{background:#efeee9;font-weight:700;height:40px;cursor:pointer}
body.mob .tbl tr.gh td.cm{background:#efe3c8}
body.mob .tbl tr.gh .nm .tw{display:inline-block;width:13px;color:var(--m4);font-size:10px}
body.mob .tbl tr.gh .nm i{display:inline-block;width:8px;height:8px;border-radius:999px;margin-right:7px;vertical-align:1px}
body.mob .tbl td.yt,body.mob .tbl th.yt{font-weight:700;color:var(--m6);background:#f1f0eb}
body.mob .tbl tr.gh td.yt{background:#e7e5df}

<script>
"use strict";
(function(){

/* ════════════════════════════════════════════════════════════
   0 · ESKİ SERVICE WORKER TEMİZLİĞİ
   ════════════════════════════════════════════════════════════ */
if('serviceWorker' in navigator){
  navigator.serviceWorker.getRegistrations().then(function(regs){
    if(!regs.length) return;
    var jobs=regs.map(function(r){return r.unregister();});
    if(window.caches&&caches.keys){
      jobs.push(caches.keys().then(function(ks){
        return Promise.all(ks.map(function(k){return caches.delete(k);}));
      }));
    }
    Promise.all(jobs).then(function(){
      if(!sessionStorage.getItem('swTemiz')){
        sessionStorage.setItem('swTemiz','1');
        location.reload();
      }
    });
  }).catch(function(){});
}

/* ════════════════════════════════════════════════════════════
   1 · SABİTLER & YARDIMCILAR
   ════════════════════════════════════════════════════════════ */
var MONTHS=['Oca','Şub','Mar','Nis','May','Haz','Tem','Ağu','Eyl','Eki','Kas','Ara'];
var MONTHS_L=['Ocak','Şubat','Mart','Nisan','Mayıs','Haziran','Temmuz','Ağustos','Eylül','Ekim','Kasım','Aralık'];
var YEARS=[2026,2027,2028,2029,2030];
var CUR='€';
var INK='#1b1a18', GREEN='#2f7a5b', RUST='#b4622f';
var C_HISSE='#2E9BC4', C_ALTIN='#E09A18';   /* mobil paletinden */
var root=document.getElementById('root');
var nowD=new Date();

function sp(map){ var a=new Array(12).fill(0); for(var k in map){a[+k]=map[k];} return a; }
function num(raw){
  if(raw===''||raw==null) return 0;
  var t=String(raw).replace(/\s/g,'').replace(/[−–]/g,'-');
  if(t.indexOf(',')>=0&&t.indexOf('.')>=0) t=t.replace(/\./g,'');   /* 1.234,56 */
  var n=parseFloat(t.replace(',','.').replace(/[^0-9.\-]/g,''));
  return isNaN(n)?0:n;
}
function esc(s){ return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function fmt(n){ return (n<0?'-':'')+CUR+Math.round(Math.abs(n)).toLocaleString('tr-TR'); }
function fmtPlain(n){ return Math.round(n).toLocaleString('tr-TR'); }
function fmtM(n){ var a=Math.abs(n); a=(Math.round(a)===Math.round(a*100)/100)?Math.round(a):Math.round(a*100)/100; return (n<0&&a?'-':'')+a.toLocaleString('tr-TR',{maximumFractionDigits:2})+' '+CUR; }
function signedM(n){ return (n>0?'+':'')+fmtM(n); }
function uid(p){ return (p||'')+Math.random().toString(36).slice(2,8)+Date.now().toString(36).slice(-3); }
function rgba(hex,a){ var h=hex.replace('#',''); var r=parseInt(h.slice(0,2),16),g=parseInt(h.slice(2,4),16),b=parseInt(h.slice(4,6),16); return 'rgba('+r+','+g+','+b+','+a+')'; }
function yearSum(arr){ var s=0; for(var i=0;i<arr.length;i++){ s+=(+arr[i]||0); } return s; }
function h(html){ var t=document.createElement('template'); t.innerHTML=String(html).trim(); return t.content; }

/* ════════════════════════════════════════════════════════════
   2 · VERİ MODELİ  (web modeli esas alındı)
   ════════════════════════════════════════════════════════════ */
function seedData(){
  var gid=0,iid=0;
  function G(name,type,color,items){ return {id:'g'+(gid++),name:name,type:type,color:color,items:items}; }
  function I(name,values,invest){ return {id:'i'+(iid++),name:name,values:values,invest:invest}; }
  return {
    opening:3477,
    groups:[
      G('Gelir','revenue','#16a85a',[
        I('Maaş',[2747,2740,2740,3050,3460,3460,3460,3460,3460,3460,3460,3460]),
        I('Bonus',[0,230,1378,250,0,0,0,0,0,0,0,0]),
        I('Retention Bonus',new Array(12).fill(0)),
        I('Masraf İadesi',new Array(12).fill(0))
      ]),
      G('Yatırım Satışları','revenue','#0d9488',[
        I('Altın Satışı',new Array(12).fill(0),'altin'),
        I('Hisse Satışı',new Array(12).fill(0),'hisse')
      ]),
      G('Ev','cost','#3b82f6',[
        I('Türk Marketi',new Array(12).fill(150)),
        I('Alman Marketi',[100,100,200,200,200,200,200,200,200,200,200,200])
      ]),
      G('Günlük','cost','#ef5a1e',[
        I('Günlük Harcama',[850,800,740,933,1000,800,900,1000,800,800,800,800])
      ]),
      G('Krediler','cost','#8b5cf6',[
        I('DB Kredi · Ziya',new Array(12).fill(95)),
        I('DB Kredi · Emre',new Array(12).fill(115))
      ]),
      G('Sabit','cost','#07a7c4',[
        I('Kira',new Array(12).fill(750)),
        I('Annem',[100,100,100,200,200,200,200,200,200,200,200,200]),
        I('BVG',new Array(12).fill(60)),
        I('Sigorta',[0,0,50,50,40,40,40,40,40,40,40,40]),
        I('Terapi',[0,0,0,0,0,170,173,0,0,0,0,0]),
        I('Telefon',new Array(12).fill(25)),
        I('Hisse',[0,50,250,0,700,0,0,250,1000,1000,850,950],'hisse'),
        I('Altın',[0,1500,770,0,0,0,0,0,0,0,0,0],'altin'),
        I('Gym',new Array(12).fill(52))
      ]),
      G('Değişken','cost','#ec4899',[
        I('Aile (Antalya)',sp({0:700,6:700})),
        I('Amazon',sp({0:200,1:350})),
        I('Çamaşır Makinesi',sp({0:965})),
        I('Eren (Roma)',sp({0:185,5:803})),
        I('Terapi',sp({4:200})),
        I('Diğer',sp({2:331,4:130})),
        I('Eren (Paris)',sp({0:200,3:870})),
        I('Stockholm',sp({10:100})),
        I('Eren (Berlin)',sp({1:173,4:20})),
        I('Ruas',sp({2:280}))
      ]),
      G('Realize K/Z','realize','#dc2626',[
        I('Altın K/Z',new Array(12).fill(0),'altin'),
        I('Hisse K/Z',new Array(12).fill(0),'hisse')
      ])
    ]
  };
}
function emptyData(){
  var s=seedData();
  return { opening:null, groups:s.groups.map(function(g){
    return {id:g.id,name:g.name,type:g.type,color:g.color,cat:g.cat,items:g.items.map(function(it){
      return {id:it.id,name:it.name,invest:it.invest,values:new Array(12).fill(0)};
    })};
  })};
}
function ensureGroups(groups){
  var result=(groups||[]).map(function(g){
    return {id:g.id||uid('g'),name:g.name,type:g.type||'cost',color:g.color||'#8a7f6f',cat:g.cat,
      items:(g.items||[]).map(function(it){
        return {id:it.id||uid('i'),name:it.name,invest:it.invest,
          values:(function(v){ v=(v||[]).slice(0,12); while(v.length<12) v.push(0); return v.map(function(x){return +x||0;}); })(it.values)};
      })};
  });
  var names={}; result.forEach(function(g){ names[g.name]=true; });
  if(!names['Yatırım Satışları']){
    var sell={id:uid('g'),name:'Yatırım Satışları',type:'revenue',color:'#0d9488',
      items:[{id:uid('i'),name:'Altın Satışı',values:new Array(12).fill(0),invest:'altin'},
             {id:uid('i'),name:'Hisse Satışı',values:new Array(12).fill(0),invest:'hisse'}]};
    var firstCost=-1;
    for(var i=0;i<result.length;i++){ if(result[i].type!=='revenue'){ firstCost=i; break; } }
    if(firstCost===-1) result.push(sell); else result.splice(firstCost,0,sell);
  }
  if(!names['Realize K/Z']){
    result.push({id:uid('g'),name:'Realize K/Z',type:'realize',color:'#dc2626',
      items:[{id:uid('i'),name:'Altın K/Z',values:new Array(12).fill(0),invest:'altin'},
             {id:uid('i'),name:'Hisse K/Z',values:new Array(12).fill(0),invest:'hisse'}]});
  }
  result.forEach(function(g){
    g.items.forEach(function(it){
      if(it.invest) return;
      if(it.name==='Altın'||it.name==='Altın Satışı'||it.name==='Altın K/Z') it.invest='altin';
      else if(it.name==='Hisse'||it.name==='Hisse Satışı'||it.name==='Hisse K/Z') it.invest='hisse';
    });
  });
  /* hisse/altın alımı gider değil, yatırım: ayrı "Yatırım" grubuna taşı (bir kere) */
  if(!result.some(function(g){ return g.type==='invest'; })){
    var inv={id:uid('g'),name:'Yatırım',type:'invest',color:'#2E9BC4',items:[]};
    result.forEach(function(g){
      if(g.type!=='cost') return;
      g.items=g.items.filter(function(it){ if(it.invest){ inv.items.push(it); return false; } return true; });
    });
    if(!inv.items.length) inv.items=[{id:uid('i'),name:'Hisse',values:new Array(12).fill(0),invest:'hisse'},
                                      {id:uid('i'),name:'Altın',values:new Array(12).fill(0),invest:'altin'}];
    var ri=-1; for(var k=0;k<result.length;k++){ if(result[k].type==='realize'){ ri=k; break; } }
    if(ri===-1) result.push(inv); else result.splice(ri,0,inv);
  }
  /* giderler: sabit / değişken üst grubu */
  result.forEach(function(g){
    if(g.type==='cost'&&g.cat!=='sabit'&&g.cat!=='degisken') g.cat=(g.name==='Değişken'?'degisken':'sabit');
  });
  return result;
}

/* ════════════════════════════════════════════════════════════
   3 · DEPO  (tek kaynak — web ve mobil aynı veriyi okur)
   ════════════════════════════════════════════════════════════ */
var SKEY='pnl_store_v3';
var STORE={updatedAt:0,years:{},goal:12000,alert:0,schema:4,
  plan:{weekly:200,weekday:1,payday:30,item:'Hisse'},     /* haftalık yatırım planı */
  paydays:{},        /* ay ay işaretlenen maaş günü: {'2026-10':29} — yoksa plan.payday */
  showGold:false};   /* altın satırları gizli; tutarları hesaplarda kalır */
/* açılış: sayı = elle girilmiş, null = önceki yıl sonundan otomatik */
function normYear(Y,y){
  var op=Y.opening;
  op=(op===null||op===undefined||op==='')?null:(+op||0);
  return {opening:(y===YEARS[0]&&op===null)?0:op,groups:ensureGroups(Y.groups)};
}
function normalizeStore(){
  var old=!(STORE.schema>=4);
  YEARS.forEach(function(y){
    if(!STORE.years[y]) STORE.years[y]=migrateYear(y);
    else{
      /* eski sürümde sonraki yılların açılışı varsayılan 0'dı → otomatik yap */
      if(old&&y!==YEARS[0]&&!(+STORE.years[y].opening)) STORE.years[y].opening=null;
      STORE.years[y]=normYear(STORE.years[y],y);
    }
  });
  STORE.schema=4;
  var P=STORE.plan||{};
  STORE.plan={weekly:(typeof P.weekly==='number'?P.weekly:200),weekday:(typeof P.weekday==='number'?P.weekday:1),
    payday:(typeof P.payday==='number'?P.payday:30),item:P.item||'Hisse'};
  if(!STORE.paydays||typeof STORE.paydays!=='object') STORE.paydays={};
  STORE.showGold=!!STORE.showGold;
}

function migrateYear(y){
  var def=(y===2026)?seedData():emptyData();
  var legacy=null;
  try{
    var r=localStorage.getItem('pnl_'+y+'_v2')||localStorage.getItem('pnl_'+y+'_v1');
    if(r) legacy=JSON.parse(r);
  }catch(e){}
  if(legacy) return {opening:(legacy.opening!=null?legacy.opening:def.opening),groups:ensureGroups(legacy.groups||def.groups)};
  return {opening:(y===YEARS[0]?def.opening:null),groups:ensureGroups(def.groups)};
}
function loadStore(){
  try{
    var raw=localStorage.getItem(SKEY);
    if(raw){
      var p=JSON.parse(raw);
      if(p&&p.years){
        STORE.updatedAt=p.updatedAt||0;
        STORE.years=p.years;
        if(typeof p.goal==='number') STORE.goal=p.goal;
        if(typeof p.alert==='number') STORE.alert=p.alert;
        STORE.schema=p.schema||0;
        if(p.plan) STORE.plan=p.plan;
        if(p.paydays) STORE.paydays=p.paydays;
        if(typeof p.showGold==='boolean') STORE.showGold=p.showGold;
      }
    }
  }catch(e){}
  normalizeStore();
}
function persist(){
  try{ localStorage.setItem(SKEY,JSON.stringify(STORE)); }
  catch(e){
    if(view.mode==='web') alert('Kaydedilemedi — tarayıcı depolaması dolu olabilir.');
    else toast('Kaydedilemedi — depolama dolu olabilir');
  }
}
/* her veri değişikliğinde çağrılır: damgala, sakla, buluta gönder */
function touched(){
  STORE.updatedAt=Date.now();
  lsSet('pnl_pristine','');
  persist();
  schedulePush();
}

/* ════════════════════════════════════════════════════════════
   4 · GITHUB GIST SENKRONU
   Her cihaz, en son eşitlendiği bulut sürümünü (base) hatırlar.
   Böylece "kim daha yeni" saat karşılaştırmasına değil,
   "son eşitlemeden beri kim değişti" sorusuna göre karar verilir.
   ════════════════════════════════════════════════════════════ */
function lsGet(k){ try{ return localStorage.getItem(k); }catch(e){ return null; } }
function lsSet(k,v){ try{ if(v==null||v==='') localStorage.removeItem(k); else localStorage.setItem(k,v); }catch(e){} }

var SY={
  token:lsGet('pnl_gh_token')||'',
  gist:lsGet('pnl_gist_id')||'',
  base:+(lsGet('pnl_sync_base')||0),   // son eşitlemedeki bulut sürümü (updatedAt)
  first:'',         // ilk bağlantıda: 'adopt' buluttakini al · 'ask' sor · '' eski kurulum
  state:'off',      // off | ok | busy | err
  msg:'Senkron kapalı',
  at:0
};
var FILE='pnl-data.json';
function syncOn(){ return !!SY.token; }
function setBase(v){ SY.base=v||0; lsSet('pnl_sync_base',SY.base?String(SY.base):''); }
function setSync(st,msg){
  SY.state=st; SY.msg=msg||'';
  if(st==='ok'){ SY.at=Date.now(); }
  paintSync();
}
function syncColor(){
  if(!syncOn()) return 'rgba(27,26,24,.25)';
  return SY.state==='ok'?GREEN:(SY.state==='busy'?'#E09A18':(SY.state==='err'?RUST:'rgba(27,26,24,.25)'));
}
function ghFetch(url,opts){
  opts=opts||{};
  opts.cache='no-store';   // GitHub API yanıtları 60 sn önbelleğe alınabiliyor → hep taze oku
  opts.headers=Object.assign({
    'Authorization':'Bearer '+SY.token,
    'Accept':'application/vnd.github+json',
    'X-GitHub-Api-Version':'2022-11-28'
  },opts.headers||{});
  return fetch(url,opts).then(function(r){
    if(!r.ok) return r.text().then(function(t){
      var e=new Error('GitHub '+r.status+': '+t.slice(0,120)); e.status=r.status; throw e;
    });
    return r.json();
  });
}
function errText(e){
  if(e&&e.status===401) return 'Token geçersiz ya da süresi dolmuş';
  if(e&&e.status===403) return 'GitHub erişimi reddetti (token’da “gist” izni olmalı)';
  if(e&&e.status===404) return 'Bulut dosyası bulunamadı (Gist kimliğini kontrol et)';
  if(e&&e.status) return 'GitHub hatası ('+e.status+')';
  if(navigator.onLine===false) return 'İnternet yok — bağlanınca tekrar denenecek';
  return (e&&e.message)||'Bağlantı kurulamadı';
}
function payload(){
  return JSON.stringify({updatedAt:STORE.updatedAt,years:STORE.years,goal:STORE.goal,alert:STORE.alert,schema:STORE.schema,plan:STORE.plan,paydays:STORE.paydays,showGold:STORE.showGold},null,2);
}
function adopt(remote){
  STORE.updatedAt=remote.updatedAt||0;
  STORE.years=remote.years||{};
  if(typeof remote.goal==='number') STORE.goal=remote.goal;
  if(typeof remote.alert==='number') STORE.alert=remote.alert;
  STORE.schema=remote.schema||0;
  if(remote.plan) STORE.plan=remote.plan;
  if(remote.paydays) STORE.paydays=remote.paydays;
  if(typeof remote.showGold==='boolean') STORE.showGold=remote.showGold;
  normalizeStore();
  persist();
  bindYear(view.year);
}
/* Önce hesaptaki mevcut PNL kutusunu ara, yoksa yeni oluştur */
function findGist(){
  return ghFetch('https://api.github.com/gists?per_page=100').then(function(list){
    for(var i=0;i<list.length;i++){
      if(list[i].files && list[i].files[FILE]) return list[i].id;
    }
    return null;
  }).catch(function(){ return null; });
}
function ensureGist(){
  if(SY.gist) return Promise.resolve(SY.gist);
  return findGist().then(function(id){
    if(id){ SY.gist=id; lsSet('pnl_gist_id',id); return id; }
    return createGist().then(function(g){ return g.id; });
  });
}
function createGist(){
  var files={}; files[FILE]={content:payload()};
  return ghFetch('https://api.github.com/gists',{
    method:'POST',
    headers:{'Content-Type':'application/json'},
    body:JSON.stringify({description:'PNL verisi — kişisel gelir/gider',public:false,files:files})
  }).then(function(g){
    SY.gist=g.id;
    lsSet('pnl_gist_id',g.id);
    return g;
  });
}
function readRemote(){
  return ensureGist().then(function(){
    return ghFetch('https://api.github.com/gists/'+SY.gist);
  }).then(function(g){
    var f=g.files&&g.files[FILE];
    if(!f) return null;
    if(f.truncated&&f.raw_url) return fetch(f.raw_url,{cache:'no-store'}).then(function(r){ return r.text(); }).then(JSON.parse);
    return JSON.parse(f.content);
  });
}
function writeRemote(){
  var sent=STORE.updatedAt, files={};
  files[FILE]={content:payload()};
  var body=JSON.stringify({files:files});
  return ensureGist().then(function(){
    return ghFetch('https://api.github.com/gists/'+SY.gist,{
      method:'PATCH',
      headers:{'Content-Type':'application/json'},
      body:body,
      keepalive:body.length<60000      // uygulama kapanırken bile gönderim tamamlansın
    });
  }).then(function(){
    setBase(sent);
    setSync('ok','Kaydedildi');
    if(STORE.updatedAt!==sent) schedulePush();   // gönderirken yeni değişiklik olduysa
  });
}
function takeRemote(remote,msg){
  adopt(remote);
  lsSet('pnl_pristine','');
  setBase(remote.updatedAt||0);
  setSync('ok',msg);
  requestRender();
}
function when(t){
  if(!t) return 'bilinmeyen zaman';
  var d=new Date(t);
  return d.toLocaleDateString('tr-TR',{day:'numeric',month:'long'})+' '+hm(t);
}
function hm(t){ return new Date(t).toLocaleTimeString('tr-TR',{hour:'2-digit',minute:'2-digit'}); }
function reconcile(remote){
  if(!remote) return writeRemote();
  var rAt=remote.updatedAt||0, lAt=STORE.updatedAt;
  if(rAt===lAt){ setBase(rAt); setSync('ok','Güncel'); return; }

  /* bu cihaz bu bulutla hiç eşitlenmemiş */
  if(!SY.base){
    var first=SY.first; SY.first='';
    /* QR/kod ile bağlandıysa ya da bu cihazda hiç değişiklik yapılmadıysa: buluttakini al.
       (Eskiden yeni telefonun örnek verisi "daha yeni" sayılıp bilgisayardakinin üstüne yazılıyordu.) */
    if(first==='adopt'||lsGet('pnl_pristine')) return takeRemote(remote,'Bilgisayardaki veriler alındı');
    if(first==='ask'){
      var rNew=rAt>lAt;
      var a='buluttakini bu cihaza al', b='bu cihazdakini buluta yaz';
      if(confirm('Hem bu cihazda hem bulutta PNL verisi var.\n\nBulut: '+when(rAt)+'\nBu cihaz: '+when(lAt)+'\n\nTamam → '+(rNew?a:b)+' (daha yeni olan)\nİptal → '+(rNew?b:a)) === rNew)
        return takeRemote(remote,'Buluttan alındı');
      return writeRemote();
    }
    /* eski kurulum: bir kereliğine eski davranış (yeni olan kazanır) */
    if(rAt>lAt) return takeRemote(remote,'Diğer cihazdan güncellendi');
    return writeRemote();
  }

  var remoteChanged=(rAt!==SY.base), localChanged=(lAt!==SY.base);
  if(remoteChanged&&!localChanged) return takeRemote(remote,'Diğer cihazdan güncellendi');
  if(!remoteChanged) return writeRemote();
  /* iki tarafta da değişiklik var */
  if(confirm('Hem bu cihazda hem diğer cihazda yeni değişiklik var.\n\nTamam → diğer cihazdakini al ('+when(rAt)+')\nİptal → bu cihazdakini gönder ('+when(lAt)+')'))
    return takeRemote(remote,'Diğer cihazdan güncellendi');
  return writeRemote();
}
var syncP=null, syncAgain=false, pushT=null;
function sync(){
  if(!syncOn()) return Promise.resolve();
  clearTimeout(pushT); pushT=null;
  if(syncP){ syncAgain=true; return syncP; }
  setSync('busy','Eşitleniyor…');
  syncP=readRemote().then(reconcile)
    .catch(function(e){ setSync('err',errText(e)); })
    .then(function(){
      syncP=null;
      if(syncAgain){ syncAgain=false; return sync(); }
    });
  return syncP;
}
/* elle: buluttakini zorla al / bu cihazdakini zorla gönder */
function forcePull(){
  if(!syncOn()) return Promise.resolve();
  setSync('busy','Buluttan alınıyor…');
  return readRemote().then(function(r){
    if(!r) throw new Error('Bulutta henüz veri yok');
    takeRemote(r,'Buluttan alındı');
  }).catch(function(e){ setSync('err',errText(e)); });
}
function forcePush(){
  if(!syncOn()) return Promise.resolve();
  STORE.updatedAt=Date.now(); persist();
  setSync('busy','Gönderiliyor…');
  return writeRemote().catch(function(e){ setSync('err',errText(e)); });
}
function schedulePush(){
  if(!syncOn()) return;
  clearTimeout(pushT);
  setSync('busy','Kaydediliyor…');
  pushT=setTimeout(sync,1200);
}
function connectWith(cfg,first){
  SY.token=cfg.token; SY.gist=cfg.gist||'';
  lsSet('pnl_gh_token',SY.token); lsSet('pnl_gist_id',SY.gist);
  setBase(0); SY.first=first||'ask';
  return sync();
}
function disconnect(){
  clearTimeout(pushT); pushT=null;
  SY.token=''; SY.gist=''; SY.first='';
  lsSet('pnl_gh_token',''); lsSet('pnl_gist_id',''); setBase(0);
  setSync('off','Senkron kapalı');
}
function paintSync(){
  var col=syncColor(), i, n;
  n=document.querySelectorAll('[data-sdot]');
  for(i=0;i<n.length;i++) n[i].style.background=col;
  n=document.querySelectorAll('[data-slbl]');
  for(i=0;i<n.length;i++){ n[i].textContent=syncLabel(); n[i].style.color=(SY.state==='err'?RUST:''); }
  n=document.querySelectorAll('[data-sshort]');
  for(i=0;i<n.length;i++) n[i].textContent=syncShort();
}
function syncLabel(){
  if(!syncOn()) return 'Senkron kapalı · veriler sadece bu cihazda';
  var s=SY.msg||'—';
  if(SY.state==='ok'&&SY.at) s+=' · '+hm(SY.at);
  return s;
}
function syncShort(){
  if(!syncOn()) return 'Bağlı değil';
  if(SY.state==='busy') return 'Eşitleniyor…';
  if(SY.state==='err') return 'Senkron hatası · dokun';
  return SY.at?('Güncel · '+hm(SY.at)):'Bağlı';
}

/* ---------- başka cihazı bağlama: QR / kod ---------- */
function linkCode(){ return btoa(JSON.stringify({t:SY.token,g:SY.gist})).replace(/=+$/,''); }
function linkURL(){ return location.href.split('#')[0]+'#baglan='+linkCode(); }
function parseLink(txt){
  txt=String(txt||'').trim();
  var i=txt.indexOf('baglan=');
  if(i>=0) txt=txt.slice(i+7);
  try{ txt=decodeURIComponent(txt); }catch(e){}
  try{
    var o=JSON.parse(atob(txt+'==='.slice((txt.length+3)%4)));
    if(o&&o.t) return {token:String(o.t),gist:String(o.g||'')};
  }catch(e){}
  if(/^(ghp_|github_pat_|gho_)\w+$/.test(txt)) return {token:txt,gist:''};
  return null;
}
function consumeHash(){
  var m=/[#&]baglan=([^&]+)/.exec(location.hash||'');
  if(!m) return false;
  try{ history.replaceState(null,'',location.pathname+location.search); }catch(e){}
  var cfg=parseLink(m[1]);
  if(!cfg) return false;
  SY.token=cfg.token; SY.gist=cfg.gist;
  lsSet('pnl_gh_token',SY.token); lsSet('pnl_gist_id',SY.gist);
  setBase(0); SY.first='adopt';
  return true;
}
function drawQR(el,text){

}

/* ════════════════════════════════════════════════════════════
   5 · GÖRÜNÜM DURUMU
   ════════════════════════════════════════════════════════════ */
var view={
  year:2026,
  month:(nowD.getFullYear()===2026?nowD.getMonth():0),
  tab:'ozet',          // mobil: ozet | tablo | ayar
  mode:null            // web | mob
};
var state={year:2026,groups:[],opening:0};
function bindYear(y){
  view.year=y; state.year=y;
  var Y=STORE.years[y]||migrateYear(y);
  STORE.years[y]=Y;
  state.groups=Y.groups;
  state.opening=openingOf(y);
}
/* açılış bakiyesi: elle girildiyse o, yoksa önceki yılın yıl sonu nakdi */
function openingOf(y){
  var Y=STORE.years[y]; if(!Y) return 0;
  if(Y.opening!=null) return +Y.opening||0;
  var i=YEARS.indexOf(y);
  if(i<=0) return 0;
  var py=YEARS[i-1];
  return STORE.years[py]?computeFor(STORE.years[py].groups,openingOf(py)).balance[11]:0;
}
function curMonth(){ return (state.year===nowD.getFullYear())?nowD.getMonth():-1; }
function ytdLimit(){ var c=curMonth(); return c>=0?c:11; }
function ytd(arr){ var l=ytdLimit(),s=0; for(var i=0;i<=l;i++){ s+=arr[i]; } return s; }

/* ════════════════════════════════════════════════════════════
   6 · HESAPLAMA
   ════════════════════════════════════════════════════════════ */
/* Kalemin türü:
   gelir   → Gelir grupları (yatırım satışı hariç)
   satis   → Gelir tipindeki gruplarda hisse/altın işaretli kalemler (Yatırım Satışları)
   gider   → Gider grupları (sabit / değişken)
   alim    → Yatırım grubu ya da gider grubunda hisse/altın işaretli kalem
   realize → Realize K/Z (nakit değil, sadece yatırımda kalanı düzeltir) */
function itemKind(g,it){
  if(g.type==='realize') return 'realize';
  if(g.type==='revenue') return it.invest?'satis':'gelir';
  if(g.type==='invest') return 'alim';
  return it.invest?'alim':'gider';
}
function zeros(){ return new Array(12).fill(0); }
/* ekranda gösterilecek kalemler (altın gizliyse altın satırları hariç — hesaplara yine dahil) */
function shownItems(g){ return STORE.showGold?g.items:g.items.filter(function(it){ return it.invest!=='altin'; }); }
function hiddenSum(g){ /* gizli altın satırlarının o yılki toplamı */
  if(STORE.showGold) return 0;
  var t=0; g.items.forEach(function(it){ if(it.invest==='altin') t+=Math.abs(yearSum(it.values)); }); return t;
}
function computeFor(groups,opening){
  var sub={}, revenue=zeros(), cost=zeros(), fixed=zeros(), variable=zeros(),
      buy=zeros(), sell=zeros(), realize=zeros();
  groups.forEach(function(g){
    var a=zeros();
    g.items.forEach(function(it){
      var k=itemKind(g,it);
      it.values.forEach(function(v,m){
        v=+v||0; a[m]+=v;
        if(k==='gelir') revenue[m]+=v;
        else if(k==='satis') sell[m]+=v;
        else if(k==='alim') buy[m]+=v;
        else if(k==='realize') realize[m]+=v;
        else { cost[m]+=v; if(g.cat==='degisken') variable[m]+=v; else fixed[m]+=v; }
      });
    });
    sub[g.id]=a;
  });
  var saving=revenue.map(function(r,m){ return r-cost[m]; });          /* gerçek tasarruf: yatırım gider sayılmaz */
  var invNet=buy.map(function(b,m){ return b-sell[m]; });               /* yatırıma giden net nakit */
  var balance=[], run=opening;
  saving.forEach(function(sv,m){ run+=sv-invNet[m]; balance[m]=run; }); /* banka (nakit) */
  return {sub:sub,revenue:revenue,cost:cost,fixed:fixed,variable:variable,buy:buy,sell:sell,
          invNet:invNet,realize:realize,saving:saving,balance:balance};
}
/* bir yılın hisse/altın hareketi: alım + realize ekler, satış düşer */
function investYear(groups,upto){
  var r={hisse:0,altin:0}, last=(upto==null?11:upto);
  groups.forEach(function(g){
    g.items.forEach(function(it){
      if(it.invest!=='hisse'&&it.invest!=='altin') return;
      var k=itemKind(g,it), sign=(k==='satis')?-1:1, t=0;
      for(var i=0;i<=last;i++) t+=(+it.values[i]||0);
      r[it.invest]+=sign*t;
    });
  });
  return r;
}
/* önceki yıllardan devreden yatırım */
function heldBefore(y){
  var r={hisse:0,altin:0};
  YEARS.forEach(function(yy){
    if(yy>=y||!STORE.years[yy]) return;
    var t=investYear(STORE.years[yy].groups,11); r.hisse+=t.hisse; r.altin+=t.altin;
  });
  return r;
}
function compute(){
  var c=computeFor(state.groups,state.opening);
  /* yatırımda kalan (kümülatif, önceki yıllar dahil) ve toplam varlık */
  var b=heldBefore(state.year), held=[], wealth=[], hs={hisse:b.hisse,altin:b.altin};
  for(var m=0;m<12;m++){
    state.groups.forEach(function(g){
      g.items.forEach(function(it){
        if(it.invest!=='hisse'&&it.invest!=='altin') return;
        hs[it.invest]+=((itemKind(g,it)==='satis')?-1:1)*(+it.values[m]||0);
      });
    });
    held[m]=Math.max(0,hs.hisse)+Math.max(0,hs.altin);
    wealth[m]=c.balance[m]+held[m];
  }
  c.held=held; c.wealth=wealth; c.heldStart=Math.max(0,b.hisse)+Math.max(0,b.altin);
  return c;
}
/* yatırımda kalan (net, önceki yıllar dahil) */
function investSplit(upto){
  var b=heldBefore(state.year), t=investYear(state.groups,upto);
  var hisse=Math.max(0,b.hisse+t.hisse), altin=Math.max(0,b.altin+t.altin);
  return {hisse:hisse,altin:altin,sum:hisse+altin};
}

/* ---------- haftalık yatırım planı ----------
   Maaş her ay "payday"de yatar. O maaştan bir sonraki maaşa kadar
   kaç tane yatırım günü (haftanın "weekday"i) varsa o ay o kadar hafta yatırılır. */
var WEEKDAYS=['Pazar','Pazartesi','Salı','Çarşamba','Perşembe','Cuma','Cumartesi'];
function payKey(y,m){ return y+'-'+(m<9?'0':'')+(m+1); }
function payDay(y,m){ var o=STORE.paydays[payKey(y,m)]; return (typeof o==='number')?o:STORE.plan.payday; }
function payMarked(y,m){ return typeof STORE.paydays[payKey(y,m)]==='number'; }
function payDate(y,m){ var last=new Date(y,m+1,0).getDate(); return new Date(y,m,Math.min(payDay(y,m),last)); }
function planWeeks(y,m){
  var P=STORE.plan, a=payDate(y,m), b=payDate(m===11?y+1:y,(m+1)%12), n=0;
  for(var d=new Date(a);d<b;d.setDate(d.getDate()+1)) if(d.getDay()===P.weekday) n++;
  return n;
}
function planAmount(y,m){ return planWeeks(y,m)*(STORE.plan.weekly||0); }
function planItem(){
  var name=String(STORE.plan.item||'').toLocaleLowerCase('tr');
  for(var i=0;i<state.groups.length;i++){
    var g=state.groups[i]; if(g.type!=='invest') continue;
    for(var j=0;j<g.items.length;j++) if(String(g.items[j].name).toLocaleLowerCase('tr')===name) return {g:g,it:g.items[j]};
  }
  return null;
}

   7 · MUTASYONLAR  (web tarafında kullanılır)
   ════════════════════════════════════════════════════════════ */
function find(gid){ for(var i=0;i<state.groups.length;i++){ if(state.groups[i].id===gid) return state.groups[i]; } return null; }
function findItem(g,iid){ for(var i=0;i<g.items.length;i++){ if(g.items[i].id===iid) return g.items[i]; } return null; }
/* ---------- web: geri al ----------
   Her değişiklikten önce verinin bir kopyası alınır; "Geri al" / Ctrl+Z son kopyaya döner. */
var UNDO=[];
function snapState(){ return JSON.stringify({years:STORE.years,plan:STORE.plan,paydays:STORE.paydays,showGold:STORE.showGold,goal:STORE.goal,alert:STORE.alert}); }
function webSnap(label){
  UNDO.push({label:label,data:snapState()});
  if(UNDO.length>40) UNDO.shift();
}
function webUndo(){
  var u=UNDO.pop();
  if(!u){ webToast('Geri alınacak bir şey yok'); return; }
  var d=JSON.parse(u.data);
  STORE.years=d.years; STORE.plan=d.plan; STORE.paydays=d.paydays; STORE.showGold=d.showGold; STORE.goal=d.goal; STORE.alert=d.alert;

var webToastT=null;
function webToast(msg,act){
  if(view.mode!=='web') return;
  var old=document.getElementById('webToast'); if(old) old.remove();
  clearTimeout(webToastT);
  var el=document.createElement('div'); el.id='webToast';
  el.style.cssText='position:fixed;left:50%;bottom:24px;transform:translateX(-50%);z-index:90;display:flex;align-items:center;gap:14px;'+
    'background:#3a342c;color:#f3ecdf;padding:11px 12px 11px 18px;border-radius:12px;font:600 13.5px Karla,system-ui,sans-serif;box-shadow:0 8px 24px rgba(0,0,0,.25);max-width:90vw';
  el.innerHTML='<span>'+esc(msg)+'</span>'+
    (act!==false?'<button style="background:#5a5142;border:none;color:#f4d58a;font:700 13px Karla,system-ui,sans-serif;padding:6px 10px;border-radius:8px;cursor:pointer">'+esc(act||'Geri al')+'</button>':'');
  var b=el.querySelector('button');
  if(b) b.onclick=function(){ el.remove(); webUndo(); };
  document.body.appendChild(el);
  webToastT=setTimeout(function(){ el.remove(); },7000);
}

function setCell(gid,iid,m,raw){

  var nv=num(raw); if((+it.values[m]||0)===nv) return;
  webSnap(it.name+' · '+MONTHS[m]);
  it.values[m]=nv; touched(); refreshSummary();
  webToast(it.name+' · '+MONTHS_L[m]+' '+state.year+': '+fmtPlain(nv));
}
function setName(gid,iid,name){
  var g=find(gid),it=g&&findItem(g,iid); if(!it) return;
  webSnap('ad değişikliği');
  it.name=name; touched();
}
function addItem(gid){
  var g=find(gid); if(!g) return;
  webSnap('yeni satır');
  g.items.push({id:uid('i'),name:'Yeni kalem',values:new Array(12).fill(0)});
  touched(); render();
}
function delItem(gid,iid){
  var g=find(gid); if(!g) return;
  var it=findItem(g,iid); if(!it) return;
  if(it.values.some(function(v){ return Math.abs(+v||0)>0.005; })&&
     !confirm('“'+it.name+'” satırı ve içindeki '+state.year+' tutarları silinsin mi? (Geri alabilirsin)')) return;
  webSnap('“'+it.name+'” silindi');
  g.items=g.items.filter(function(x){ return x.id!==iid; });
  touched(); render();
  webToast('“'+it.name+'” silindi');

function setOpening(raw){

  var auto=(String(raw).trim()===''&&state.year!==YEARS[0]);
  if(view.mode==='web') webSnap('açılış bakiyesi');
  STORE.years[state.year].opening=auto?null:num(raw);

}

/* ---------- yedek ---------- */
function exportBackup(){
  var blob=new Blob([payload()],{type:'application/json'});
  var url=URL.createObjectURL(blob);
  var a=document.createElement('a'); a.href=url; a.download='pnl-yedek.json';
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(function(){ URL.revokeObjectURL(url); },1000);
}
function importBackup(file,done){
  var reader=new FileReader();
  reader.onload=function(){
    try{
      var d=JSON.parse(reader.result);
      if(d.years) adopt(d);
      else if(Array.isArray(d.groups)){   // eski tek-yıl yedeği
        var y=d.year||state.year;
        STORE.years[y]=normYear({opening:(typeof d.opening==='number'?d.opening:null),groups:d.groups},y);
        bindYear(y);
      } else throw new Error('bilinmeyen biçim');
      touched(); render(); if(done) done(true);
    }catch(err){ if(done) done(false); else alert('Yedek dosyası okunamadı.'); }
  };
  reader.readAsText(file);
}

var GRID='180px repeat(12, minmax(0,1fr)) 84px';

  if(g.type==='realize') return 'realize';

function posNeg(v){ return v<0?'#ef4444':'#16a85a'; }

function rowSpec(c){
  var R={};
  state.groups.forEach(function(g){
    var isR=g.type==='realize';
    var rc=isR?function(v){ return v<0?'#dc2626':(v>0?'#16a85a':'#5a5142'); }:null;
    R['sub:'+g.id]={arr:c.sub[g.id],year:yearSum(c.sub[g.id]),col:rc,blank:true};
    g.items.forEach(function(it){
      R['it:'+g.id+':'+it.id]={year:yearSum(it.values),plainYear:true,col:isR?function(v){ return v<0?'#dc2626':'#8a7f6f'; }:null};
    });
  });
  R.revenue={arr:c.revenue,year:yearSum(c.revenue)};
  R.fixed={arr:c.fixed,year:yearSum(c.fixed)};
  R.variable={arr:c.variable,year:yearSum(c.variable)};
  R.cost={arr:c.cost,year:yearSum(c.cost)};
  R.saving={arr:c.saving,year:yearSum(c.saving),col:posNeg};
  R.invNet={arr:c.invNet,year:yearSum(c.invNet)};
  R.bal={arr:c.balance,year:c.balance[11],col:function(v){ return v<0?'#ff9b8e':'#e3c98a'; },ycol:function(){ return '#e3a23f'; }};
  R.held={arr:c.held,year:c.held[11]};
  R.wealth={arr:c.wealth,year:c.wealth[11],col:function(v){ return v<0?'#ef4444':'#3a342c'; }};
  return R;
}
function rkText(R,v,isYear){
  if(isYear) return R.plainYear?fmtPlain(v):fmt(v);
  return (R.blank&&!v)?'':fmtPlain(v);
}

      '<line x1="8" y1="'+zeroY+'" x2="592" y2="'+zeroY+'" stroke="#d8cab0" stroke-width="1" stroke-dasharray="4 4"></line>'+

    '<div style="display:flex;align-items:baseline;justify-content:space-between;margin-bottom:6px">'+

        '<text x="80" y="94" font-size="16" fill="#3a342c" text-anchor="middle" font-family="Fraunces" font-weight="600">'+fmt(invSum)+'</text>'+
      '</svg>'+

            'color:'+(we?'#c2410c':(mk?'#1f5f8b':'#93b3cb'))+';font-weight:'+(mk?'700':'600')+';'+hl(m))+'">'+
          (mk?'<span style="width:6px;height:6px;border-radius:9px;background:#1f5f8b;pointer-events:none"></span>':'')+
          '<span style="pointer-events:none">'+d.getDate()+' '+WD_S[d.getDay()]+'</span>'+
          '<input type="date" data-act="payday" data-m="'+m+'" min="'+iso(1)+'" max="'+iso(last)+'" value="'+iso(d.getDate())+'" tabindex="-1" '+
            'style="position:absolute;left:0;bottom:0;width:1px;height:1px;opacity:0;border:0;padding:0;pointer-events:none">'+
        '</div>';
      }).join('')+
      '<div style="'+totCellBase('background:#f2f7fb;border-bottom:1px solid #dbe8f2;font-size:10.5px;color:#93b3cb;font-weight:600')+'">'+
        (any?'<button data-act="payday-reset" style="background:none;border:none;color:#4f7fa3;font-size:10.5px;font-weight:700;cursor:pointer;text-decoration:underline">sıfırla</button>':'varsayılan '+STORE.plan.payday)+'</div>'+
    '</div>';
  }

  /* compact: başlık ve toplam satırı olmadan, sadece kalemler (en alttaki satış / kâr-zarar için) */
  function groupBlock(g,label,compact){
    var isRealize=(g.type==='realize');
    var tint=rgba(g.color,0.1);
    var gB='1px solid '+rgba(g.color,0.25);
    var pl=(g.type==='invest')?planItem():null;
    var html='';
    if(!compact) html+='<div style="display:grid;grid-template-columns:'+GRID+';background:'+tint+'">'+
      '<div style="'+labelBase('background:'+tint+';color:'+g.color+';border-left:3px solid '+g.color+';border-bottom:'+gB)+'">'+
        '<span style="display:inline-flex;align-items:center;justify-content:space-between;width:100%">'+
          '<span style="font-family:\'Fraunces\';font-size:13.5px;font-weight:600;letter-spacing:.3px">'+esc(label||g.name)+'</span>'+
          '<button data-act="add" data-g="'+g.id+'" style="background:none;border:1px solid currentColor;color:inherit;opacity:.6;border-radius:6px;font-size:11px;font-weight:700;padding:1px 6px;cursor:pointer;flex:none">+ satır</button>'+
        '</span>'+
      '</div>'+
      MONTHS.map(function(_,m){ return '<div style="'+numCellBase('background:'+tint+';border-bottom:'+gB+';'+hl(m))+'"></div>'; }).join('')+
      '<div style="'+totCellBase('background:'+tint+';border-bottom:'+gB)+'"></div>'+
    '</div>';
    shownItems(g).forEach(function(it){
      var cells=it.values.map(function(v,m){
        var isHL=(m===cm);
        return '<div style="'+numCellBase((isHL?'background:rgba(227,162,63,.08);box-shadow:'+sideHL+';':''))+'">'+
          '<input class="pnl-cell" data-act="cell" data-g="'+g.id+'" data-i="'+it.id+'" data-m="'+m+'" value="'+(v===0?'':String(v))+'" inputmode="text" placeholder="0" '+
            'style="width:100%;border:none;background:transparent;text-align:right;font-size:12px;color:'+(isRealize&&v<0?'#dc2626':'#3a342c')+';padding:3px 2px;outline:none">'+
        '</div>';
      }).join('');
      var IR=R['it:'+g.id+':'+it.id];
      html+='<div style="display:grid;grid-template-columns:'+GRID+';background:#fbf8f2">'+
        '<div style="'+labelBase('background:#fbf8f2;'+(compact?'border-left:3px solid '+g.color+';':''))+'">'+
          '<span style="display:inline-flex;align-items:center;gap:6px;width:100%">'+
            '<input data-act="name" data-g="'+g.id+'" data-i="'+it.id+'" value="'+esc(it.name)+'" style="flex:1;min-width:0;border:none;background:transparent;font-size:12.5px;color:#3a342c;font-weight:500;outline:none;padding:2px 0">'+
            '<button data-act="del" data-g="'+g.id+'" data-i="'+it.id+'" style="background:none;border:none;color:#cdbb9c;font-size:13px;cursor:pointer;flex:none;line-height:1">×</button>'+
          '</span>'+
        '</div>'+cells+
        '<div data-rk="it:'+g.id+':'+it.id+'" data-m="y" style="'+totCellBase('border-bottom:1px solid #f0e8d8;color:'+(IR.col?IR.col(IR.year):'#8a7f6f')+';font-weight:600')+'">'+fmtPlain(IR.year)+'</div>'+
      '</div>';
      if(pl&&pl.it===it) html+=planRow(it)+payRow();
    });
    if(compact) return html;
    var S=R['sub:'+g.id];
    var subLabel=(isRealize?'Net Kâr / Zarar':('Toplam '+(label||g.name))); if(hiddenSum(g)>0.005) subLabel=(isRealize?'Net K/Z':'Toplam')+' · altın dahil';
    var subColor=isRealize?(S.year<0?'#dc2626':(S.year>0?'#16a85a':g.color)):g.color;
    html+='<div style="display:grid;grid-template-columns:'+GRID+';background:#f3ecdd">'+
      '<div style="'+labelBase('background:#f3ecdd;color:'+subColor+';font-weight:700;border-bottom:1px solid #e4d9c2')+'">'+esc(subLabel)+'</div>'+
      S.arr.map(function(v,m){
        return '<div data-rk="sub:'+g.id+'" data-m="'+m+'" style="'+numCellBase('background:#f3ecdd;border-bottom:1px solid #e4d9c2;font-weight:700;color:'+(S.col?S.col(v):'#5a5142')+';'+hl(m))+'">'+rkText(S,v)+'</div>';
      }).join('')+
      '<div data-rk="sub:'+g.id+'" data-m="y" style="'+totCellBase('background:#f3ecdd;border-bottom:1px solid #e4d9c2;font-weight:700;color:'+(S.col?S.col(S.year):subColor)+';font-family:Fraunces')+'">'+fmt(S.year)+'</div>'+
    '</div>';
    return html;
  }
  function saleHelp(){
    return '<div style="padding:2px 14px 10px;background:#fbf8f2;font-size:12px;color:#a8987c;line-height:1.55;max-width:980px">'+
      'Sattığında iki satır doldur: <b>Satış</b>’a eline geçen parayı, <b>K/Z</b>’ye kârı (+) ya da zararı (−). '+
      '<b>Örnek:</b> 100 €’ya aldığın hisseyi 90 €’ya sattın → Hisse Satışı = 90, Hisse K/Z = −10. '+
      'Satış parası bankaya girer, o hisse “Yatırımda kalan”dan düşer.</div>';
  }

  var by={income:[],fixed:[],variable:[],invest:[],realize:[]};
  state.groups.forEach(function(g){ by[webKind(g)].push(g); });
  /* yatırım bölümünde önce alımlar, sonra satışlar */
  by.invest.sort(function(a,b){ return (a.type==='invest'?0:1)-(b.type==='invest'?0:1); });

  var body='';
  if(by.income.length){ body+=band('Gelir','',''); by.income.forEach(function(g){ body+=groupBlock(g); }); }
  if(by.fixed.length){
    body+=band('Sabit giderler','her ay düzenli giden','');
    by.fixed.forEach(function(g){ body+=groupBlock(g); });
    if(by.fixed.length>1) body+=sumRow('fixed','Toplam Sabit Gider',{bg:'#ece2cf',fg:'#5a5142'});
  }
  if(by.variable.length){
    body+=band('Değişken giderler','tek seferlik / düzensiz','');
    by.variable.forEach(function(g){ body+=groupBlock(g,by.variable.length===1&&g.name==='Değişken'?'Değişken':null); });
    if(by.variable.length>1) body+=sumRow('variable','Toplam Değişken Gider',{bg:'#ece2cf',fg:'#5a5142'});
  }
  body+=sumRow('cost','Toplam Gider',{bg:'#e8dcc5',fg:'#5a5142',border:'border-top:2px solid #ddceb2;'});
  body+=sumRow('saving','Net Tasarruf',{bg:'#efe7d6',lfg:'#3a342c',label:'font-size:13.5px;'});
  var buys=by.invest.filter(function(g){ return g.type==='invest'; });
  var sales=by.invest.filter(function(g){ return g.type!=='invest'; });
  if(buys.length){
    body+=band('Yatırım','gider değil — bankadan çıkar, varlığında kalır',C_BLUE);
    buys.forEach(function(g){ body+=groupBlock(g); });
  }
  body+=band('Param ne durumda','ay sonu','#3a342c');
  body+=sumRow('bal','Banka (Nakit)',{bg:'#3a342c',lfg:'#f3ecdf',ybg:'#3a342c',border:'border-bottom:1px solid #4a433a;'});
  body+=sumRow('held','Yatırımda Kalan',{bg:'#2f4a5c',fg:'#a9d3ef',lfg:'#e6f2fa',border:'border-bottom:1px solid #3d5a6e;'});
  body+=sumRow('wealth','Toplam Varlık',{bg:'#f4e3b8',lfg:'#3a342c',label:'font-size:13.5px;',last:true});
  if(sales.length||by.realize.length){
    body+=band('Satış ve kâr / zarar','sadece hisse sattığın ay doldur','#a8957a');
    body+=saleHelp();
    sales.forEach(function(g){ body+=groupBlock(g,null,true); });
    by.realize.forEach(function(g){ body+=groupBlock(g,null,true); });
  }
  return head+body;
}

function refreshSummary(){
  if(view.mode!=='web') return;
  var tz=document.getElementById('topzone');
  if(tz) tz.innerHTML=buildTop();
  var c=compute(), R=rowSpec(c);
  var els=document.querySelectorAll('[data-rk]');
  for(var i=0;i<els.length;i++){
    var el=els[i], S=R[el.getAttribute('data-rk')]; if(!S) continue;
    var mm=el.getAttribute('data-m'), isY=(mm==='y'), v=isY?S.year:S.arr[+mm];
    el.textContent=rkText(S,v,isY);
    var col=isY&&S.ycol?S.ycol(v):(S.col?S.col(v):null);
    if(col) el.style.color=col;
  }
  var on=document.getElementById('openNote');
  if(on&&state.year!==YEARS[0]){
    var auto=STORE.years[state.year].opening==null;
    on.textContent=auto?'otomatik · '+YEARS[YEARS.indexOf(state.year)-1]+' sonundan':'elle girildi · silersen otomatik';
    var oi=document.querySelector('input[data-act="opening"]'); if(oi&&auto) oi.placeholder=fmtPlain(state.opening);
  }
  paintSync();
}

function planApply(){
  var pi=planItem(); if(!pi){ alert('Yatırım grubunda “'+STORE.plan.item+'” adlı kalem yok. Plan ayarından kalemi seç.'); return; }
  var cm=curMonth(), from=(cm>=0?cm:(state.year>nowD.getFullYear()?0:12));
  if(from>11){ alert(state.year+' geçmiş bir yıl — plan sadece bu aydan sonrasına uygulanır.'); return; }
  var list=[]; for(var m=from;m<12;m++) list.push(MONTHS[m]+' '+fmtPlain(planAmount(state.year,m)));
  if(!confirm('“'+pi.it.name+'” satırına plan tutarları yazılsın mı?\n\n'+list.join(' · ')+'\n\nGeçmiş aylar değişmez.')) return;
  webSnap('plan uygulandı');
  for(var k=from;k<12;k++) pi.it.values[k]=planAmount(state.year,k);
  touched(); render();
  webToast('Plan '+MONTHS[from]+'–Ara için uygulandı');
}
function setPayday(m,val){
  var k=payKey(state.year,m);
  var d=val?+String(val).split('-')[2]:0;
  webSnap('maaş günü');
  if(!d||d===STORE.plan.payday) delete STORE.paydays[k]; else STORE.paydays[k]=d;
  touched(); render();
}
function pickPayday(cell,m){
  var inp=cell.querySelector('input[type=date]');
  if(inp&&inp.showPicker){ try{ inp.showPicker(); return; }catch(e){} }
  var cur=payDate(state.year,m).getDate();
  var v=prompt(MONTHS_L[m]+' '+state.year+' maaş günü (1–31):',cur);
  if(v==null) return;
  var d=Math.round(num(v)); if(d<1||d>31) return;
  setPayday(m,state.year+'-'+(m+1)+'-'+d);
}

function initialOf(name){
  var t=String(name||'').trim();
  if(!t) return '·';
  return t.charAt(0).toLocaleUpperCase('tr');
}
/* o ay hisseye giden nakit (alım − satış) */
function stockFlow(m){
  var v=0;
  state.groups.forEach(function(g){
    if(g.type==='realize') return;
    var sign=g.type==='revenue'?-1:1;
    g.items.forEach(function(it){ if(it.invest==='hisse') v+=sign*(+it.values[m]||0); });
  });
  return v;
}
function clampPct(x){ return Math.max(0,Math.min(100,Math.round(x))); }
function round2(x){ return Math.round(x*100)/100; }
function inferInvest(name){
  var n=String(name||'').trim();
  if(n==='Altın'||n==='Altın Satışı'||n==='Altın K/Z') return 'altin';
  if(n==='Hisse'||n==='Hisse Satışı'||n==='Hisse K/Z') return 'hisse';
  return undefined;
}
function byName(g,name){
  var key=String(name||'').trim().toLocaleLowerCase('tr');
  return g.items.filter(function(x){ return String(x.name||'').trim().toLocaleLowerCase('tr')===key; })[0]||null;
}
function locate(iid){
  for(var i=0;i<state.groups.length;i++){
    var it=findItem(state.groups[i],iid);
    if(it) return {g:state.groups[i],it:it};
  }
  return null;
}

/* ---------- son kullanılan kalemler (hızlı ekle için, cihaza özel) ---------- */
function recentIds(){ try{ return JSON.parse(lsGet('pnl_recent')||'[]'); }catch(e){ return []; } }
function pushRecent(iid){
  var r=recentIds().filter(function(x){ return x!==iid; });
  r.unshift(iid);
  lsSet('pnl_recent',JSON.stringify(r.slice(0,12)));
}
function quickItems(){
  var out=[], seen={};
  recentIds().forEach(function(id){
    var x=locate(id);
    if(x&&!seen[id]&&x.g.type!=='realize'&&(STORE.showGold||x.it.invest!=='altin')){ out.push(x); seen[id]=1; }
  });
  ['Günlük','Ev'].forEach(function(name){
    state.groups.forEach(function(g){
      if(g.name!==name) return;
      shownItems(g).forEach(function(it){ if(!seen[it.id]){ out.push({g:g,it:it}); seen[it.id]=1; } });
    });
  });
  return out.slice(0,8);
}

function wireMobShell(){

  });

function yearStrip(c,win){
  var cm=curMonth(), sm=view.month;
  var mx=Math.max(1,Math.max.apply(null,c.saving.map(function(v){ return Math.abs(v); })));
  var low=STORE.alert||0;
  var box=document.createElement('div'); box.className='ystrip'+(win?' slim':'');
  c.saving.forEach(function(v,i){
    var sel=(i===sm), inw=win&&i>=win[0]&&i<=win[1];
    var col=v<0?(sel?'#f0a58f':RUST):(sel?'#8fd9b1':GREEN);
    var op=sel?1:(v<0?.55:.45);
    if(c.balance[i]<low){ col=sel?'#f0a58f':RUST; op=1; }
    var b=document.createElement('button');
    b.className='ys'+(sel?' sel':'')+(inw&&!sel?' in':'')+(i===cm?' cur':'');
    b.setAttribute('aria-label',MONTHS_L[i]);

    b.onclick=function(){ pickMonth(i); };
    box.appendChild(b);
  });
  return box;

/* kalem bu aydan sonra her ay aynı mı? (liste altyazısı için) */
function rowEvery(it,m){
  if(m>=11) return false;
  for(var i=m+1;i<12;i++){ if(it.values[i]!==it.values[m]) return false; }
  return true;
}
/* sola kaydırınca "Kaldır" düğmesi açılır */
function swipeRow(row,onTap,onRemove){
  var li=row.querySelector('.li'), rm=row.querySelector('.rm');
  var sx=0, sy=0, dx=0, drag=null, open=false, moved=false;
  function set(x,anim){ li.style.transition=anim?'':'none'; li.style.transform=x?'translateX('+x+'px)':''; }
  li.addEventListener('touchstart',function(e){
    sx=e.touches[0].clientX; sy=e.touches[0].clientY; dx=0; drag=null; moved=false;
  },{passive:true});
  li.addEventListener('touchmove',function(e){
    var mx=e.touches[0].clientX-sx, my=e.touches[0].clientY-sy;
    if(drag===null){
      if(Math.abs(mx)<8&&Math.abs(my)<8) return;
      drag=Math.abs(mx)>Math.abs(my);
    }
    if(!drag) return;
    moved=true;
    dx=Math.min(0,Math.max(-130,(open?-96:0)+mx));
    set(dx,false);
  },{passive:true});
  li.addEventListener('touchend',function(){
    if(!drag) return;
    open=dx<-48;
    set(open?-96:0,true);
  });
  li.onclick=function(){
    if(moved){ moved=false; return; }
    if(open){ open=false; set(0,true); return; }
    onTap();
  };
  rm.onclick=onRemove;
}

/* ---------- MOBİL · TABLO (yana kaymaz, ekrana sığan aylar) ---------- */
function tableCols(){
  var w=document.getElementById('mScroll').clientWidth||360;
  return Math.max(2,Math.min(12,Math.floor((w-108-64)/58)));
}
function tableClosed(){ try{ return JSON.parse(lsGet('pnl_tclosed')||'{}'); }catch(e){ return {}; } }
function setTableClosed(o){ lsSet('pnl_tclosed',JSON.stringify(o)); }
function mobTable(keepTop){

  setMNav(function(d){ shiftMonth(d,true); });

  var n=tableCols();
  var s0=Math.max(0,Math.min(12-n,sm-Math.floor((n-1)/2)));
  var ms=[]; for(var i=s0;i<s0+n;i++) ms.push(i);
  var closed=tableClosed();
  var allClosed=state.groups.every(function(g){ return closed[g.name]; });

  function cls(mm){ return (mm===cm?' cm':'')+(mm===sm?' sm':''); }
  function numTd(v,extra,attrs,color){
    return '<td class="'+(Math.abs(v)>0.005?'':'z')+(extra||'')+'"'+(attrs||'')+(color?' style="color:'+color+'"':'')+'>'+(Math.abs(v)>0.005?fmtPlain(v):'–')+'</td>';
  }
  var cols='<colgroup><col>'+ms.map(function(){ return '<col style="width:58px">'; }).join('')+'<col style="width:64px"></colgroup>';
  var head='<thead><tr><th class="nm">Kalem</th>'+
    ms.map(function(mm){ return '<th class="'+cls(mm).trim()+'" data-hm="'+mm+'">'+MONTHS[mm]+'</th>'; }).join('')+
    '<th class="yt">Yıl</th></tr></thead>';

  function groupRows(g){
    var col=gcolor(g), isR=g.type==='realize', st=c.sub[g.id], shut=!!closed[g.name], html='';
    /* yıl boyunca hep boş kalemler telefonda kalabalık etmesin (bilgisayarda duruyorlar) */
    var items=shownItems(g).filter(function(it){ return it.values.some(function(v){ return Math.abs(+v||0)>0.005; }); });
    html+='<tr class="gh" data-gn="'+esc(g.name)+'"><td class="nm"><span class="tw">'+(items.length?(shut?'▸':'▾'):'')+'</span><i style="background:'+col+'"></i>'+esc(g.name)+'</td>'+
      ms.map(function(mm){ var v=st[mm]; return numTd(v,cls(mm),'',isR?(v<0?RUST:(v>0?GREEN:'')):''); }).join('')+
      numTd(yearSum(st),' yt','',isR&&yearSum(st)<0?RUST:'')+'</tr>';
    if(shut) return html;
    items.forEach(function(it){
      html+='<tr class="it"><td class="nm" data-g="'+g.id+'" data-i="'+it.id+'">'+esc(it.name)+'</td>'+
        ms.map(function(mm){
          var v=+it.values[mm]||0;
          return numTd(v,' c'+cls(mm),' data-g="'+g.id+'" data-i="'+it.id+'" data-m="'+mm+'"',isR&&v<0?RUST:'');
        }).join('')+
        numTd(yearSum(it.values),' yt','',isR&&yearSum(it.values)<0?RUST:'')+'</tr>';
    });
    return html;
  }
  var body='';
  state.groups.forEach(function(g){ if(g.type!=='realize') body+=groupRows(g); });
  state.groups.forEach(function(g){ if(g.type==='realize') body+=groupRows(g); });
  var sav=yearSum(c.saving);
  var foot='<tfoot>'+
    '<tr class="sv"><td class="nm">Tasarruf</td>'+
      ms.map(function(mm){ var v=c.saving[mm]; return numTd(v,cls(mm),'',v<0?RUST:GREEN); }).join('')+
      numTd(sav,' yt','',sav<0?RUST:GREEN)+'</tr>'+
    '<tr class="bl"><td class="nm">Bakiye</td>'+
      ms.map(function(mm){ var v=c.balance[mm]; return '<td class="'+cls(mm).trim()+'" style="'+(v<0?'color:#ff9b8e':'')+'">'+fmtPlain(v)+'</td>'; }).join('')+
      '<td class="yt">'+fmtPlain(c.balance[11])+'</td></tr>'+
  '</tfoot>';

  var bar=document.createElement('div'); bar.className='tbar';
  bar.appendChild(yearStrip(c,[ms[0],ms[ms.length-1]]));
  var ctl=h('<div class="tctl"><span>Yana kaydır → ay değişir · rakama dokun → düzenle</span>'+
    '<button id="tAll">'+(allClosed?'Kalemleri aç':'Sadece toplamlar')+'</button></div>');
  ctl.querySelector('#tAll').onclick=function(){
    var o={};
    if(!allClosed) state.groups.forEach(function(g){ o[g.name]=1; });
    setTableClosed(o); renderMob(true);
  };
  bar.appendChild(ctl);

  var wrap=document.createElement('div'); wrap.className='tblwrap';
  wrap.innerHTML='<table class="tbl">'+cols+head+'<tbody>'+body+'</tbody>'+foot+'</table>';
  wrap.onclick=function(e){
    var t=e.target.closest('td,th,tr.gh'); if(!t) return;
    var tr=e.target.closest('tr');
    if(tr&&tr.classList.contains('gh')){
      var nm=tr.getAttribute('data-gn'), o=tableClosed();
      if(o[nm]) delete o[nm]; else o[nm]=1;
      setTableClosed(o); renderMob(true); return;
    }
    if(t.hasAttribute('data-hm')){ pickMonth(+t.getAttribute('data-hm')); return; }
    var gid=t.getAttribute('data-g'), iid=t.getAttribute('data-i');
    if(!gid||!iid) return;
    var mm=t.hasAttribute('data-m')?+t.getAttribute('data-m'):view.month;
    openItemSheet({gid:gid,iid:iid,month:mm,mode:'set'});
  };
  scroll.appendChild(bar);
  scroll.appendChild(wrap);
  wrap.scrollTop=keepTop||0;
}

/* ---------- MOBİL sheet altyapısı ---------- */
var sheetOpen=false, pendingRender=false;
function closeSheet(){
  var hst=document.getElementById('sheetHost'); if(hst) hst.innerHTML='';
  sheetOpen=false;
  if(pendingRender){ pendingRender=false; render(true); }
}
function sheet(inner){
  sheetOpen=true;
  var host=document.getElementById('sheetHost');
  host.innerHTML='';
  var scrim=document.createElement('div'); scrim.className='scrim';
  var spacer=document.createElement('div'); spacer.style.flex='1'; spacer.onclick=closeSheet;
  var s=document.createElement('div'); s.className='sheet';
  s.appendChild(inner);
  scrim.appendChild(spacer); scrim.appendChild(s);
  host.appendChild(scrim);
  return s;
}
var toastT=null;
function toast(msg,act,fn){
  var host=document.getElementById('toastHost');
  if(!host) return;
  clearTimeout(toastT);
  host.innerHTML='';
  var el=h('<div class="toast"><span>'+esc(msg)+'</span>'+(act?'<button>'+esc(act)+'</button>':'')+'</div>').firstChild;
  if(act) el.querySelector('button').onclick=function(){ clearTimeout(toastT); host.innerHTML=''; fn(); };
  host.appendChild(el);
  toastT=setTimeout(function(){ host.innerHTML=''; },act?5000:2200);
}
