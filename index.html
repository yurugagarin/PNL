<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f6f5f2">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="PNL">
<meta name="mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>PNL · Kişisel Gelir / Gider</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Karla:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
input,button,select,textarea{font-family:inherit}
.tnum{font-variant-numeric:tabular-nums}

/* ==========================================================
   WEB GÖRÜNÜMÜ — mevcut tasarım, olduğu gibi
   ========================================================== */
body.web{
  font-family:'Karla',system-ui,-apple-system,sans-serif;color:#3a342c;
  background:radial-gradient(140% 90% at 50% 0%, #f1eadd 0%, #ece4d6 55%, #e4dac8 100%);
  min-height:100vh;
}
body.web ::-webkit-scrollbar{height:11px;width:11px}
body.web ::-webkit-scrollbar-thumb{background:#cdbfa8;border-radius:8px;border:2px solid #fbf8f2}
body.web ::-webkit-scrollbar-track{background:#f1e8d7}
body.web #root{max-width:1440px;margin:0 auto;padding:28px 32px 48px}
body.web .pnl-cell{transition:background .1s}
body.web .pnl-cell:focus{background:#fff6e6!important;outline:2px solid #e3a23f;border-radius:5px}
body.web .ghostbtn{background:#fbf8f2;border:1px solid #d9ccb5;border-radius:9px;padding:8px 13px;font-size:13px;font-weight:600;color:#6b5f4d;cursor:pointer;transition:background .12s}
body.web .ghostbtn:hover{background:#f3ecdd}
body.web .kpi{display:grid;grid-template-columns:repeat(5,1fr);gap:14px;margin-bottom:16px}
body.web .charts{display:grid;grid-template-columns:1.7fr 1fr;gap:14px;margin-bottom:16px}
@media(max-width:1100px){body.web .kpi{grid-template-columns:repeat(3,1fr)}body.web .charts{grid-template-columns:1fr}}
@media(max-width:900px){body.web #root{padding:16px 12px 40px}}
@media(max-width:680px){body.web .kpi{grid-template-columns:repeat(2,1fr)}}

/* ==========================================================
   MOBİL GÖRÜNÜMÜ — telefon tasarımı
   ========================================================== */
html.mob{height:100%}
body.mob{
  --ink:#1b1a18; --paper:#f6f5f2; --card:#fff;
  --green:#2f7a5b; --rust:#b4622f;
  --m1:rgba(27,26,24,.06); --m2:rgba(27,26,24,.1); --m3:rgba(27,26,24,.3);
  --m4:rgba(27,26,24,.55); --m5:rgba(27,26,24,.6); --m6:rgba(27,26,24,.72);
  --safeT:env(safe-area-inset-top,0px); --safeB:env(safe-area-inset-bottom,0px);
  background:#eceae5;
  font-family:-apple-system,BlinkMacSystemFont,system-ui,"Segoe UI","Helvetica Neue",sans-serif;
  color:var(--ink);-webkit-font-smoothing:antialiased;
  height:100%;overflow:hidden;overscroll-behavior:none;
  display:flex;align-items:center;justify-content:center;
}
body.mob button,.mobscope button{font:inherit;color:inherit;border:0;background:none;padding:0;cursor:pointer;touch-action:manipulation}
body.mob #root{
  position:relative;width:100%;max-width:480px;height:100%;height:100dvh;
  background:var(--paper);display:flex;flex-direction:column;overflow:hidden;
}
@media(min-width:560px) and (min-height:800px){
  body.mob #root{height:calc(100vh - 40px);height:calc(100dvh - 40px);max-height:920px;border-radius:34px;box-shadow:0 20px 60px rgba(0,0,0,.18)}
}
@keyframes sheetup{from{transform:translateY(100%)}to{transform:translateY(0)}}
@keyframes fadein{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

/* ---- başlık ---- */
body.mob .hdr{padding:calc(10px + var(--safeT)) 18px 6px;display:flex;align-items:flex-end;justify-content:space-between;gap:10px;flex:none}
body.mob .kick{display:inline-flex;align-items:center;gap:7px;height:26px;font-size:12.5px;font-weight:600;color:var(--m5);max-width:100%;white-space:nowrap;overflow:hidden}
body.mob .kick i{width:8px;height:8px;border-radius:999px;flex:none;background:var(--m3)}
body.mob .kick:active{opacity:.55}
body.mob .title{font-size:30px;font-weight:700;letter-spacing:-.02em;line-height:1.08;display:flex;align-items:center;gap:6px;white-space:nowrap;overflow:hidden;max-width:100%}
body.mob .title .chev{font-size:15px;font-weight:700;color:var(--m3);transform:translateY(1px)}
body.mob button.title:active{opacity:.55}
body.mob .nav{display:flex;align-items:center;background:var(--m1);border-radius:999px;padding:3px;gap:2px;flex:none}
body.mob .nav button{width:40px;height:38px;border-radius:999px;color:var(--m6);display:flex;align-items:center;justify-content:center}
body.mob .nav button:active{background:rgba(27,26,24,.1)}
body.mob .nav svg{width:16px;height:16px}

/* ---- içerik ---- */
body.mob .scroll{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;padding:4px 16px calc(112px + var(--safeB))}
body.mob .scroll.flat{overflow:hidden;padding:0;display:flex;flex-direction:column}
body.mob .hero{background:var(--ink);color:var(--paper);border-radius:24px;padding:18px 20px 16px}
body.mob .hero-r{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
body.mob .hero-l{font-size:12px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:rgba(246,245,242,.62)}
body.mob .hero-b{display:flex;justify-content:space-between;align-items:flex-end;margin-top:6px;gap:10px}
body.mob .hero-big{font-size:40px;font-weight:700;letter-spacing:-.03em;line-height:1.05;margin-top:6px}
body.mob .hero-b .hero-big{font-size:32px;margin-top:0}
body.mob .hero-sm{font-size:17px;font-weight:600}
body.mob .hero-note{font-size:13px;font-weight:600;color:rgba(246,245,242,.72);margin-top:5px;line-height:1.4}
body.mob .hero-g{display:flex;gap:8px;margin-top:16px}
body.mob .hero-g>div{flex:1;min-width:0;background:rgba(246,245,242,.09);border-radius:14px;padding:10px 11px}
body.mob .hero-g .k{font-size:11.5px;color:rgba(246,245,242,.62);font-weight:600}
body.mob .hero-g .v{font-size:15px;font-weight:700;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
body.mob .card{margin-top:14px;background:var(--card);border-radius:22px;padding:18px 18px;box-shadow:0 1px 2px rgba(0,0,0,.05)}
body.mob .sh-t,.mobscope .sh-t{font-size:17px;font-weight:700;letter-spacing:-.02em}
body.mob .sh-x,.mobscope .sh-x{font-size:14px;font-weight:600;color:var(--m5);padding:6px 0}
body.mob .tsav{margin-top:14px;display:flex;gap:10px}
body.mob .tsav>div{flex:1;min-width:0;background:var(--m1);border-radius:14px;padding:11px 13px}
body.mob .tsav .k{font-size:12px;font-weight:600;color:var(--m5)}
body.mob .tsav .v{font-size:19px;font-weight:700;letter-spacing:-.02em;margin-top:3px}
body.mob .opn{margin-top:10px;width:100%;text-align:left;font-size:12.5px;font-weight:600;color:var(--m4);padding:4px 2px}
body.mob .opn:active{color:var(--m6)}
body.mob .bar{margin-top:12px;height:10px;border-radius:999px;background:var(--m2);overflow:hidden}
body.mob .bar>div{height:100%;border-radius:999px;background:var(--green);transition:width .4s}
body.mob .rowsm{display:flex;justify-content:space-between;margin-top:9px;font-size:12.5px;color:var(--m5);font-weight:600}
body.mob .sechd{margin-top:24px;display:flex;align-items:baseline;justify-content:space-between;gap:8px;padding:0 2px}
body.mob .sechd .t{font-size:15px;font-weight:700;letter-spacing:-.01em}
body.mob .sechd .m{font-size:12px;font-weight:600;color:var(--m4)}
body.mob .lab,.mobscope .lab{margin-top:18px;font-size:11.5px;letter-spacing:.1em;text-transform:uppercase;font-weight:700;color:var(--m4)}
body.mob .catrow{display:block;width:100%;text-align:left;padding:7px 0}
body.mob .catrow:active{opacity:.6}
body.mob .cat-h{display:flex;align-items:baseline;gap:8px}
body.mob .cat-n{font-size:14px;font-weight:600;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
body.mob .cat-a{font-size:14px;font-weight:600}
body.mob .cat-p{font-size:12px;font-weight:600;color:var(--m4);width:36px;text-align:right}
body.mob .cat-c{font-size:14px;color:var(--m3);font-weight:700;width:10px;text-align:right}
body.mob .cat-b{margin-top:6px;height:6px;border-radius:999px;background:rgba(27,26,24,.07);overflow:hidden}
body.mob .cat-b>div{height:100%;border-radius:999px}
body.mob .spark{margin-top:14px;display:flex;align-items:flex-end;gap:3px;height:46px}
body.mob .spark div{flex:1;border-radius:3px;min-height:2px}
body.mob .sparkx{margin-top:5px;display:flex;gap:3px}
body.mob .sparkx div{flex:1;text-align:center;font-size:9.5px;font-weight:700;color:var(--m3)}
body.mob .warn{margin-top:12px;padding:11px 13px;border-radius:14px;background:rgba(180,98,47,.1);font-size:12.5px;line-height:1.45;color:#8a4a22;font-weight:600}
body.mob .ok{margin-top:12px;padding:11px 13px;border-radius:14px;background:rgba(47,122,91,.1);font-size:12.5px;line-height:1.45;color:#27614a;font-weight:600}
body.mob .yrow{display:flex;align-items:center;gap:10px;padding:12px 4px;border-bottom:1px solid rgba(27,26,24,.06);width:100%;text-align:left}
body.mob .yrow:last-child{border-bottom:0}
body.mob .yrow:active{background:#faf9f7}
body.mob .yrow.cur .nm{color:var(--green)}
body.mob .yrow .nm{width:34px;flex:none;font-size:13px;font-weight:700;color:var(--m6)}
body.mob .yrow .tk{flex:1;min-width:0;height:22px;display:flex;align-items:center}
body.mob .yrow .tk i{display:block;height:7px;border-radius:2px}
body.mob .yrow .nt{width:80px;text-align:right;font-size:13px;font-weight:600}
body.mob .yrow .bl{width:84px;text-align:right;font-size:13px;font-weight:700}
body.mob .yhd{display:flex;gap:10px;padding:0 4px 6px;font-size:10.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--m4)}
body.mob .yhd .a{width:34px;flex:none}
body.mob .yhd .b{flex:1}
body.mob .yhd .c{width:80px;text-align:right}
body.mob .yhd .d{width:84px;text-align:right}

/* ---- bağlı değil uyarısı ---- */
body.mob .banner{margin-top:4px;margin-bottom:12px;display:flex;align-items:center;gap:12px;padding:13px 14px;border-radius:18px;background:rgba(180,98,47,.11);color:#7d4220;font-size:13px;font-weight:600;line-height:1.4;width:100%;text-align:left}
body.mob .banner .go{flex:none;padding:9px 13px;border-radius:999px;background:var(--rust);color:#fff;font-size:13px;font-weight:700}

/* ---- hızlı ekle ---- */
body.mob .hscroll{display:flex;gap:8px;overflow-x:auto;margin:10px -16px 0;padding:2px 16px 6px;scrollbar-width:none;-webkit-overflow-scrolling:touch}
body.mob .hscroll::-webkit-scrollbar{display:none}
body.mob .qchip{flex:none;display:flex;align-items:center;gap:8px;padding:10px 14px;border-radius:999px;background:var(--card);box-shadow:0 1px 2px rgba(0,0,0,.07);font-size:14px;font-weight:600;white-space:nowrap}
body.mob .qchip i{width:8px;height:8px;border-radius:999px;flex:none}
body.mob .qchip b{font-weight:700;color:var(--green)}
body.mob .qchip:active{background:#efeee9}

/* ---- kalem listesi (kaydırarak kaldır) ---- */
body.mob .lgh{display:flex;align-items:baseline;justify-content:space-between;gap:10px;padding:11px 16px 7px;background:rgba(27,26,24,.03);border-bottom:1px solid rgba(27,26,24,.06)}
body.mob .lgh .g{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase}
body.mob .lgh .s{font-size:12.5px;font-weight:700}
body.mob .list{margin-top:10px;background:var(--card);border-radius:20px;box-shadow:0 1px 2px rgba(0,0,0,.05);overflow:hidden}
body.mob .lrow{position:relative;overflow:hidden;border-bottom:1px solid rgba(27,26,24,.06)}
body.mob .lrow:last-child{border-bottom:0}
body.mob .lrow .rm{position:absolute;right:0;top:0;bottom:0;width:96px;background:var(--rust);color:#fff;font-size:13px;font-weight:700;display:flex;align-items:center;justify-content:center}
body.mob .li{position:relative;z-index:1;display:flex;align-items:center;gap:12px;padding:13px 16px;width:100%;text-align:left;background:var(--card);transition:transform .22s cubic-bezier(.2,.8,.2,1);touch-action:pan-y}
body.mob .li:active{background:#faf9f7}
body.mob .li-d{width:32px;height:32px;flex:none;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;color:#fff}
body.mob .li-n{font-size:15px;font-weight:600;letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
body.mob .li-s{font-size:12px;color:var(--m5);margin-top:1px}
body.mob .li-a{font-size:15px;font-weight:600;white-space:nowrap}
body.mob .hint{margin-top:6px;font-size:12px;color:var(--m4);font-weight:500;padding:0 2px}
body.mob .empty{padding:26px 8px;text-align:center;font-size:13.5px;color:var(--m5);line-height:1.5}
body.mob .ghost,.mobscope .ghost{margin-top:10px;padding:14px;border-radius:16px;background:var(--m1);text-align:center;font-size:14px;font-weight:600;color:var(--m6);width:100%;display:block}
body.mob .ghost:active,.mobscope .ghost:active{background:var(--m2)}
body.mob .hero-g.three>div{padding:10px 10px}
body.mob .tot{margin-top:10px;display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 14px;border-radius:14px;background:rgba(47,122,91,.1)}
body.mob .tot .a{font-size:12.5px;font-weight:600;color:#27614a}
body.mob .tot .b{font-size:20px;font-weight:700;letter-spacing:-.02em;color:#27614a}
body.mob .split{display:flex;justify-content:space-between;margin-top:8px;font-size:12px;font-weight:600;color:var(--m5)}

/* ---- alt sekmeler + ortada ekle ---- */
body.mob .tabs{position:absolute;left:0;right:0;bottom:0;padding:6px 8px calc(8px + var(--safeB));background:rgba(246,245,242,.9);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border-top:1px solid rgba(27,26,24,.08);display:flex;align-items:center;z-index:30}
body.mob .tab{flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 0 3px;font-size:11px;font-weight:700;color:var(--m4)}
body.mob .tab svg{width:23px;height:23px}
body.mob .tab.on{color:var(--ink)}
body.mob .tab:active{opacity:.6}
body.mob .tadd{flex:none;width:58px;height:50px;margin:0 4px;border-radius:18px;background:var(--green);color:#fff;display:flex;align-items:center;justify-content:center;box-shadow:0 6px 18px rgba(47,122,91,.35),0 2px 5px rgba(0,0,0,.1);transition:transform .14s}
body.mob .tadd:active{transform:scale(.92)}
body.mob .tadd svg{width:26px;height:26px}
@media(prefers-reduced-motion:reduce){body.mob .tadd,body.mob .li{transition:none}}

/* ---- tablo (bilgisayardaki tablonun telefon hali) ---- */
body.mob .tblhint{flex:none;padding:2px 18px 8px;font-size:12px;color:var(--m4);font-weight:500}
body.mob .tblwrap{flex:1;min-height:0;overflow:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;padding-bottom:calc(84px + var(--safeB))}
body.mob table.tbl{border-collapse:separate;border-spacing:0;font-size:13px;min-width:100%}
body.mob .tbl th,body.mob .tbl td{padding:0 9px;height:40px;text-align:right;white-space:nowrap;border-bottom:1px solid rgba(27,26,24,.06);min-width:62px;font-variant-numeric:tabular-nums;background:var(--paper)}
body.mob .tbl thead th{position:sticky;top:0;z-index:2;font-size:12px;font-weight:700;color:var(--m5);height:34px;border-bottom:1px solid rgba(27,26,24,.14);cursor:pointer}
body.mob .tbl .nm{position:sticky;left:0;z-index:1;text-align:left;min-width:132px;max-width:132px;width:132px;overflow:hidden;text-overflow:ellipsis;font-weight:600;padding-left:16px;box-shadow:1px 0 0 rgba(27,26,24,.1)}
body.mob .tbl thead .nm{z-index:3;color:var(--ink)}
body.mob .tbl td.z{color:rgba(27,26,24,.2)}
body.mob .tbl .cm{background:#f8edd6}
body.mob .tbl thead th.cm{color:#a0621b}
body.mob .tbl thead th.sm{color:var(--ink);box-shadow:inset 0 -3px 0 var(--green)}
body.mob .tbl tr.gh td{height:34px;font-size:11.5px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;background:#efeee9}
body.mob .tbl tr.st td{font-weight:700;background:#f1f0eb}
body.mob .tbl tr.st td.cm{background:#efe3c8}
body.mob .tbl tr.sv td{font-weight:700;background:#e9e7e0;border-top:2px solid rgba(27,26,24,.1)}
body.mob .tbl tr.bl td{background:var(--ink);color:#e9d39a;font-weight:700}
body.mob .tbl tr.bl td.nm{color:var(--paper)}
body.mob .tbl td.yt{font-weight:700;color:var(--m6);background:#f1f0eb}
body.mob .tbl tr.bl td.yt{background:#2c2a27;color:#f0b75a}
body.mob .tbl td.c{cursor:pointer}
body.mob .tbl td.c:active,body.mob .tbl td.nm.tap:active{background:rgba(47,122,91,.16)}
body.mob .tbl tr.rz td.nm{padding-top:16px}

/* ---- alt sayfa (sheet) ---- */
body.mob .toast{position:absolute;left:12px;right:12px;bottom:calc(84px + var(--safeB));margin:0 auto;max-width:440px;display:flex;align-items:center;gap:12px;padding:12px 12px 12px 16px;border-radius:16px;background:var(--ink);color:var(--paper);font-size:14px;font-weight:600;z-index:60;animation:fadein .2s;box-shadow:0 8px 24px rgba(0,0,0,.2)}
body.mob .toast span{flex:1;min-width:0;line-height:1.35}
body.mob .toast button{flex:none;color:#9ee0bd;font-weight:700;padding:6px 8px;border-radius:10px;background:rgba(255,255,255,.08)}
body.mob .scrim{position:absolute;left:0;right:0;top:0;bottom:var(--kb,0px);z-index:40;display:flex;flex-direction:column;justify-content:flex-end;background:rgba(27,26,24,.3);backdrop-filter:blur(2px);-webkit-backdrop-filter:blur(2px)}
body.mob .sheet{background:var(--paper);border-radius:28px 28px 0 0;padding:8px 18px calc(24px + var(--safeB));animation:sheetup .28s cubic-bezier(.2,.8,.2,1);box-shadow:0 -8px 30px rgba(0,0,0,.14);max-height:94%;overflow-y:auto;overscroll-behavior:contain}
body.mob .grab,.mobscope .grab{width:38px;height:5px;border-radius:999px;background:rgba(27,26,24,.18);margin:0 auto 10px}
body.mob .sh-h,.mobscope .sh-h{display:flex;align-items:baseline;justify-content:space-between;gap:10px}
body.mob .sh-bar{display:flex;align-items:center;justify-content:space-between;gap:8px}
body.mob .sh-bar .sh-t{flex:1;text-align:center;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
body.mob .sh-bar>button{font-size:15px;font-weight:600;color:var(--m5);padding:8px 2px;min-width:66px;text-align:left}
body.mob .sh-bar>button.okb{color:var(--green);font-weight:700;text-align:right}
body.mob .field,.mobscope .field{margin-top:12px;background:var(--card);border-radius:16px;padding:2px 16px;box-shadow:0 1px 2px rgba(0,0,0,.05)}
body.mob .inp,.mobscope .inp{width:100%;border:0;background:transparent;padding:14px 0;font-size:17px;font-weight:600;letter-spacing:-.01em;color:var(--ink);outline:none}
body.mob .amt{margin-top:12px;display:flex;align-items:center;gap:10px;background:var(--card);border-radius:20px;padding:6px 16px 6px 8px;box-shadow:0 1px 2px rgba(0,0,0,.05)}
body.mob .amt .sign{width:46px;height:46px;border-radius:14px;background:var(--m1);font-size:24px;font-weight:700;flex:none;color:var(--green)}
body.mob .amt .sign.neg{background:rgba(180,98,47,.14);color:var(--rust)}
body.mob .amt input{flex:1;min-width:0;border:0;background:transparent;font-size:36px;font-weight:700;letter-spacing:-.02em;outline:none;color:var(--ink);padding:8px 0;text-align:right;font-variant-numeric:tabular-nums}
body.mob .amt .cur{font-size:24px;font-weight:700;color:var(--m4)}
body.mob .prev{margin-top:8px;font-size:13.5px;font-weight:600;color:var(--m5);text-align:right;min-height:19px;padding:0 4px}

<script>
"use strict";
(function(){

/* ════════════════════════════════════════════════════════════
   0 · ESKİ SERVICE WORKER TEMİZLİĞİ
   ════════════════════════════════════════════════════════════ */
if('serviceWorker' in navigator){
  navigator.serviceWorker.getRegistrations().then(function(regs){
    if(!regs.length) return;
    var jobs=regs.map(function(r){return r.unregister();});
    if(window.caches&&caches.keys){
      jobs.push(caches.keys().then(function(ks){
        return Promise.all(ks.map(function(k){return caches.delete(k);}));
      }));
    }
    Promise.all(jobs).then(function(){
      if(!sessionStorage.getItem('swTemiz')){
        sessionStorage.setItem('swTemiz','1');
        location.reload();
      }
    });
  }).catch(function(){});
}

/* ════════════════════════════════════════════════════════════
   1 · SABİTLER & YARDIMCILAR
   ════════════════════════════════════════════════════════════ */
var MONTHS=['Oca','Şub','Mar','Nis','May','Haz','Tem','Ağu','Eyl','Eki','Kas','Ara'];
var MONTHS_L=['Ocak','Şubat','Mart','Nisan','Mayıs','Haziran','Temmuz','Ağustos','Eylül','Ekim','Kasım','Aralık'];
var YEARS=[2026,2027];
var CUR='€';
var INK='#1b1a18', GREEN='#2f7a5b', RUST='#b4622f';
var C_HISSE='#2E9BC4', C_ALTIN='#E09A18';   /* mobil paletinden */
var root=document.getElementById('root');
var nowD=new Date();

function sp(map){ var a=new Array(12).fill(0); for(var k in map){a[+k]=map[k];} return a; }
function num(raw){
  if(raw===''||raw==null) return 0;
  var t=String(raw).replace(/\s/g,'').replace(/[−–]/g,'-');
  if(t.indexOf(',')>=0&&t.indexOf('.')>=0) t=t.replace(/\./g,'');   /* 1.234,56 */
  var n=parseFloat(t.replace(',','.').replace(/[^0-9.\-]/g,''));
  return isNaN(n)?0:n;
}
function esc(s){ return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function fmt(n){ return (n<0?'-':'')+CUR+Math.round(Math.abs(n)).toLocaleString('tr-TR'); }
function fmtPlain(n){ return Math.round(n).toLocaleString('tr-TR'); }
function fmtM(n){ var a=Math.abs(n); a=(Math.round(a)===Math.round(a*100)/100)?Math.round(a):Math.round(a*100)/100; return (n<0&&a?'-':'')+a.toLocaleString('tr-TR',{maximumFractionDigits:2})+' '+CUR; }
function signedM(n){ return (n>0?'+':'')+fmtM(n); }
function uid(p){ return (p||'')+Math.random().toString(36).slice(2,8)+Date.now().toString(36).slice(-3); }
function rgba(hex,a){ var h=hex.replace('#',''); var r=parseInt(h.slice(0,2),16),g=parseInt(h.slice(2,4),16),b=parseInt(h.slice(4,6),16); return 'rgba('+r+','+g+','+b+','+a+')'; }
function yearSum(arr){ var s=0; for(var i=0;i<arr.length;i++){ s+=(+arr[i]||0); } return s; }
function h(html){ var t=document.createElement('template'); t.innerHTML=String(html).trim(); return t.content; }

/* ════════════════════════════════════════════════════════════
   2 · VERİ MODELİ  (web modeli esas alındı)
   ════════════════════════════════════════════════════════════ */
function seedData(){
  var gid=0,iid=0;
  function G(name,type,color,items){ return {id:'g'+(gid++),name:name,type:type,color:color,items:items}; }
  function I(name,values,invest){ return {id:'i'+(iid++),name:name,values:values,invest:invest}; }
  return {
    opening:3477,
    groups:[
      G('Gelir','revenue','#16a85a',[
        I('Maaş',[2747,2740,2740,3050,3460,3460,3460,3460,3460,3460,3460,3460]),
        I('Bonus',[0,230,1378,250,0,0,0,0,0,0,0,0]),
        I('Retention Bonus',new Array(12).fill(0)),
        I('Masraf İadesi',new Array(12).fill(0))
      ]),
      G('Yatırım Satışları','revenue','#0d9488',[
        I('Altın Satışı',new Array(12).fill(0),'altin'),
        I('Hisse Satışı',new Array(12).fill(0),'hisse')
      ]),
      G('Ev','cost','#3b82f6',[
        I('Türk Marketi',new Array(12).fill(150)),
        I('Alman Marketi',[100,100,200,200,200,200,200,200,200,200,200,200])
      ]),
      G('Günlük','cost','#ef5a1e',[
        I('Günlük Harcama',[850,800,740,933,1000,800,900,1000,800,800,800,800])
      ]),
      G('Krediler','cost','#8b5cf6',[
        I('DB Kredi · Ziya',new Array(12).fill(95)),
        I('DB Kredi · Emre',new Array(12).fill(115))
      ]),
      G('Sabit','cost','#07a7c4',[
        I('Kira',new Array(12).fill(750)),
        I('Annem',[100,100,100,200,200,200,200,200,200,200,200,200]),
        I('BVG',new Array(12).fill(60)),
        I('Sigorta',[0,0,50,50,40,40,40,40,40,40,40,40]),
        I('Terapi',[0,0,0,0,0,170,173,0,0,0,0,0]),
        I('Telefon',new Array(12).fill(25)),
        I('Hisse',[0,50,250,0,700,0,0,250,1000,1000,850,950],'hisse'),
        I('Altın',[0,1500,770,0,0,0,0,0,0,0,0,0],'altin'),
        I('Gym',new Array(12).fill(52))
      ]),
      G('Değişken','cost','#ec4899',[
        I('Aile (Antalya)',sp({0:700,6:700})),
        I('Amazon',sp({0:200,1:350})),
        I('Çamaşır Makinesi',sp({0:965})),
        I('Eren (Roma)',sp({0:185,5:803})),
        I('Terapi',sp({4:200})),
        I('Diğer',sp({2:331,4:130})),
        I('Eren (Paris)',sp({0:200,3:870})),
        I('Stockholm',sp({10:100})),
        I('Eren (Berlin)',sp({1:173,4:20})),
        I('Ruas',sp({2:280}))
      ]),
      G('Realize K/Z','realize','#dc2626',[
        I('Altın K/Z',new Array(12).fill(0),'altin'),
        I('Hisse K/Z',new Array(12).fill(0),'hisse')
      ])
    ]
  };
}
function emptyData(){
  var s=seedData();
  return { opening:0, groups:s.groups.map(function(g){
    return {id:g.id,name:g.name,type:g.type,color:g.color,items:g.items.map(function(it){
      return {id:it.id,name:it.name,invest:it.invest,values:new Array(12).fill(0)};
    })};
  })};
}
function ensureGroups(groups){
  var result=(groups||[]).map(function(g){
    return {id:g.id||uid('g'),name:g.name,type:g.type||'cost',color:g.color||'#8a7f6f',
      items:(g.items||[]).map(function(it){
        return {id:it.id||uid('i'),name:it.name,invest:it.invest,
          values:(function(v){ v=(v||[]).slice(0,12); while(v.length<12) v.push(0); return v.map(function(x){return +x||0;}); })(it.values)};
      })};
  });
  var names={}; result.forEach(function(g){ names[g.name]=true; });
  if(!names['Yatırım Satışları']){
    var sell={id:uid('g'),name:'Yatırım Satışları',type:'revenue',color:'#0d9488',
      items:[{id:uid('i'),name:'Altın Satışı',values:new Array(12).fill(0),invest:'altin'},
             {id:uid('i'),name:'Hisse Satışı',values:new Array(12).fill(0),invest:'hisse'}]};
    var firstCost=-1;
    for(var i=0;i<result.length;i++){ if(result[i].type!=='revenue'){ firstCost=i; break; } }
    if(firstCost===-1) result.push(sell); else result.splice(firstCost,0,sell);
  }
  if(!names['Realize K/Z']){
    result.push({id:uid('g'),name:'Realize K/Z',type:'realize',color:'#dc2626',
      items:[{id:uid('i'),name:'Altın K/Z',values:new Array(12).fill(0),invest:'altin'},
             {id:uid('i'),name:'Hisse K/Z',values:new Array(12).fill(0),invest:'hisse'}]});
  }
  result.forEach(function(g){
    g.items.forEach(function(it){
      if(it.invest) return;
      if(it.name==='Altın'||it.name==='Altın Satışı'||it.name==='Altın K/Z') it.invest='altin';
      else if(it.name==='Hisse'||it.name==='Hisse Satışı'||it.name==='Hisse K/Z') it.invest='hisse';
    });
  });
  return result;
}

/* ════════════════════════════════════════════════════════════
   3 · DEPO  (tek kaynak — web ve mobil aynı veriyi okur)
   ════════════════════════════════════════════════════════════ */
var SKEY='pnl_store_v3';
var STORE={updatedAt:0,years:{},goal:12000,alert:0};

function migrateYear(y){
  var def=(y===2026)?seedData():emptyData();
  var legacy=null;
  try{
    var r=localStorage.getItem('pnl_'+y+'_v2')||localStorage.getItem('pnl_'+y+'_v1');
    if(r) legacy=JSON.parse(r);
  }catch(e){}
  if(legacy) return {opening:(legacy.opening!=null?legacy.opening:def.opening),groups:ensureGroups(legacy.groups||def.groups)};
  return {opening:def.opening,groups:ensureGroups(def.groups)};
}
function loadStore(){
  try{
    var raw=localStorage.getItem(SKEY);
    if(raw){
      var p=JSON.parse(raw);
      if(p&&p.years){
        STORE.updatedAt=p.updatedAt||0;
        STORE.years=p.years;
        if(typeof p.goal==='number') STORE.goal=p.goal;
        if(typeof p.alert==='number') STORE.alert=p.alert;
      }
    }
  }catch(e){}
  YEARS.forEach(function(y){
    if(!STORE.years[y]) STORE.years[y]=migrateYear(y);
    else STORE.years[y]={opening:+STORE.years[y].opening||0,groups:ensureGroups(STORE.years[y].groups)};
  });
}
function persist(){
  try{ localStorage.setItem(SKEY,JSON.stringify(STORE)); }
  catch(e){
    if(view.mode==='web') alert('Kaydedilemedi — tarayıcı depolaması dolu olabilir.');
    else toast('Kaydedilemedi — depolama dolu olabilir');
  }
}
/* her veri değişikliğinde çağrılır: damgala, sakla, buluta gönder */
function touched(){
  STORE.updatedAt=Date.now();
  lsSet('pnl_pristine','');
  persist();
  schedulePush();
}

/* ════════════════════════════════════════════════════════════
   4 · GITHUB GIST SENKRONU
   Her cihaz, en son eşitlendiği bulut sürümünü (base) hatırlar.
   Böylece "kim daha yeni" saat karşılaştırmasına değil,
   "son eşitlemeden beri kim değişti" sorusuna göre karar verilir.
   ════════════════════════════════════════════════════════════ */
function lsGet(k){ try{ return localStorage.getItem(k); }catch(e){ return null; } }
function lsSet(k,v){ try{ if(v==null||v==='') localStorage.removeItem(k); else localStorage.setItem(k,v); }catch(e){} }

var SY={
  token:lsGet('pnl_gh_token')||'',
  gist:lsGet('pnl_gist_id')||'',
  base:+(lsGet('pnl_sync_base')||0),   // son eşitlemedeki bulut sürümü (updatedAt)
  first:'',         // ilk bağlantıda: 'adopt' buluttakini al · 'ask' sor · '' eski kurulum
  state:'off',      // off | ok | busy | err
  msg:'Senkron kapalı',
  at:0
};
var FILE='pnl-data.json';
function syncOn(){ return !!SY.token; }
function setBase(v){ SY.base=v||0; lsSet('pnl_sync_base',SY.base?String(SY.base):''); }
function setSync(st,msg){
  SY.state=st; SY.msg=msg||'';
  if(st==='ok'){ SY.at=Date.now(); }
  paintSync();
}
function syncColor(){
  if(!syncOn()) return 'rgba(27,26,24,.25)';
  return SY.state==='ok'?GREEN:(SY.state==='busy'?'#E09A18':(SY.state==='err'?RUST:'rgba(27,26,24,.25)'));
}
function ghFetch(url,opts){
  opts=opts||{};
  opts.cache='no-store';   // GitHub API yanıtları 60 sn önbelleğe alınabiliyor → hep taze oku
  opts.headers=Object.assign({
    'Authorization':'Bearer '+SY.token,
    'Accept':'application/vnd.github+json',
    'X-GitHub-Api-Version':'2022-11-28'
  },opts.headers||{});
  return fetch(url,opts).then(function(r){
    if(!r.ok) return r.text().then(function(t){
      var e=new Error('GitHub '+r.status+': '+t.slice(0,120)); e.status=r.status; throw e;
    });
    return r.json();
  });
}
function errText(e){
  if(e&&e.status===401) return 'Token geçersiz ya da süresi dolmuş';
  if(e&&e.status===403) return 'GitHub erişimi reddetti (token’da “gist” izni olmalı)';
  if(e&&e.status===404) return 'Bulut dosyası bulunamadı (Gist kimliğini kontrol et)';
  if(e&&e.status) return 'GitHub hatası ('+e.status+')';
  if(navigator.onLine===false) return 'İnternet yok — bağlanınca tekrar denenecek';
  return (e&&e.message)||'Bağlantı kurulamadı';
}
function payload(){
  return JSON.stringify({updatedAt:STORE.updatedAt,years:STORE.years,goal:STORE.goal,alert:STORE.alert},null,2);
}
function adopt(remote){
  STORE.updatedAt=remote.updatedAt||0;
  STORE.years=remote.years||{};
  if(typeof remote.goal==='number') STORE.goal=remote.goal;
  if(typeof remote.alert==='number') STORE.alert=remote.alert;
  YEARS.forEach(function(y){
    if(!STORE.years[y]) STORE.years[y]=migrateYear(y);
    else STORE.years[y]={opening:+STORE.years[y].opening||0,groups:ensureGroups(STORE.years[y].groups)};
  });
  persist();
  bindYear(view.year);
}
/* Önce hesaptaki mevcut PNL kutusunu ara, yoksa yeni oluştur */
function findGist(){
  return ghFetch('https://api.github.com/gists?per_page=100').then(function(list){
    for(var i=0;i<list.length;i++){
      if(list[i].files && list[i].files[FILE]) return list[i].id;
    }
    return null;
  }).catch(function(){ return null; });
}
function ensureGist(){
  if(SY.gist) return Promise.resolve(SY.gist);
  return findGist().then(function(id){
    if(id){ SY.gist=id; lsSet('pnl_gist_id',id); return id; }
    return createGist().then(function(g){ return g.id; });
  });
}
function createGist(){
  var files={}; files[FILE]={content:payload()};
  return ghFetch('https://api.github.com/gists',{
    method:'POST',
    headers:{'Content-Type':'application/json'},
    body:JSON.stringify({description:'PNL verisi — kişisel gelir/gider',public:false,files:files})
  }).then(function(g){
    SY.gist=g.id;
    lsSet('pnl_gist_id',g.id);
    return g;
  });
}
function readRemote(){
  return ensureGist().then(function(){
    return ghFetch('https://api.github.com/gists/'+SY.gist);
  }).then(function(g){
    var f=g.files&&g.files[FILE];
    if(!f) return null;
    if(f.truncated&&f.raw_url) return fetch(f.raw_url,{cache:'no-store'}).then(function(r){ return r.text(); }).then(JSON.parse);
    return JSON.parse(f.content);
  });
}
function writeRemote(){
  var sent=STORE.updatedAt, files={};
  files[FILE]={content:payload()};
  var body=JSON.stringify({files:files});
  return ensureGist().then(function(){
    return ghFetch('https://api.github.com/gists/'+SY.gist,{
      method:'PATCH',
      headers:{'Content-Type':'application/json'},
      body:body,
      keepalive:body.length<60000      // uygulama kapanırken bile gönderim tamamlansın
    });
  }).then(function(){
    setBase(sent);
    setSync('ok','Kaydedildi');
    if(STORE.updatedAt!==sent) schedulePush();   // gönderirken yeni değişiklik olduysa
  });
}
function takeRemote(remote,msg){
  adopt(remote);
  lsSet('pnl_pristine','');
  setBase(remote.updatedAt||0);
  setSync('ok',msg);
  requestRender();
}
function when(t){
  if(!t) return 'bilinmeyen zaman';
  var d=new Date(t);
  return d.toLocaleDateString('tr-TR',{day:'numeric',month:'long'})+' '+hm(t);
}
function hm(t){ return new Date(t).toLocaleTimeString('tr-TR',{hour:'2-digit',minute:'2-digit'}); }
function reconcile(remote){
  if(!remote) return writeRemote();
  var rAt=remote.updatedAt||0, lAt=STORE.updatedAt;
  if(rAt===lAt){ setBase(rAt); setSync('ok','Güncel'); return; }

  /* bu cihaz bu bulutla hiç eşitlenmemiş */
  if(!SY.base){
    var first=SY.first; SY.first='';
    /* QR/kod ile bağlandıysa ya da bu cihazda hiç değişiklik yapılmadıysa: buluttakini al.
       (Eskiden yeni telefonun örnek verisi "daha yeni" sayılıp bilgisayardakinin üstüne yazılıyordu.) */
    if(first==='adopt'||lsGet('pnl_pristine')) return takeRemote(remote,'Bilgisayardaki veriler alındı');
    if(first==='ask'){
      var rNew=rAt>lAt;
      var a='buluttakini bu cihaza al', b='bu cihazdakini buluta yaz';
      if(confirm('Hem bu cihazda hem bulutta PNL verisi var.\n\nBulut: '+when(rAt)+'\nBu cihaz: '+when(lAt)+'\n\nTamam → '+(rNew?a:b)+' (daha yeni olan)\nİptal → '+(rNew?b:a)) === rNew)
        return takeRemote(remote,'Buluttan alındı');
      return writeRemote();
    }
    /* eski kurulum: bir kereliğine eski davranış (yeni olan kazanır) */
    if(rAt>lAt) return takeRemote(remote,'Diğer cihazdan güncellendi');
    return writeRemote();
  }

  var remoteChanged=(rAt!==SY.base), localChanged=(lAt!==SY.base);
  if(remoteChanged&&!localChanged) return takeRemote(remote,'Diğer cihazdan güncellendi');
  if(!remoteChanged) return writeRemote();
  /* iki tarafta da değişiklik var */
  if(confirm('Hem bu cihazda hem diğer cihazda yeni değişiklik var.\n\nTamam → diğer cihazdakini al ('+when(rAt)+')\nİptal → bu cihazdakini gönder ('+when(lAt)+')'))
    return takeRemote(remote,'Diğer cihazdan güncellendi');
  return writeRemote();
}
var syncP=null, syncAgain=false, pushT=null;
function sync(){
  if(!syncOn()) return Promise.resolve();
  clearTimeout(pushT); pushT=null;
  if(syncP){ syncAgain=true; return syncP; }
  setSync('busy','Eşitleniyor…');
  syncP=readRemote().then(reconcile)
    .catch(function(e){ setSync('err',errText(e)); })
    .then(function(){
      syncP=null;
      if(syncAgain){ syncAgain=false; return sync(); }
    });
  return syncP;
}
/* elle: buluttakini zorla al / bu cihazdakini zorla gönder */
function forcePull(){
  if(!syncOn()) return Promise.resolve();
  setSync('busy','Buluttan alınıyor…');
  return readRemote().then(function(r){
    if(!r) throw new Error('Bulutta henüz veri yok');
    takeRemote(r,'Buluttan alındı');
  }).catch(function(e){ setSync('err',errText(e)); });
}
function forcePush(){
  if(!syncOn()) return Promise.resolve();
  STORE.updatedAt=Date.now(); persist();
  setSync('busy','Gönderiliyor…');
  return writeRemote().catch(function(e){ setSync('err',errText(e)); });
}
function schedulePush(){
  if(!syncOn()) return;
  clearTimeout(pushT);
  setSync('busy','Kaydediliyor…');
  pushT=setTimeout(sync,1200);
}
function connectWith(cfg,first){

/* ---------- başka cihazı bağlama: QR / kod ---------- */
function linkCode(){ return btoa(JSON.stringify({t:SY.token,g:SY.gist})).replace(/=+$/,''); }
function linkURL(){ return location.href.split('#')[0]+'#baglan='+linkCode(); }
function parseLink(txt){
  txt=String(txt||'').trim();
  var i=txt.indexOf('baglan=');
  if(i>=0) txt=txt.slice(i+7);
  try{ txt=decodeURIComponent(txt); }catch(e){}
  try{
    var o=JSON.parse(atob(txt+'==='.slice((txt.length+3)%4)));
    if(o&&o.t) return {token:String(o.t),gist:String(o.g||'')};
  }catch(e){}
  if(/^(ghp_|github_pat_|gho_)\w+$/.test(txt)) return {token:txt,gist:''};
  return null;
}
function consumeHash(){
  var m=/[#&]baglan=([^&]+)/.exec(location.hash||'');
  if(!m) return false;
  try{ history.replaceState(null,'',location.pathname+location.search); }catch(e){}
  var cfg=parseLink(m[1]);
  if(!cfg) return false;
  SY.token=cfg.token; SY.gist=cfg.gist;
  lsSet('pnl_gh_token',SY.token); lsSet('pnl_gist_id',SY.gist);
  setBase(0); SY.first='adopt';
  return true;
}
function drawQR(el,text){
  if(!el) return;
  try{
    var q=qrcode(0,'M'); q.addData(text); q.make();
    el.innerHTML=q.createSvgTag({cellSize:4,margin:2,scalable:true});
  }catch(e){ el.innerHTML='<div class="note">QR oluşturulamadı — aşağıdaki kodu kullan.</div>'; }
}

function wireLinkBlock(scope){

}

function bindYear(y){
  view.year=y; state.year=y;
  var Y=STORE.years[y]||migrateYear(y);
  STORE.years[y]=Y;
  state.groups=Y.groups;
  state.opening=Y.opening;
}
function curMonth(){ return (state.year===nowD.getFullYear())?nowD.getMonth():-1; }
function ytdLimit(){ var c=curMonth(); return c>=0?c:11; }

/* ════════════════════════════════════════════════════════════
   6 · HESAPLAMA
   ════════════════════════════════════════════════════════════ */
function compute(){
  var groups=state.groups, sub={};
  groups.forEach(function(g){
    var a=new Array(12).fill(0);
    g.items.forEach(function(it){ it.values.forEach(function(v,m){ a[m]+=(+v||0); }); });
    sub[g.id]=a;
  });
  var revenue=new Array(12).fill(0),cost=new Array(12).fill(0),realize=new Array(12).fill(0);
  groups.forEach(function(g){
    var tgt=g.type==='revenue'?revenue:(g.type==='realize'?realize:cost);
    sub[g.id].forEach(function(v,m){ tgt[m]+=v; });
  });
  var saving=revenue.map(function(r,m){ return r-cost[m]; });
  var balance=[],run=state.opening;
  saving.forEach(function(s,m){ run+=s; balance[m]=run; });
  return {sub:sub,revenue:revenue,cost:cost,realize:realize,saving:saving,balance:balance};
}
/* yatırımda kalan (net): alım + realize ekler, satış düşer */
function investSplit(upto){
  var hisse=0,altin=0;
  function s(arr){ if(upto==null) return yearSum(arr); var t=0; for(var i=0;i<=upto;i++) t+=arr[i]; return t; }
  state.groups.forEach(function(g){
    var sign=g.type==='revenue'?-1:1;
    g.items.forEach(function(it){
      if(it.invest==='hisse') hisse+=sign*s(it.values);
      if(it.invest==='altin') altin+=sign*s(it.values);
    });
  });
  if(hisse<0) hisse=0; if(altin<0) altin=0;
  return {hisse:hisse,altin:altin,sum:hisse+altin};
}

function exportBackup(){
  var blob=new Blob([payload()],{type:'application/json'});
  var url=URL.createObjectURL(blob);
  var a=document.createElement('a'); a.href=url; a.download='pnl-yedek.json';
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(function(){ URL.revokeObjectURL(url); },1000);
}
function importBackup(file,done){
  var reader=new FileReader();
  reader.onload=function(){
    try{
      var d=JSON.parse(reader.result);
      if(d.years) adopt(d);
      else if(Array.isArray(d.groups)){   // eski tek-yıl yedeği
        var y=d.year||state.year;
        STORE.years[y]={opening:(typeof d.opening==='number'?d.opening:0),groups:ensureGroups(d.groups)};
        bindYear(y);
      } else throw new Error('bilinmeyen biçim');
      touched(); render(); if(done) done(true);
    }catch(err){ if(done) done(false); else alert('Yedek dosyası okunamadı.'); }
  };
  reader.readAsText(file);
}

function initialOf(name){
  var t=String(name||'').trim();
  if(!t) return '·';
  return t.charAt(0).toLocaleUpperCase('tr');
}
/* o ay hisseye giden nakit (alım − satış) */
function stockFlow(m){
  var v=0;
  state.groups.forEach(function(g){
    if(g.type==='realize') return;
    var sign=g.type==='revenue'?-1:1;
    g.items.forEach(function(it){ if(it.invest==='hisse') v+=sign*(+it.values[m]||0); });
  });
  return v;
}
function clampPct(x){ return Math.max(0,Math.min(100,Math.round(x))); }
function round2(x){ return Math.round(x*100)/100; }
function inferInvest(name){
  var n=String(name||'').trim();
  if(n==='Altın'||n==='Altın Satışı'||n==='Altın K/Z') return 'altin';
  if(n==='Hisse'||n==='Hisse Satışı'||n==='Hisse K/Z') return 'hisse';
  return undefined;
}
function byName(g,name){
  var key=String(name||'').trim().toLocaleLowerCase('tr');
  return g.items.filter(function(x){ return String(x.name||'').trim().toLocaleLowerCase('tr')===key; })[0]||null;
}
function locate(iid){
  for(var i=0;i<state.groups.length;i++){
    var it=findItem(state.groups[i],iid);
    if(it) return {g:state.groups[i],it:it};
  }
  return null;
}

function recentIds(){ try{ return JSON.parse(lsGet('pnl_recent')||'[]'); }catch(e){ return []; } }
function pushRecent(iid){
  var r=recentIds().filter(function(x){ return x!==iid; });
  r.unshift(iid);
  lsSet('pnl_recent',JSON.stringify(r.slice(0,12)));
}
function quickItems(){
  var out=[], seen={};
  recentIds().forEach(function(id){
    var x=locate(id);
    if(x&&!seen[id]&&x.g.type!=='realize'){ out.push(x); seen[id]=1; }
  });
  ['Günlük','Ev'].forEach(function(name){
    state.groups.forEach(function(g){
      if(g.name!==name) return;
      g.items.forEach(function(it){ if(!seen[it.id]){ out.push({g:g,it:it}); seen[it.id]=1; } });
    });
  });
  return out.slice(0,8);
}

function wireMobShell(){
  root.querySelectorAll('.tab').forEach(function(b){
    b.onclick=function(){ goTab(b.getAttribute('data-tab')); };
  });
  document.getElementById('mAdd').onclick=function(){ openItemSheet({month:view.month}); };
  document.getElementById('mSync').onclick=function(){
    if(!syncOn()){ goTab('ayar'); return; }
    sync().then(function(){ toast(SY.state==='err'?SY.msg:'Güncel ✓'); });
  };
  /* Ay sekmesinde sağa/sola kaydırarak ay değiştir */
  var sc=document.getElementById('mScroll'), sx=0, sy=0, ok=false;
  sc.addEventListener('touchstart',function(e){
    ok=view.tab==='ay'&&!e.target.closest('.lrow,.hscroll');
    sx=e.touches[0].clientX; sy=e.touches[0].clientY;
  },{passive:true});
  sc.addEventListener('touchend',function(e){
    if(!ok) return;
    var t=e.changedTouches[0], dx=t.clientX-sx, dy=t.clientY-sy;
    if(Math.abs(dx)>70&&Math.abs(dx)>Math.abs(dy)*2) shiftMonth(dx<0?1:-1);
  },{passive:true});
}
function goTab(t){
  view.tab=t; lsSet('pnl_tab',t);
  renderMob();
}
function renderMob(keep){
  if(!document.getElementById('mScroll')){ root.innerHTML=buildMobShell(); wireMobShell(); keep=false; }
  root.querySelectorAll('.tab').forEach(function(b){
    b.className='tab'+(b.getAttribute('data-tab')===view.tab?' on':'');
  });
  document.getElementById('mYear').textContent=view.year+' ·';
  var sc=document.getElementById('mScroll');
  var top=keep?sc.scrollTop:0;
  var tw=sc.querySelector('.tblwrap'), tl=keep&&tw?tw.scrollLeft:null, tt=keep&&tw?tw.scrollTop:0;
  sc.className='scroll';
  sc.innerHTML='';
  if(view.tab==='tablo') mobTable(tl,tt);
  else if(view.tab==='yil') mobYear();
  else if(view.tab==='ayar') mobSettings();
  else mobMonth();
  sc.scrollTop=top;
  paintSync();
}
function setMTitle(text,onTap){
  var el=document.getElementById('mTitle');

  el.onclick=onTap||null;

function setMNav(fn){
  var n=document.getElementById('mNav');
  if(!fn){ n.style.display='none'; return; }
  n.style.display='flex';
  n.innerHTML='<button aria-label="Önceki">'+SVG.left+'</button><button aria-label="Sonraki">'+SVG.right+'</button>';
  var b=n.querySelectorAll('button');
  b[0].onclick=function(){ fn(-1); };
  b[1].onclick=function(){ fn(1); };
}
function shiftMonth(d){
  var y=view.year, nm=view.month+d;
  if(nm<0){ if(YEARS.indexOf(y-1)>=0){ bindYear(y-1); nm=11; } else nm=0; }
  else if(nm>11){ if(YEARS.indexOf(y+1)>=0){ bindYear(y+1); nm=0; } else nm=11; }
  view.month=nm; renderMob();
}
function shiftYear(d){
  var i=YEARS.indexOf(view.year)+d;
  if(i<0||i>=YEARS.length) return;
  bindYear(YEARS[i]); renderMob();
}

function mobMonth(){
  var c=compute(), m=view.month, y=view.year;
  var scroll=document.getElementById('mScroll');
  var f=document.createDocumentFragment();

  setMTitle(MONTHS_L[m],openMonthPick);

  /* hero — elimde kalan + gelen/giden */
  var cash=c.balance[m], stk=investSplit(m).hisse, stockM=stockFlow(m);
  var note=[];
  if(stk>0.5) note.push('Hissede '+fmtM(stk)+(stockM>0.5?' (bu ay +'+fmtM(stockM)+')':''));
  if(stk>0.5) note.push('toplam '+fmtM(cash+stk));

    '<div class="hero-l">'+MONTHS_L[m]+' sonu · elimde kalan</div>'+
    '<div class="hero-big tnum" style="color:'+(cash<0?'#f0a58f':'')+'">'+fmtM(cash)+'</div>'+
    '<div class="hero-note tnum">'+note.join(' · ')+'</div>'+
    '<div class="hero-g three">'+
      '<div><div class="k">Gelen</div><div class="v tnum" style="color:#8fd9b1">'+signedM(c.revenue[m])+'</div></div>'+
      '<div><div class="k">Giden</div><div class="v tnum" style="color:#f0b49c">'+signedM(-c.cost[m])+'</div></div>'+
      '<div><div class="k">Bu ay net</div><div class="v tnum">'+signedM(c.saving[m])+'</div></div>'+
    '</div>'+
  '</div>'));

  /* hızlı ekle */
  f.appendChild(h('<div class="sechd"><div class="t">Hızlı ekle</div><div class="m">dokun → tutarı yaz</div></div>'));
  var qs=document.createElement('div'); qs.className='hscroll';
  quickItems().forEach(function(x){
    var b=h('<button class="qchip"><b>+</b>'+esc(x.it.name)+'</button>').firstChild;
    b.onclick=function(){ openItemSheet({gid:x.g.id,iid:x.it.id,month:m,mode:'add'}); };
    qs.appendChild(b);
  });
  var nb=h('<button class="qchip"><b>+</b>Başka…</button>').firstChild;
  nb.onclick=function(){ openItemSheet({month:m}); };
  qs.appendChild(nb);
  f.appendChild(qs);

  /* nereye gitti / nereden geldi */
  function drawCats(type,total,emptyMsg,label){
    var rows=state.groups.filter(function(g){ return g.type===type; })
      .map(function(g){ return {g:g,val:c.sub[g.id][m]}; })
      .filter(function(r){ return Math.abs(r.val)>0.5; })
      .sort(function(a,b){ return Math.abs(b.val)-Math.abs(a.val); });
    var cw=document.createElement('div'); cw.className='card'; cw.style.padding='14px 18px 10px';
    cw.appendChild(h('<div class="hero-r" style="margin-bottom:4px"><div class="sh-t" style="font-size:15px">'+label+'</div><div class="tnum" style="font-size:14px;font-weight:700;color:'+(type==='revenue'?GREEN:INK)+'">'+fmtM(total)+'</div></div>'));
    if(!rows.length){ cw.appendChild(h('<div class="empty" style="padding:14px 4px">'+emptyMsg+'</div>')); return cw; }
    rows.forEach(function(r){
      var p=total?Math.round(Math.abs(r.val)/Math.abs(total)*100):0;
      var b=h('<button class="catrow">'+
        '<div class="cat-h"><div class="cat-n">'+esc(r.g.name)+'</div>'+
        '<div class="cat-a tnum">'+fmtM(r.val)+'</div><div class="cat-p">'+p+'%</div><div class="cat-c">›</div></div>'+
        '<div class="cat-b"><div style="width:'+p+'%;background:'+gcolor(r.g)+'"></div></div></button>').firstChild;
      b.onclick=function(){ openGroupSheet(r.g.id,m); };
      cw.appendChild(b);
    });
    return cw;
  }
  f.appendChild(drawCats('cost',c.cost[m],'Bu ay gider kaydı yok.','Nereye gitti'));
  f.appendChild(drawCats('revenue',c.revenue[m],'Bu ay gelir kaydı yok.','Nereden geldi'));

  /* o ayın kalemleri — dokun: düzenle · sola kaydır: bu aydan kaldır */
  var items=[];
  state.groups.forEach(function(g){
    g.items.forEach(function(it){
      var v=it.values[m];
      if(Math.abs(v)>0.005) items.push({g:g,it:it,v:v});
    });
  });
  f.appendChild(h('<div class="sechd"><div class="t">'+MONTHS_L[m]+' kalemleri</div><div class="m">'+items.length+' kalem</div></div>'));
  if(items.length) f.appendChild(h('<div class="hint">Dokun → düzenle · sola kaydır → bu aydan kaldır</div>'));
  var list=document.createElement('div'); list.className='list';
  if(!items.length){
    list.innerHTML='<div class="empty">Bu ayda kayıtlı kalem yok.<br>Alttaki yeşil + ile ekleyebilirsin.</div>';
  } else {
    var rank=function(g){ return g.type==='revenue'?0:(g.type==='cost'?1:2); };
    var order=state.groups.filter(function(g){
      return items.some(function(x){ return x.g.id===g.id; });
    }).sort(function(a,b){
      if(rank(a)!==rank(b)) return rank(a)-rank(b);
      return Math.abs(c.sub[b.id][m])-Math.abs(c.sub[a.id][m]);
    });
    order.forEach(function(g){
      var rows=items.filter(function(x){ return x.g.id===g.id; })
        .sort(function(a,b){ return Math.abs(b.v)-Math.abs(a.v); });
      var tot=rows.reduce(function(t,x){ return t+x.v; },0);
      var inc=g.type==='revenue';
      var col=gcolor(g);
      list.appendChild(h('<div class="lgh"><div class="g" style="color:'+col+'">'+esc(g.name)+(inc?' · gelir':'')+'</div>'+
        '<div class="s tnum" style="color:'+(inc?GREEN:'var(--m5)')+'">'+(inc?'+':'')+fmtM(tot)+'</div></div>'));
      rows.forEach(function(x){
        var neg=x.v<0;
        var amtCol=inc?GREEN:(g.type==='realize'?(neg?RUST:GREEN):INK);
        var row=h('<div class="lrow"><button class="rm">Kaldır</button><button class="li">'+
          '<div class="li-d" style="background:'+col+'">'+esc(initialOf(x.it.name))+'</div>'+
          '<div style="flex:1;min-width:0"><div class="li-n">'+esc(x.it.name)+'</div>'+
          '<div class="li-s">'+esc(g.name)+(rowEvery(x.it,m)?' · her ay':'')+'</div></div>'+
          '<div class="li-a tnum" style="color:'+amtCol+'">'+(inc?'+':'')+fmtM(x.v)+'</div></button></div>').firstChild;
        swipeRow(row,function(){ openItemSheet({gid:g.id,iid:x.it.id,month:m,mode:'set'}); },function(){
          mutate(function(){
            var hit=locate(x.it.id); if(!hit) return false;
            hit.it.values[m]=0;
            return hit.it.name+' · '+MONTHS_L[m]+' kaldırıldı';
          });
        });
        list.appendChild(row);
      });
    });
  }
  f.appendChild(list);

  /* toplam varlık: nakit + hisse */
  var cashY=c.balance[11], stkY=investSplit(11).hisse, totM=cash+stk, totY=cashY+stkY;
  var goal=STORE.goal||0;
  var pct=goal>0?clampPct(totM/goal*100):0;
  var pctEnd=goal>0?clampPct(totY/goal*100):0;
  var gc=h('<div class="card" style="margin-top:22px">'+
    '<div class="hero-r"><div class="sh-t" style="font-size:15px">Toplam varlık</div>'+
      '<button class="tnum" style="font-size:13px;font-weight:600;color:var(--m5);padding:4px 0" id="goalEdit">Hedef '+fmtM(goal)+' ›</button></div>'+
    '<div class="tsav">'+
      '<div><div class="k">Nakit</div><div class="v tnum" style="color:'+(cash>=0?INK:RUST)+'">'+fmtM(cash)+'</div></div>'+
      '<div><div class="k">Hisse</div><div class="v tnum" style="color:'+C_HISSE+'">'+fmtM(stk)+'</div></div>'+
    '</div>'+
    '<div class="tot"><span class="a">'+MONTHS_L[m]+' sonu toplam</span><span class="b tnum">'+fmtM(totM)+'</span></div>'+
    (goal>0?'<div class="bar" style="margin-top:14px"><div style="width:'+pct+'%"></div></div>'+
      '<div class="rowsm"><div>Hedefin %'+pct+'’i</div><div class="tnum">'+fmtM(goal)+'</div></div>':'')+
    '<div style="margin-top:14px;padding-top:14px;border-top:1px solid rgba(27,26,24,.07);display:flex;align-items:center;gap:10px">'+
      '<div style="font-size:12.5px;color:var(--m5);flex:1;line-height:1.4">'+y+' sonunda<br>nakit + hisse</div>'+
      '<div style="text-align:right">'+
        '<div class="tnum" style="font-size:19px;font-weight:700;color:'+(totY>=goal&&goal>0?GREEN:INK)+'">'+fmtM(totY)+'</div>'+
        '<div style="font-size:12px;font-weight:600;color:var(--m4)">'+(goal>0?'hedefin %'+pctEnd+'’i':fmtM(cashY)+' nakit')+'</div>'+
      '</div>'+
    '</div>'+
    '<button class="opn" id="openEdit">Açılış bakiyesi '+fmtM(state.opening)+' dahil · değiştir ›</button>'+
  '</div>');
  gc.querySelector('#goalEdit').onclick=openGoal;
  gc.querySelector('#openEdit').onclick=openOpening;
  f.appendChild(gc);

  scroll.appendChild(f);
}
/* kalem bu aydan sonra her ay aynı mı? (liste altyazısı için) */
function rowEvery(it,m){
  if(m>=11) return false;
  for(var i=m+1;i<12;i++){ if(it.values[i]!==it.values[m]) return false; }
  return true;
}
/* sola kaydırınca "Kaldır" düğmesi açılır */
function swipeRow(row,onTap,onRemove){
  var li=row.querySelector('.li'), rm=row.querySelector('.rm');
  var sx=0, sy=0, dx=0, drag=null, open=false, moved=false;
  function set(x,anim){ li.style.transition=anim?'':'none'; li.style.transform=x?'translateX('+x+'px)':''; }
  li.addEventListener('touchstart',function(e){
    sx=e.touches[0].clientX; sy=e.touches[0].clientY; dx=0; drag=null; moved=false;
  },{passive:true});
  li.addEventListener('touchmove',function(e){
    var mx=e.touches[0].clientX-sx, my=e.touches[0].clientY-sy;
    if(drag===null){
      if(Math.abs(mx)<8&&Math.abs(my)<8) return;
      drag=Math.abs(mx)>Math.abs(my);
    }
    if(!drag) return;
    moved=true;
    dx=Math.min(0,Math.max(-130,(open?-96:0)+mx));
    set(dx,false);
  },{passive:true});
  li.addEventListener('touchend',function(){
    if(!drag) return;
    open=dx<-48;
    set(open?-96:0,true);
  });
  li.onclick=function(){
    if(moved){ moved=false; return; }
    if(open){ open=false; set(0,true); return; }
    onTap();
  };
  rm.onclick=onRemove;
}

/* ---------- MOBİL · TABLO ---------- */
function mobTable(keepLeft,keepTop){
  var c=compute(), cm=curMonth(), sm=view.month, y=view.year;
  var scroll=document.getElementById('mScroll');
  scroll.className='scroll flat';
  setMTitle(String(y),openYearPick);
  setMNav(shiftYear);

  function cls(mm){ return (mm===cm?' cm':'')+(mm===sm?' sm':''); }
  function numTd(v,extra,attrs,color){
    return '<td class="'+(v?'':'z')+(extra||'')+'"'+(attrs||'')+(color?' style="color:'+color+'"':'')+'>'+(v?fmtPlain(v):'–')+'</td>';
  }
  var head='<thead><tr><th class="nm">Kalem</th>'+
    MONTHS.map(function(t,mm){ return '<th class="'+cls(mm).trim()+'" data-hm="'+mm+'">'+t+'</th>'; }).join('')+
    '<th class="yt">Yıl</th></tr></thead>';

  function groupRows(g,extraCls){
    var col=gcolor(g), isR=g.type==='realize', st=c.sub[g.id], html='';
    html+='<tr class="gh'+(extraCls||'')+'"><td class="nm" style="color:'+col+'">'+esc(g.name)+'</td><td colspan="13"></td></tr>';
    g.items.forEach(function(it){
      html+='<tr><td class="nm tap" data-g="'+g.id+'" data-i="'+it.id+'">'+esc(it.name)+'</td>'+
        it.values.map(function(v,mm){
          return numTd(v,' c'+cls(mm),' data-g="'+g.id+'" data-i="'+it.id+'" data-m="'+mm+'"',isR&&v<0?RUST:'');
        }).join('')+
        numTd(yearSum(it.values),' yt','',isR&&yearSum(it.values)<0?RUST:'')+'</tr>';
    });
    html+='<tr class="st"><td class="nm" style="color:'+col+'">'+(isR?'Net K/Z':'Toplam')+'</td>'+
      st.map(function(v,mm){ return numTd(v,cls(mm),'',isR?(v<0?RUST:(v>0?GREEN:'')):''); }).join('')+
      numTd(yearSum(st),' yt','')+'</tr>';
    return html;
  }
  var body='';
  state.groups.forEach(function(g){ if(g.type!=='realize') body+=groupRows(g); });
  body+='<tr class="sv"><td class="nm">Tasarruf</td>'+
    c.saving.map(function(v,mm){ return numTd(v,cls(mm),'',v<0?RUST:GREEN); }).join('')+
    numTd(yearSum(c.saving),' yt','',yearSum(c.saving)<0?RUST:GREEN)+'</tr>';
  body+='<tr class="bl"><td class="nm">Bakiye</td>'+
    c.balance.map(function(v,mm){ return '<td class="'+cls(mm).trim()+'" style="'+(v<0?'color:#ff9b8e':'')+'">'+fmtPlain(v)+'</td>'; }).join('')+
    '<td class="yt">'+fmtPlain(c.balance[11])+'</td></tr>';
  var first=true;
  state.groups.forEach(function(g){ if(g.type==='realize'){ body+=groupRows(g,first?' rz':''); first=false; } });

  var hint=h('<div class="tblhint">Rakama dokun → düzenle · ay adına dokun → o aya git · açılış '+fmtM(state.opening)+'</div>');
  var wrap=document.createElement('div'); wrap.className='tblwrap';
  wrap.innerHTML='<table class="tbl">'+head+'<tbody>'+body+'</tbody></table>';
  wrap.onclick=function(e){
    var t=e.target.closest('td,th'); if(!t) return;
    if(t.hasAttribute('data-hm')){ view.month=+t.getAttribute('data-hm'); goTab('ay'); return; }
    var gid=t.getAttribute('data-g'), iid=t.getAttribute('data-i');
    if(!gid||!iid) return;
    var mm=t.hasAttribute('data-m')?+t.getAttribute('data-m'):view.month;
    openItemSheet({gid:gid,iid:iid,month:mm,mode:'set'});
  };
  scroll.appendChild(hint);
  scroll.appendChild(wrap);
  if(keepLeft!=null){ wrap.scrollLeft=keepLeft; wrap.scrollTop=keepTop||0; }
  else {
    var th=wrap.querySelector('th[data-hm="'+sm+'"]');
    if(th) wrap.scrollLeft=Math.max(0,th.offsetLeft-132-62);
  }
}

  /* 12 ay — dokun → o aya git */

  var hFrac=inv.sum>0?inv.hisse/inv.sum:0, aFrac=inv.sum>0?inv.altin/inv.sum:0;
  var C=2*Math.PI*60;
  f.appendChild(h('<div class="card">'+

/* ---------- MOBİL sheet altyapısı ---------- */
var sheetOpen=false, pendingRender=false;
function closeSheet(){
  var hst=document.getElementById('sheetHost'); if(hst) hst.innerHTML='';
  sheetOpen=false;
  if(pendingRender){ pendingRender=false; render(true); }
}
function sheet(inner){
  sheetOpen=true;
  var host=document.getElementById('sheetHost');
  host.innerHTML='';
  var scrim=document.createElement('div'); scrim.className='scrim';
  var spacer=document.createElement('div'); spacer.style.flex='1'; spacer.onclick=closeSheet;
  var s=document.createElement('div'); s.className='sheet';
  s.appendChild(inner);
  scrim.appendChild(spacer); scrim.appendChild(s);
  host.appendChild(scrim);
  return s;
}
var toastT=null;
function toast(msg,act,fn){
  var host=document.getElementById('toastHost');
  if(!host) return;
  clearTimeout(toastT);
  host.innerHTML='';
  var el=h('<div class="toast"><span>'+esc(msg)+'</span>'+(act?'<button>'+esc(act)+'</button>':'')+'</div>').firstChild;
  if(act) el.querySelector('button').onclick=function(){ clearTimeout(toastT); host.innerHTML=''; fn(); };
  host.appendChild(el);
  toastT=setTimeout(function(){ host.innerHTML=''; },act?5000:2200);
}

/* ---------- kategori detayı ---------- */
function openGroupSheet(gid,m){
  var g=find(gid); if(!g) return;
  var c=compute(), yearMode=(m==null);
  var rows=g.items.map(function(it){ return {it:it,v:yearMode?yearSum(it.values):(+it.values[m]||0)}; })
    .sort(function(a,b){ return Math.abs(b.v)-Math.abs(a.v); });
  var total=yearMode?yearSum(c.sub[g.id]):c.sub[g.id][m];
  var st=c.sub[g.id], mx=Math.max(1,Math.max.apply(null,st.map(Math.abs)));
  var col=gcolor(g);
  var inner=h('<div><div class="grab"></div>'+
    '<div class="sh-h"><div class="sh-t">'+esc(g.name)+' · '+(yearMode?view.year:MONTHS_L[m])+'</div><button class="sh-x">Kapat</button></div>'+
    '<div class="tnum" style="font-size:30px;font-weight:700;letter-spacing:-.02em;margin-top:6px">'+fmtM(total)+'</div>'+
    '<div class="spark" style="height:40px">'+st.map(function(v,i){
      return '<div style="height:'+Math.max(2,Math.round(Math.abs(v)/mx*36))+'px;background:'+((!yearMode&&i===m)?col:rgba('#1b1a18',.12))+'"></div>';
    }).join('')+'</div>'+
    '<div class="sparkx">'+MONTHS.map(function(n){ return '<div>'+n[0]+'</div>'; }).join('')+'</div>'+
    '<div class="list" id="gList" style="margin-top:14px"></div>'+
    '<button class="save" id="gAdd">+ '+esc(g.name)+' kategorisine ekle</button>'+
  '</div>');
  var s=sheet(inner);
  s.querySelector('.sh-x').onclick=closeSheet;
  var list=s.querySelector('#gList');
  rows.forEach(function(r){
    var b=h('<button class="li">'+
      '<div class="li-d" style="background:'+col+'">'+esc(initialOf(r.it.name))+'</div>'+
      '<div style="flex:1;min-width:0"><div class="li-n">'+esc(r.it.name)+'</div>'+
      (yearMode?'':'<div class="li-s">yıl: '+fmtM(yearSum(r.it.values))+'</div>')+'</div>'+
      '<div class="li-a tnum" style="color:'+(Math.abs(r.v)<0.005?'var(--m3)':(r.v<0?RUST:INK))+'">'+fmtM(r.v)+'</div></button>').firstChild;
    b.style.borderBottom='1px solid rgba(27,26,24,.06)';
    b.onclick=function(){ closeSheet(); openItemSheet({gid:g.id,iid:r.it.id,month:yearMode?view.month:m,mode:'set'}); };
    list.appendChild(b);
  });
  s.querySelector('#gAdd').onclick=function(){ closeSheet(); openItemSheet({gid:g.id,month:yearMode?view.month:m}); };
}

/* ---------- MOBİL: kalem ekle / düzenle ---------- */
function defaultGroupId(){
  var g=state.groups.filter(function(x){ return x.name==='Günlük'; })[0]
      || state.groups.filter(function(x){ return x.name==='Değişken'; })[0]
      || state.groups.filter(function(x){ return x.type==='cost'; })[0]
      || state.groups[0];
  return g?g.id:null;
}
/* o: {gid, iid, month, mode:'add'|'set'}
   mode 'set' + iid → var olan kalemi düzenle (listeden / tablodan)
   aksi halde        → yeni giriş (varsa kalemin üstüne ekler) */
function openItemSheet(o){
  o=o||{};
  var m=(o.month!=null?o.month:view.month);
  var g0=o.gid?find(o.gid):null, it0=(g0&&o.iid)?findItem(g0,o.iid):null;
  var editing=!!(it0&&o.mode==='set');
  var d={gid:g0?g0.id:defaultGroupId(), origGid:g0?g0.id:null, iid:it0?it0.id:null, mode:editing?'set':'add', every:false, neg:false};
  var cur0=it0?(+it0.values[m]||0):0;
  if(editing) d.neg=cur0<0;

  var inner=h('<div>'+
    '<div class="grab"></div>'+
    '<div class="sh-bar"><button class="sh-x">Vazgeç</button>'+
      '<div class="sh-t">'+(editing?'Düzenle':'Ekle')+' · '+MONTHS_L[m]+'</div>'+
      '<button class="okb" id="itOk">Kaydet</button></div>'+
    '<div class="amt"><button class="sign" id="itSign" aria-label="İşareti değiştir">+</button>'+
      '<input id="itAmt" inputmode="decimal" autocomplete="off" placeholder="0" value="'+(editing&&cur0?esc(String(Math.abs(cur0))):'')+'">'+
      '<span class="cur">€</span></div>'+
    '<div class="prev" id="itPrev"></div>'+
    '<div class="seg" id="itMode" style="display:none">'+
      '<button data-x="add">Üstüne ekle (+)</button><button data-x="set">Yerine yaz (=)</button>'+
    '</div>'+
    '<div class="lab">Kategori</div>'+
    '<div class="chips" id="itGrp"></div>'+
    '<div class="lab" id="itItemsLab">Kalem</div>'+
    '<div class="chips" id="itItems"></div>'+
    '<div class="field"><input class="inp" id="itName" autocomplete="off" placeholder="'+(editing?'Kalem adı':'…ya da yeni kalem adı yaz')+'" value="'+(editing?esc(it0.name):'')+'"></div>'+
    '<div class="lab">Ne zaman</div>'+
    '<div class="seg" id="itSeg">'+
      '<button data-e="0" class="on">Sadece '+MONTHS_L[m]+'</button>'+
      '<button data-e="1">'+MONTHS_L[m]+' ve sonrası her ay</button>'+
    '</div>'+
    '<button class="save" id="itSave">Kaydet</button>'+
    (editing?'<div class="delrow"><button class="del" id="itClr">Bu aydan kaldır</button><button class="del" id="itDel">Tüm yıldan sil</button></div>':'')+
  '</div>');

  var sh=sheet(inner);
  var amtIn=sh.querySelector('#itAmt'), nameIn=sh.querySelector('#itName');
  var signB=sh.querySelector('#itSign'), prev=sh.querySelector('#itPrev');

  function target(){
    if(editing){ var og=find(d.origGid); return og&&findItem(og,d.iid); }
    var g=find(d.gid); if(!g) return null;
    if(d.iid){ var x=findItem(g,d.iid); if(x) return x; }
    var nm=nameIn.value.trim();
    return nm?byName(g,nm):null;
  }
  function amount(){ var a=Math.abs(num(amtIn.value)); return d.neg?-a:a; }
  function paint(){
    signB.textContent=d.neg?'−':'+';
    signB.className='sign'+(d.neg?' neg':'');
    var t=target(), cur=t?(+t.values[m]||0):0, a=amount();
    var showMode=!!t&&Math.abs(cur)>0.005;
    var seg=sh.querySelector('#itMode');
    seg.style.display=showMode?'flex':'none';
    seg.querySelectorAll('button').forEach(function(b){ b.className=(b.getAttribute('data-x')===d.mode?'on':''); });
    var next=(d.mode==='add'&&showMode)?round2(cur+a):a;
    var txt='';
    if(t) txt=esc(t.name)+': '+fmtM(cur)+' → <b>'+fmtM(next)+'</b>';
    else if(nameIn.value.trim()) txt='Yeni kalem: <b>'+fmtM(next)+'</b>';
    if(txt&&d.every&&m<11) txt+=' · '+MONTHS[m]+'–Ara';
    prev.innerHTML=txt;
  }
  function paintGroups(){
    var box=sh.querySelector('#itGrp');
    box.innerHTML=state.groups.map(function(x){
      return '<button data-g="'+x.id+'" class="'+(x.id===d.gid?'on':'')+'"><i style="background:'+gcolor(x)+'"></i>'+esc(x.name)+'</button>';
    }).join('');
    box.querySelectorAll('button').forEach(function(b){
      b.onclick=function(){
        d.gid=b.getAttribute('data-g');
        if(!editing) d.iid=null;
        paintGroups(); paintItems(); paint();
      };
    });
  }
  function paintItems(){
    var box=sh.querySelector('#itItems'), lab=sh.querySelector('#itItemsLab');
    if(editing){ box.style.display='none'; lab.textContent='Kalem adı'; return; }
    var g=find(d.gid);
    var items=g?g.items.slice():[];
    box.innerHTML=items.map(function(it){
      var v=+it.values[m]||0;
      return '<button data-i="'+it.id+'" class="'+(it.id===d.iid?'on':'')+'">'+esc(it.name)+(Math.abs(v)>0.005?' <small class="tnum">'+fmtPlain(v)+'</small>':'')+'</button>';
    }).join('');
    lab.style.display=box.style.display=items.length?'':'none';
    box.querySelectorAll('button').forEach(function(b){
      b.onclick=function(){
        var id=b.getAttribute('data-i');
        d.iid=(d.iid===id?null:id);
        if(d.iid){ nameIn.value=''; d.mode='add'; }
        paintItems(); paint();
        amtIn.focus();
      };
    });
  }

  sh.querySelector('.sh-x').onclick=closeSheet;
  signB.onclick=function(){ d.neg=!d.neg; paint(); };
  amtIn.oninput=paint;
  amtIn.onkeydown=function(e){ if(e.key==='Enter') save(); };
  nameIn.oninput=function(){
    if(!editing&&d.iid){ d.iid=null; paintItems(); }
    paint();
  };
  sh.querySelectorAll('#itMode button').forEach(function(b){
    b.onclick=function(){
      d.mode=b.getAttribute('data-x');
      var t=target(), cur=t?(+t.values[m]||0):0;
      if(d.mode==='set'){ amtIn.value=cur?String(Math.abs(cur)):''; d.neg=cur<0; }
      else { amtIn.value=''; d.neg=false; }
      paint(); amtIn.focus();
    };
  });
  sh.querySelectorAll('#itSeg button').forEach(function(b){
    b.onclick=function(){
      d.every=b.getAttribute('data-e')==='1';
      sh.querySelectorAll('#itSeg button').forEach(function(x){ x.className=''; });
      b.className='on';
      paint();
    };
  });

  function save(){
    var a=amount(), nm=nameIn.value.trim();
    var showMode=(function(){ var t=target(); return !!t&&Math.abs(+t.values[m]||0)>0.005; })();
    if(!editing&&!d.iid&&!nm){ toast('Bir kalem seç ya da ad yaz'); nameIn.focus(); return; }
    if(!editing&&!a&&!(showMode&&d.mode==='set')){ toast('Tutar gir'); amtIn.focus(); return; }
    var addMode=(d.mode==='add'&&showMode);
    closeSheet();
    mutate(function(){
      var g=find(d.gid); if(!g) return false;
      var it=null;
      if(editing){
        var og=find(d.origGid); it=og&&findItem(og,d.iid); if(!it) return false;
        if(og!==g){ og.items=og.items.filter(function(x){ return x!==it; }); g.items.push(it); }
        if(nm) it.name=nm;
      } else {
        if(d.iid) it=findItem(g,d.iid);
        if(!it&&nm) it=byName(g,nm);
        if(!it){
          it={id:uid('i'),name:nm,values:new Array(12).fill(0)};
          var inv=inferInvest(nm); if(inv) it.invest=inv;
          g.items.push(it);
        }
      }
      for(var i=m;i<(d.every?12:m+1);i++){
        it.values[i]=addMode?round2((+it.values[i]||0)+a):a;
      }
      pushRecent(it.id);
      return it.name+' · '+MONTHS_L[m]+': '+fmtM(it.values[m]);
    });
  }
  sh.querySelector('#itSave').onclick=save;
  sh.querySelector('#itOk').onclick=save;

  if(editing){
    sh.querySelector('#itClr').onclick=function(){
      closeSheet();
      mutate(function(){
        var hit=locate(d.iid); if(!hit) return false;
        hit.it.values[m]=0;
        return hit.it.name+' · '+MONTHS_L[m]+' kaldırıldı';
      });
    };
    var delB=sh.querySelector('#itDel');
    delB.onclick=function(){
      if(!delB.classList.contains('armed')){
        delB.classList.add('armed'); delB.textContent='Emin misin? 12 ay silinir';
        return;
      }
      closeSheet();
      mutate(function(){
        var hit=locate(d.iid); if(!hit) return false;
        hit.g.items=hit.g.items.filter(function(x){ return x.id!==d.iid; });
        return hit.it.name+' silindi';
      });
    };
  }

  paintGroups(); paintItems(); paint();
  if(!editing||!cur0) amtIn.focus();
}

      '<div class="lab">Gist kimliği</div>'+

      '<div class="note">Token’ı github.com → Settings → Developer settings → Personal access tokens’tan, sadece <b>gist</b> izniyle oluştur.</div>';
    if(view.mode==='web'){
      html+='<div class="note" style="text-align:left">Telefonu bağlamak için önce bu bilgisayarda senkronu aç; sonra burada QR çıkacak.</div>'+tokenHTML+'<details><summary>Başka cihazdan bağlantı kodun mu var?</summary>'+codeHTML+'</details>';
    } else {
      html+='<ol class="steps">'+
          '<li>Bilgisayarda PNL’i aç → <b>📱 Telefonu bağla</b>.</li>'+
          '<li>Çıkan QR’ı telefon kamerasıyla okut'+(standalone?' — ana ekran uygulamasında ise kodu kopyalayıp aşağıya yapıştır.':' ya da kodu kopyalayıp aşağıya yapıştır.')+'</li>'+
        '</ol>'+codeHTML+
        '<details><summary>Elle GitHub token gir</summary>'+tokenHTML+'</details>';
    }
  }
  html+='<div class="note">Token yalnızca bu cihazda saklanır, veriler gizli bir Gist içinde tutulur.</div>';
  return html;
}
function wireSync(s,after){
  function q(sel){ return s.querySelector(sel); }
  if(syncOn()){
    q('#skNow').onclick=function(){ sync().then(function(){ after.done(SY.state==='err'?'':'Güncel ✓'); }); };
    q('#skLinkBtn').onclick=function(){
      var box=q('#skLink');
      if(box.innerHTML){ box.innerHTML=''; return; }
      box.innerHTML=linkBlockHTML(); wireLinkBlock(box);
    };
    q('#skPull').onclick=function(){
      if(!confirm('Buluttaki veri bu cihazdakinin yerine geçecek. Devam?')) return;
      forcePull().then(function(){ after.done(SY.state==='err'?'':'Buluttan alındı'); });
    };
    q('#skPush').onclick=function(){
      if(!confirm('Bu cihazdaki veri buluttakinin (ve diğer cihazların) yerine geçecek. Devam?')) return;
      forcePush().then(function(){ after.done(SY.state==='err'?'':'Buluta gönderildi'); });
    };
    q('#skOff').onclick=function(){
      if(!confirm('Bu cihazda senkron kapatılsın mı? Veriler silinmez, sadece bağlantı kesilir.')) return;
      disconnect(); after.done('Senkron kapatıldı');
    };
  } else {
    q('#skCodeGo').onclick=function(){
      var cfg=parseLink(q('#skCode').value);
      if(!cfg){ alert('Kod tanınmadı. Bilgisayardaki “Kodu kopyala” ile aldığın metnin tamamını yapıştır.'); return; }
      connectWith(cfg,'adopt').then(function(){ after.done(SY.state==='err'?'':'Bağlandı ✓'); });
      after.done('');
    };
    q('#skSave').onclick=function(){
      var tk=q('#tkIn').value.trim();
      if(!tk){ alert('Token gir.'); return; }
      connectWith({token:tk,gist:q('#gsIn').value.trim()},'ask').then(function(){ after.done(SY.state==='err'?'':'Bağlandı ✓'); });
      after.done('');
    };
  }
}
/* web tarafı için modal */
function openSyncModal(showLink){
  var back=document.createElement('div');
  back.style.cssText='position:fixed;inset:0;z-index:80;background:rgba(58,52,44,.34);display:flex;align-items:center;justify-content:center;padding:20px';
  var box=document.createElement('div');
  box.className='mobscope';
  box.style.cssText='background:#f6f5f2;color:#1b1a18;border-radius:22px;max-width:420px;width:100%;max-height:90vh;overflow-y:auto;padding:18px 22px 24px;font-family:-apple-system,BlinkMacSystemFont,system-ui,sans-serif;'+
    '--ink:#1b1a18;--paper:#f6f5f2;--card:#fff;--green:#2f7a5b;--rust:#b4622f;--m1:rgba(27,26,24,.06);--m2:rgba(27,26,24,.1);--m3:rgba(27,26,24,.3);--m4:rgba(27,26,24,.55);--m5:rgba(27,26,24,.6);--m6:rgba(27,26,24,.72);--safeB:0px';
  back.appendChild(box);
  back.onclick=function(e){ if(e.target===back) cleanup(); };
  document.body.appendChild(back);
  function cleanup(){ back.remove(); }
  function paint(){
    box.innerHTML='<div class="sh-h"><div class="sh-t">Senkron</div><button class="sh-x">Kapat</button></div>'+syncBodyHTML();
    box.querySelector('.sh-x').onclick=cleanup;
    var lb=box.querySelector('#skLinkBtn'); if(lb) lb.textContent='Telefonu bağla (QR / kod)';
    wireSync(box,{done:function(){ render(); paint(); }});
    paintSync();
  }
  paint();
  if(showLink&&syncOn()) box.querySelector('#skLinkBtn').click();
}

var MQ=window.matchMedia('(max-width: 820px)');
var MQ2=window.matchMedia('(pointer: coarse) and (max-height: 520px)');   /* yan çevrilmiş telefon */
function viewPref(){ var p=lsGet('pnl_view'); return (p==='mob'||p==='web')?p:'auto'; }
function smallScreen(){ return MQ.matches||MQ2.matches; }
function wantMode(){ var p=viewPref(); return p!=='auto'?p:(smallScreen()?'mob':'web'); }

function applyBodyClass(mode){
  document.body.className=(mode==='mob'?'mob':'web');
  document.documentElement.className=(mode==='mob'?'mob':'');
}
function render(keep){
  var mode=wantMode();
  if(mode!==view.mode) keep=false;
  view.mode=mode;
  applyBodyClass(mode);
  if(mode==='web'){ root.innerHTML=buildWeb(); paintSync(); }
  else renderMob(keep);
}
/* senkrondan gelen yenileme kullanıcının yazdığını bölmesin */
function requestRender(){
  if(view.mode==='mob'&&sheetOpen){ pendingRender=true; return; }
  var a=document.activeElement;
  if(view.mode==='web'&&a&&root.contains(a)&&a.tagName==='INPUT'){ pendingRender=true; return; }
  render(true);
}
root.addEventListener('focusout',function(){
  setTimeout(function(){
    if(!pendingRender||view.mode!=='web') return;
    var a=document.activeElement;
    if(a&&root.contains(a)&&a.tagName==='INPUT') return;
    pendingRender=false; render(true);
  },0);
});
function onMQ(){ if(wantMode()!==view.mode) render(); }
[MQ,MQ2].forEach(function(q){
  if(q.addEventListener) q.addEventListener('change',onMQ); else if(q.addListener) q.addListener(onMQ);
});
/* klavye açılınca alt sayfa klavyenin üstünde kalsın (iOS) */
if(window.visualViewport){
  var onVV=function(){
    var vv=window.visualViewport;
    var kb=Math.max(0,Math.round(window.innerHeight-vv.height-vv.offsetTop));
    document.documentElement.style.setProperty('--kb',(kb>80?kb:0)+'px');
  };
  window.visualViewport.addEventListener('resize',onVV);
  window.visualViewport.addEventListener('scroll',onVV);
}
document.addEventListener('keydown',function(e){ if(e.key==='Escape'&&sheetOpen) closeSheet(); });

/* web olay delegasyonu */
root.addEventListener('change',function(e){
  if(view.mode!=='web') return;
  var t=e.target,act=t.getAttribute&&t.getAttribute('data-act'); if(!act) return;
  if(act==='cell') setCell(t.getAttribute('data-g'),t.getAttribute('data-i'),+t.getAttribute('data-m'),t.value);
  else if(act==='name') setName(t.getAttribute('data-g'),t.getAttribute('data-i'),t.value);
  else if(act==='opening') setOpening(t.value);
  else if(act==='import'){
    var file=t.files&&t.files[0];
    if(file) importBackup(file,function(okz){ if(!okz) alert('Yedek dosyası okunamadı.'); });
    t.value='';
  }
});
root.addEventListener('click',function(e){
  if(view.mode!=='web') return;
  var t=e.target.closest?e.target.closest('[data-act]'):e.target;
  var act=t&&t.getAttribute('data-act'); if(!act) return;
  if(act==='add') addItem(t.getAttribute('data-g'));
  else if(act==='del') delItem(t.getAttribute('data-g'),t.getAttribute('data-i'));
  else if(act==='year') setYear(+t.getAttribute('data-y'));
  else if(act==='export') exportBackup();
  else if(act==='sync') openSyncModal(false);
  else if(act==='link') openSyncModal(true);
  else if(act==='mobview'){ lsSet('pnl_view',''); render(); }
});

loadStore();
(function(){
  var ny=nowD.getFullYear();
  bindYear(YEARS.indexOf(ny)>=0?ny:YEARS[0]);
  view.month=(state.year===ny)?nowD.getMonth():0;
  var t=lsGet('pnl_tab');
  if(t==='ay'||t==='tablo'||t==='yil'||t==='ayar') view.tab=t;
})();
if(!STORE.updatedAt){ STORE.updatedAt=Date.now(); lsSet('pnl_pristine','1'); }   /* bu cihazda henüz hiç giriş yapılmadı */
persist();
var linked=consumeHash();
if(linked) view.tab='ay';
setSync(syncOn()?'busy':'off',syncOn()?'Bağlanılıyor…':'Senkron kapalı');
render();
if(syncOn()) sync().then(function(){
  if(linked&&view.mode==='mob') toast(SY.state==='err'?SY.msg:'Bilgisayarla bağlandı ✓');
});

})();
