<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}

/* ==========================================================
   WEB GÖRÜNÜMÜ — mevcut tasarım, olduğu gibi
   ========================================================== */
body.web{
  font-family:'Karla',system-ui,-apple-system,sans-serif;color:#3a342c;
  background:radial-gradient(140% 90% at 50% 0%, #f1eadd 0%, #ece4d6 55%, #e4dac8 100%);
  min-height:100vh;
}
body.web ::-webkit-scrollbar{height:11px;width:11px}
body.web ::-webkit-scrollbar-thumb{background:#cdbfa8;border-radius:8px;border:2px solid #fbf8f2}
body.web ::-webkit-scrollbar-track{background:#f1e8d7}
body.web #root{max-width:1440px;margin:0 auto;padding:28px 32px 48px}
body.web .pnl-cell{transition:background .1s}
body.web .pnl-cell:focus{background:#fff6e6!important;outline:2px solid #e3a23f;border-radius:5px}
body.web .ghostbtn{background:#fbf8f2;border:1px solid #d9ccb5;border-radius:9px;padding:8px 13px;font-size:13px;font-weight:600;color:#6b5f4d;cursor:pointer;transition:background .12s}
body.web .ghostbtn:hover{background:#f3ecdd}
body.web .kpi{display:grid;grid-template-columns:repeat(5,1fr);gap:14px;margin-bottom:16px}
body.web .charts{display:grid;grid-template-columns:1.7fr 1fr;gap:14px;margin-bottom:16px}
@media(max-width:1100px){body.web .kpi{grid-template-columns:repeat(3,1fr)}body.web .charts{grid-template-columns:1fr}}
@media(max-width:900px){body.web #root{padding:16px 12px 40px}}
@media(max-width:680px){body.web .kpi{grid-template-columns:repeat(2,1fr)}}

/* ==========================================================
   MOBİL GÖRÜNÜMÜ — telefon tasarımı, olduğu gibi
   ========================================================== */
body.mob{
  --ink:#1b1a18; --paper:#f6f5f2; --card:#fff;
  --green:#2f7a5b; --rust:#b4622f;
  --m1:rgba(27,26,24,.06); --m2:rgba(27,26,24,.08); --m3:rgba(27,26,24,.3);
  --m4:rgba(27,26,24,.42); --m5:rgba(27,26,24,.45); --m6:rgba(27,26,24,.6);
  --safeT:env(safe-area-inset-top,0px); --safeB:env(safe-area-inset-bottom,0px);
  background:#eceae5;
  font-family:-apple-system,BlinkMacSystemFont,system-ui,"Segoe UI","Helvetica Neue",sans-serif;
  color:var(--ink);-webkit-font-smoothing:antialiased;
  height:100%;overscroll-behavior:none;
  display:flex;align-items:center;justify-content:center;
}
html.mob{height:100%}
body.mob button{font:inherit;color:inherit;border:0;background:none;padding:0;cursor:pointer}
body.mob #root{
  position:relative;width:100%;max-width:440px;height:100%;max-height:100vh;
  background:var(--paper);display:flex;flex-direction:column;overflow:hidden;
}
@media(min-width:520px) and (min-height:800px){
  body.mob #root{height:calc(100vh - 40px);max-height:900px;border-radius:34px;box-shadow:0 20px 60px rgba(0,0,0,.18)}
}
body.mob .hdr{padding:calc(20px + var(--safeT)) 20px 8px;display:flex;align-items:flex-end;justify-content:space-between;gap:10px;flex:none}
body.mob .kicker{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--m4);font-weight:600}
body.mob .title{font-size:30px;font-weight:700;letter-spacing:-.02em;margin-top:3px;line-height:1.05;display:flex;align-items:center;gap:6px;white-space:nowrap;overflow:hidden;max-width:100%}
body.mob .title .chev{font-size:15px;font-weight:700;color:var(--m3);transform:translateY(1px)}
body.mob button.title:active{opacity:.55}
body.mob .hbtns{display:flex;gap:8px;align-items:center;flex:none}
body.mob .pill{padding:0 14px;height:38px;display:flex;align-items:center;border-radius:999px;background:var(--m1);font-size:13px;font-weight:600;color:var(--m6);white-space:nowrap}
body.mob .pill:active{background:var(--m2)}
body.mob .nav{display:flex;align-items:center;background:var(--m1);border-radius:999px;padding:3px;gap:1px}
body.mob .nav button{width:32px;height:32px;border-radius:999px;color:var(--m6);display:flex;align-items:center;justify-content:center;transition:background .12s}
body.mob .nav button:active{background:rgba(27,26,24,.1)}
body.mob .nav svg{width:15px;height:15px}
body.mob .sdot{width:38px;height:38px;border-radius:999px;background:var(--m1);display:flex;align-items:center;justify-content:center;flex:none}
body.mob .sdot i{width:9px;height:9px;border-radius:999px;display:block}
body.mob .sdot:active{background:var(--m2)}
body.mob .scroll{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:6px 16px calc(84px + var(--safeB))}
@keyframes sheetup{from{transform:translateY(100%)}to{transform:translateY(0)}}
@keyframes fadein{from{opacity:0}to{opacity:1}}

body.mob .hero{background:var(--ink);color:var(--paper);border-radius:24px;padding:20px 20px 18px}
body.mob .hero-r{display:flex;justify-content:space-between;align-items:baseline}
body.mob .hero-l{font-size:11.5px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:rgba(246,245,242,.5)}
body.mob .hero-b{display:flex;justify-content:space-between;align-items:flex-end;margin-top:6px}
body.mob .hero-big{font-size:32px;font-weight:700;letter-spacing:-.03em}
body.mob .hero-sm{font-size:17px;font-weight:600}
body.mob .hero-g{display:flex;gap:10px;margin-top:18px}
body.mob .hero-g>div{flex:1;background:rgba(246,245,242,.08);border-radius:14px;padding:11px 13px}
body.mob .hero-g .k{font-size:11px;color:rgba(246,245,242,.5);font-weight:600}
body.mob .hero-g .v{font-size:16px;font-weight:700;margin-top:2px}
body.mob .card{margin-top:14px;background:var(--card);border-radius:24px;padding:18px 20px;box-shadow:0 1px 2px rgba(0,0,0,.05)}
body.mob .sh-t,.mobscope .sh-t{font-size:17px;font-weight:700;letter-spacing:-.02em}
body.mob .sh-x,.mobscope .sh-x{font-size:13px;font-weight:600;color:var(--m5)}
body.mob .tsav{margin-top:14px;display:flex;gap:10px}
body.mob .tsav>div{flex:1;background:var(--m1);border-radius:14px;padding:11px 13px}
body.mob .tsav .k{font-size:11px;font-weight:600;color:var(--m5)}
body.mob .tsav .v{font-size:19px;font-weight:700;letter-spacing:-.02em;margin-top:3px}
body.mob .opn{margin-top:9px;width:100%;text-align:left;font-size:11.5px;font-weight:600;color:var(--m4);padding:2px}
body.mob .opn:active{color:var(--m6)}
body.mob .bar{margin-top:12px;height:10px;border-radius:999px;background:var(--m2);overflow:hidden}
body.mob .bar>div{height:100%;border-radius:999px;background:var(--green);transition:width .4s}
body.mob .rowsm{display:flex;justify-content:space-between;margin-top:9px;font-size:11.5px;color:var(--m5);font-weight:600}
body.mob .sechd{margin-top:22px;display:flex;align-items:baseline;justify-content:space-between;gap:8px}
body.mob .sechd .t{font-size:13px;font-weight:700;letter-spacing:-.01em}
body.mob .sechd .m{font-size:11.5px;font-weight:600;color:var(--m4)}
body.mob .lab,.mobscope .lab{margin-top:18px;font-size:11px;letter-spacing:.12em;text-transform:uppercase;font-weight:700;color:var(--m4)}
body.mob .catrow{margin-bottom:12px}
body.mob .cat-h{display:flex;align-items:baseline;gap:8px}
body.mob .cat-n{font-size:13.5px;font-weight:600;flex:1}
body.mob .cat-a{font-size:13px;font-weight:600}
body.mob .cat-p{font-size:11px;font-weight:600;color:rgba(27,26,24,.35);width:34px;text-align:right}
body.mob .cat-b{margin-top:5px;height:6px;border-radius:999px;background:rgba(27,26,24,.07);overflow:hidden}
body.mob .cat-b>div{height:100%;border-radius:999px}
body.mob .ovc{margin-top:14px;background:var(--card);border-radius:24px;padding:18px 20px 16px;box-shadow:0 1px 2px rgba(0,0,0,.05);width:100%;text-align:left;display:block}
body.mob .ovc:active{background:#faf9f7}
body.mob .spark{margin-top:14px;display:flex;align-items:flex-end;gap:3px;height:46px}
body.mob .spark div{flex:1;border-radius:3px;min-height:2px}
body.mob .sparkx{margin-top:5px;display:flex;gap:3px}
body.mob .sparkx div{flex:1;text-align:center;font-size:8px;font-weight:600;color:var(--m3)}
body.mob .warn{margin-top:12px;padding:11px 13px;border-radius:14px;background:rgba(180,98,47,.09);font-size:12px;line-height:1.45;color:#8a4a22;font-weight:600}
body.mob .ok{margin-top:12px;padding:11px 13px;border-radius:14px;background:rgba(47,122,91,.09);font-size:12px;line-height:1.45;color:#27614a;font-weight:600}
body.mob .yrow{display:flex;align-items:center;gap:10px;padding:11px 4px;border-bottom:1px solid rgba(27,26,24,.06);width:100%;text-align:left}
body.mob .yrow:last-child{border-bottom:0}
body.mob .yrow .nm{width:34px;flex:none;font-size:12px;font-weight:700;color:var(--m6)}
body.mob .yrow .tk{flex:1;min-width:0;height:22px;display:flex;align-items:center}
body.mob .yrow .tk i{display:block;height:7px;border-radius:2px}
body.mob .yrow .nt{width:78px;text-align:right;font-size:12.5px;font-weight:600}
body.mob .yrow .bl{width:82px;text-align:right;font-size:12.5px;font-weight:700}
body.mob .yhd{display:flex;gap:10px;padding:0 4px 6px;font-size:9.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--m3)}
body.mob .yhd .a{width:34px;flex:none}
body.mob .yhd .b{flex:1}
body.mob .yhd .c{width:78px;text-align:right}
body.mob .yhd .d{width:82px;text-align:right}
body.mob .lgh{display:flex;align-items:baseline;justify-content:space-between;gap:10px;padding:11px 16px 7px;background:rgba(27,26,24,.03);border-bottom:1px solid rgba(27,26,24,.06)}
body.mob .lgh .g{font-size:10px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--m5)}
body.mob .lgh .s{font-size:11.5px;font-weight:700}
body.mob .list{margin-top:10px;background:var(--card);border-radius:20px;box-shadow:0 1px 2px rgba(0,0,0,.05);overflow:hidden}
body.mob .li{display:flex;align-items:center;gap:12px;padding:13px 16px;border-bottom:1px solid rgba(27,26,24,.06);width:100%;text-align:left}
body.mob .li:last-child{border-bottom:0}
body.mob .li-d{width:30px;height:30px;flex:none;border-radius:9px;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700}
body.mob .li-n{font-size:14px;font-weight:600;letter-spacing:-.01em}
body.mob .li-s{font-size:11.5px;color:var(--m5);margin-top:1px}
body.mob .li-a{font-size:14px;font-weight:600}
body.mob .empty{padding:26px 4px;text-align:center;font-size:13px;color:var(--m5);line-height:1.5}
body.mob .ghost,.mobscope .ghost{margin-top:16px;padding:15px;border-radius:18px;background:var(--m1);text-align:center;font-size:14px;font-weight:600;color:var(--m6);width:100%}
body.mob .ghost:active,.mobscope .ghost:active{background:var(--m2)}
body.mob .hero-g.three>div{padding:10px 11px}
body.mob .hero-g.three .v{font-size:14.5px}
body.mob .hero-g.three .k{font-size:10.5px}
body.mob .tot{margin-top:10px;display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 14px;border-radius:14px;background:rgba(47,122,91,.09)}
body.mob .tot .a{font-size:12px;font-weight:600;color:#27614a}
body.mob .tot .b{font-size:20px;font-weight:700;letter-spacing:-.02em;color:#27614a}
body.mob .split{display:flex;justify-content:space-between;margin-top:8px;font-size:11.5px;font-weight:600;color:var(--m5)}
body.mob .ffab{position:absolute;right:18px;bottom:calc(84px + var(--safeB));width:56px;height:56px;border-radius:999px;
  background:var(--green);color:#fff;display:flex;align-items:center;justify-content:center;z-index:25;
  box-shadow:0 6px 20px rgba(47,122,91,.38),0 2px 6px rgba(0,0,0,.12);transition:transform .14s}
body.mob .ffab:active{transform:scale(.9)}
body.mob .ffab svg{width:25px;height:25px}
@media(prefers-reduced-motion:reduce){body.mob .ffab{transition:none}}
body.mob .seg,.mobscope .seg{margin-top:10px;display:flex;gap:6px;background:var(--m1);padding:4px;border-radius:14px}
body.mob .seg button,.mobscope .seg button{flex:1;padding:9px;border-radius:11px;font-size:12.5px;font-weight:700;color:var(--m5)}
body.mob .seg button.on,.mobscope .seg button.on{background:var(--card);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.08)}
body.mob .gpick{margin-top:10px;display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
body.mob .gpick button{display:flex;align-items:center;gap:9px;padding:12px 12px;border-radius:14px;background:var(--card);font-size:13px;font-weight:600;box-shadow:0 1px 2px rgba(0,0,0,.05);text-align:left}
body.mob .gpick button.on{background:var(--ink);color:var(--paper)}
body.mob .gpick i{width:10px;height:10px;border-radius:999px;flex:none}
body.mob .li:active{background:#faf9f7}
body.mob .tabs{position:absolute;left:0;right:0;bottom:0;padding:8px 16px calc(14px + var(--safeB));background:rgba(246,245,242,.82);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border-top:1px solid rgba(27,26,24,.07);display:flex;gap:8px;z-index:30}
body.mob .tab{flex:1;padding:11px;border-radius:16px;text-align:center;font-size:12.5px;font-weight:700;color:var(--m5)}
body.mob .tab.on{background:var(--ink);color:var(--paper)}
body.mob .toast{position:absolute;left:50%;transform:translateX(-50%);bottom:calc(84px + var(--safeB));padding:9px 16px;border-radius:999px;background:var(--ink);color:var(--paper);font-size:12.5px;font-weight:600;z-index:60;white-space:nowrap;animation:fadein .2s;pointer-events:none}
body.mob .scrim{position:absolute;inset:0;z-index:40;display:flex;flex-direction:column;justify-content:flex-end;background:rgba(27,26,24,.28);backdrop-filter:blur(2px);-webkit-backdrop-filter:blur(2px)}
body.mob .sheet{background:var(--paper);border-radius:28px 28px 0 0;padding:10px 20px calc(28px + var(--safeB));animation:sheetup .3s cubic-bezier(.2,.8,.2,1);box-shadow:0 -8px 30px rgba(0,0,0,.14);max-height:92%;overflow-y:auto}
body.mob .grab,.mobscope .grab{width:38px;height:5px;border-radius:999px;background:rgba(27,26,24,.18);margin:0 auto 14px}
body.mob .sh-h,.mobscope .sh-h{display:flex;align-items:baseline;justify-content:space-between;gap:10px}
body.mob .field,.mobscope .field{margin-top:14px;background:var(--card);border-radius:18px;padding:2px 16px;box-shadow:0 1px 2px rgba(0,0,0,.05)}
body.mob .inp,.mobscope .inp{width:100%;border:0;background:transparent;padding:14px 0;font-size:17px;font-weight:600;letter-spacing:-.01em;color:var(--ink);outline:none}
body.mob .pick{margin-top:14px;display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
body.mob .pick button{padding:14px 4px;border-radius:14px;background:var(--card);font-size:14px;font-weight:600;box-shadow:0 1px 2px rgba(0,0,0,.05)}
body.mob .pick button.on{background:var(--ink);color:var(--paper)}
body.mob .pick button.now{box-shadow:inset 0 0 0 1.5px var(--green)}
body.mob .save,.mobscope .save{margin-top:22px;padding:16px;border-radius:18px;text-align:center;font-size:15px;font-weight:700;color:var(--ink);width:100%;background:var(--m1)}
body.mob .del,.mobscope .del{margin-top:9px;padding:13px;border-radius:16px;text-align:center;font-size:13px;font-weight:600;color:var(--rust);width:100%;background:rgba(180,98,47,.09)}
body.mob .note,.mobscope .note{margin-top:9px;text-align:center;font-size:11.5px;color:var(--m4);font-weight:500;line-height:1.45}
</style>

<script>
"use strict";
(function(){

/* ════════════════════════════════════════════════════════════
   0 · ESKİ SERVICE WORKER TEMİZLİĞİ
   ════════════════════════════════════════════════════════════ */
if('serviceWorker' in navigator){
  navigator.serviceWorker.getRegistrations().then(function(regs){
    if(!regs.length) return;
    var jobs=regs.map(function(r){return r.unregister();});
    if(window.caches&&caches.keys){
      jobs.push(caches.keys().then(function(ks){
        return Promise.all(ks.map(function(k){return caches.delete(k);}));
      }));
    }
    Promise.all(jobs).then(function(){
      if(!sessionStorage.getItem('swTemiz')){
        sessionStorage.setItem('swTemiz','1');
        location.reload();
      }
    });
  }).catch(function(){});
}

/* ════════════════════════════════════════════════════════════
   1 · SABİTLER & YARDIMCILAR
   ════════════════════════════════════════════════════════════ */
var MONTHS=['Oca','Şub','Mar','Nis','May','Haz','Tem','Ağu','Eyl','Eki','Kas','Ara'];
var MONTHS_L=['Ocak','Şubat','Mart','Nisan','Mayıs','Haziran','Temmuz','Ağustos','Eylül','Ekim','Kasım','Aralık'];
var YEARS=[2026,2027];
var CUR='€';
var INK='#1b1a18', GREEN='#2f7a5b', RUST='#b4622f';
var C_HISSE='#2E9BC4', C_ALTIN='#E09A18';   /* mobil paletinden */
var root=document.getElementById('root');
var nowD=new Date();

function sp(map){ var a=new Array(12).fill(0); for(var k in map){a[+k]=map[k];} return a; }
function num(raw){
  if(raw===''||raw==null) return 0;
  var n=parseFloat(String(raw).replace(/\s/g,'').replace(',','.').replace(/[^0-9.\-]/g,''));
  return isNaN(n)?0:n;
}
function esc(s){ return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function fmt(n){ return (n<0?'-':'')+CUR+Math.round(Math.abs(n)).toLocaleString('tr-TR'); }
function fmtPlain(n){ return Math.round(n).toLocaleString('tr-TR'); }
function fmtM(n){ return (n<0?'-':'')+Math.round(Math.abs(n)).toLocaleString('tr-TR')+' '+CUR; }
function signedM(n){ return (n>0?'+':'')+fmtM(n); }
function uid(p){ return (p||'')+Math.random().toString(36).slice(2,8)+Date.now().toString(36).slice(-3); }
function rgba(hex,a){ var h=hex.replace('#',''); var r=parseInt(h.slice(0,2),16),g=parseInt(h.slice(2,4),16),b=parseInt(h.slice(4,6),16); return 'rgba('+r+','+g+','+b+','+a+')'; }
function yearSum(arr){ var s=0; for(var i=0;i<arr.length;i++){ s+=(+arr[i]||0); } return s; }
function h(html){ var t=document.createElement('template'); t.innerHTML=String(html).trim(); return t.content; }

    opening:3477,

        I('Retention Bonus',new Array(12).fill(0)),

      ]),
      G('Yatırım Satışları','revenue','#0d9488',[
        I('Altın Satışı',new Array(12).fill(0),'altin'),

      ]),
      G('Ev','cost','#3b82f6',[
        I('Türk Marketi',new Array(12).fill(150)),
        I('Alman Marketi',[100,100,200,200,200,200,200,200,200,200,200,200])
      ]),
      G('Günlük','cost','#ef5a1e',[
        I('Günlük Harcama',[850,800,740,933,1000,800,900,1000,800,800,800,800])
      ]),
      G('Krediler','cost','#8b5cf6',[
        I('DB Kredi · Ziya',new Array(12).fill(95)),
        I('DB Kredi · Emre',new Array(12).fill(115))

function emptyData(){
  var s=seedData();
  return { opening:0, groups:s.groups.map(function(g){
    return {id:g.id,name:g.name,type:g.type,color:g.color,items:g.items.map(function(it){
      return {id:it.id,name:it.name,invest:it.invest,values:new Array(12).fill(0)};
    })};
  })};
}
function ensureGroups(groups){
  var result=(groups||[]).map(function(g){
    return {id:g.id||uid('g'),name:g.name,type:g.type||'cost',color:g.color||'#8a7f6f',
      items:(g.items||[]).map(function(it){
        return {id:it.id||uid('i'),name:it.name,invest:it.invest,
          values:(function(v){ v=(v||[]).slice(0,12); while(v.length<12) v.push(0); return v.map(function(x){return +x||0;}); })(it.values)};
      })};
  });
  var names={}; result.forEach(function(g){ names[g.name]=true; });
  if(!names['Yatırım Satışları']){
    var sell={id:uid('g'),name:'Yatırım Satışları',type:'revenue',color:'#0d9488',
      items:[{id:uid('i'),name:'Altın Satışı',values:new Array(12).fill(0),invest:'altin'},
             {id:uid('i'),name:'Hisse Satışı',values:new Array(12).fill(0),invest:'hisse'}]};
    var firstCost=-1;
    for(var i=0;i<result.length;i++){ if(result[i].type!=='revenue'){ firstCost=i; break; } }
    if(firstCost===-1) result.push(sell); else result.splice(firstCost,0,sell);
  }
  if(!names['Realize K/Z']){
    result.push({id:uid('g'),name:'Realize K/Z',type:'realize',color:'#dc2626',
      items:[{id:uid('i'),name:'Altın K/Z',values:new Array(12).fill(0),invest:'altin'},
             {id:uid('i'),name:'Hisse K/Z',values:new Array(12).fill(0),invest:'hisse'}]});
  }
  result.forEach(function(g){
    g.items.forEach(function(it){
      if(it.invest) return;
      if(it.name==='Altın'||it.name==='Altın Satışı'||it.name==='Altın K/Z') it.invest='altin';
      else if(it.name==='Hisse'||it.name==='Hisse Satışı'||it.name==='Hisse K/Z') it.invest='hisse';
    });
  });
  return result;
}

/* ════════════════════════════════════════════════════════════
   3 · DEPO  (tek kaynak — web ve mobil aynı veriyi okur)
   ════════════════════════════════════════════════════════════ */
var SKEY='pnl_store_v3';
var STORE={updatedAt:0,years:{},goal:12000,alert:0};

function migrateYear(y){
  var def=(y===2026)?seedData():emptyData();
  var legacy=null;
  try{
    var r=localStorage.getItem('pnl_'+y+'_v2')||localStorage.getItem('pnl_'+y+'_v1');
    if(r) legacy=JSON.parse(r);
  }catch(e){}
  if(legacy) return {opening:(legacy.opening!=null?legacy.opening:def.opening),groups:ensureGroups(legacy.groups||def.groups)};
  return {opening:def.opening,groups:ensureGroups(def.groups)};
}
function loadStore(){
  try{
    var raw=localStorage.getItem(SKEY);
    if(raw){
      var p=JSON.parse(raw);
      if(p&&p.years){
        STORE.updatedAt=p.updatedAt||0;
        STORE.years=p.years;
        if(typeof p.goal==='number') STORE.goal=p.goal;
        if(typeof p.alert==='number') STORE.alert=p.alert;
      }
    }
  }catch(e){}
  YEARS.forEach(function(y){
    if(!STORE.years[y]) STORE.years[y]=migrateYear(y);
    else STORE.years[y]={opening:+STORE.years[y].opening||0,groups:ensureGroups(STORE.years[y].groups)};
  });
}
function persist(){
  try{ localStorage.setItem(SKEY,JSON.stringify(STORE)); }
  catch(e){
    if(view.mode==='web') alert('Kaydedilemedi — tarayıcı depolaması dolu olabilir.');
    else toast('Kaydedilemedi — depolama dolu olabilir');
  }
}
/* her veri değişikliğinde çağrılır: damgala, sakla, buluta gönder */
function touched(){
  STORE.updatedAt=Date.now();
  persist();
  schedulePush();
}

/* ════════════════════════════════════════════════════════════
   4 · GITHUB GIST SENKRONU
   ════════════════════════════════════════════════════════════ */
var SY={
  token:localStorage.getItem('pnl_gh_token')||'',
  gist:localStorage.getItem('pnl_gist_id')||'',
  state:'off',      // off | ok | busy | err
  msg:'Senkron kapalı',
  at:0
};
var FILE='pnl-data.json';
function syncOn(){ return !!SY.token; }
function setSync(st,msg){
  SY.state=st; SY.msg=msg||'';
  if(st==='ok'){ SY.at=Date.now(); }
  paintSync();
}
function syncColor(){
  return SY.state==='ok'?GREEN:(SY.state==='busy'?'#E09A18':(SY.state==='err'?RUST:'rgba(27,26,24,.25)'));
}
function ghFetch(url,opts){
  opts=opts||{};
  opts.headers=Object.assign({
    'Authorization':'Bearer '+SY.token,
    'Accept':'application/vnd.github+json',
    'X-GitHub-Api-Version':'2022-11-28'
  },opts.headers||{});
  return fetch(url,opts).then(function(r){
    if(!r.ok) return r.text().then(function(t){ throw new Error('GitHub '+r.status+': '+t.slice(0,120)); });
    return r.json();
  });
}
function payload(){
  return JSON.stringify({updatedAt:STORE.updatedAt,years:STORE.years,goal:STORE.goal,alert:STORE.alert},null,2);
}
function adopt(remote){
  STORE.updatedAt=remote.updatedAt||0;
  STORE.years=remote.years||{};
  if(typeof remote.goal==='number') STORE.goal=remote.goal;
  if(typeof remote.alert==='number') STORE.alert=remote.alert;
  YEARS.forEach(function(y){
    if(!STORE.years[y]) STORE.years[y]=migrateYear(y);
    else STORE.years[y]={opening:+STORE.years[y].opening||0,groups:ensureGroups(STORE.years[y].groups)};
  });
  persist();
  bindYear(view.year);
}
/* Önce hesaptaki mevcut PNL kutusunu ara, yoksa yeni oluştur */
function findGist(){
  return ghFetch('https://api.github.com/gists?per_page=100').then(function(list){
    for(var i=0;i<list.length;i++){
      if(list[i].files && list[i].files[FILE]) return list[i].id;
    }
    return null;
  }).catch(function(){ return null; });
}
function ensureGist(){
  if(SY.gist) return Promise.resolve(SY.gist);
  return findGist().then(function(id){
    if(id){ SY.gist=id; localStorage.setItem('pnl_gist_id',id); return id; }
    return createGist().then(function(g){ return g.id; });
  });
}
function createGist(){
  var files={}; files[FILE]={content:payload()};
  return ghFetch('https://api.github.com/gists',{
    method:'POST',
    headers:{'Content-Type':'application/json'},
    body:JSON.stringify({description:'PNL verisi — kişisel gelir/gider',public:false,files:files})
  }).then(function(g){
    SY.gist=g.id;
    localStorage.setItem('pnl_gist_id',g.id);
    return g;
  });
}
function pull(){
  if(!syncOn()) return Promise.resolve();
  setSync('busy','Okunuyor…');
  return ensureGist().then(function(){
  return ghFetch('https://api.github.com/gists/'+SY.gist).then(function(g){
    var f=g.files&&g.files[FILE];
    if(!f) throw new Error(FILE+' bulunamadı');
    var txt=f.truncated&&f.raw_url ? null : f.content;
    var next=txt!=null?Promise.resolve(txt):fetch(f.raw_url).then(function(r){return r.text();});
    return next.then(function(t){
      var remote=JSON.parse(t);
      var rAt=remote.updatedAt||0;
      if(rAt>STORE.updatedAt){ adopt(remote); setSync('ok','Telefondan/bilgisayardan güncellendi'); render(); }
      else if(STORE.updatedAt>rAt){ setSync('ok','Yerel daha yeni'); return push(); }
      else setSync('ok','Güncel');
    });
  });
  }).catch(function(e){ setSync('err',e.message||'Okunamadı'); });
}
function push(){
  if(!syncOn()) return Promise.resolve();
  setSync('busy','Kaydediliyor…');
  var files={}; files[FILE]={content:payload()};
  return ensureGist().then(function(){
  return ghFetch('https://api.github.com/gists/'+SY.gist,{
    method:'PATCH',
    headers:{'Content-Type':'application/json'},
    body:JSON.stringify({files:files})
  });
  }).then(function(){ setSync('ok','Kaydedildi'); })
    .catch(function(e){ setSync('err',e.message||'Kaydedilemedi'); });
}
var pushT=null;
function schedulePush(){
  if(!syncOn()) return;
  clearTimeout(pushT);
  setSync('busy','Bekliyor…');
  pushT=setTimeout(push,1500);
}
function paintSync(){
  var dot=document.getElementById('syncDot');
  if(dot) dot.style.background=syncColor();
  var lbls=document.querySelectorAll('#syncLbl');
  for(var i=0;i<lbls.length;i++){
    lbls[i].textContent=syncLabel();
    lbls[i].style.color=(SY.state==='err'?RUST:'');
  }
}
function syncLabel(){
  if(!syncOn()) return 'Senkron kapalı · sadece bu cihaz';
  return SY.msg||'—';
}
/* sekmeye dönünce tazele */
document.addEventListener('visibilitychange',function(){
  if(document.visibilityState==='visible') pull();
});
window.addEventListener('online',function(){ pull(); });

var view={
  year:2026,
  month:(nowD.getFullYear()===2026?nowD.getMonth():0),
  tab:'ay',            // mobil: ay | yil
  mode:null            // web | mob
};
var state={year:2026,groups:[],opening:0};
function bindYear(y){
  view.year=y; state.year=y;
  var Y=STORE.years[y]||migrateYear(y);
  STORE.years[y]=Y;
  state.groups=Y.groups;
  state.opening=Y.opening;
}
function curMonth(){ return (state.year===nowD.getFullYear())?nowD.getMonth():-1; }
function ytdLimit(){ var c=curMonth(); return c>=0?c:11; }
function ytd(arr){ var l=ytdLimit(),s=0; for(var i=0;i<=l;i++){ s+=arr[i]; } return s; }

/* ════════════════════════════════════════════════════════════
   6 · HESAPLAMA
   ════════════════════════════════════════════════════════════ */
function compute(){
  var groups=state.groups, sub={};
  groups.forEach(function(g){
    var a=new Array(12).fill(0);
    g.items.forEach(function(it){ it.values.forEach(function(v,m){ a[m]+=(+v||0); }); });
    sub[g.id]=a;
  });
  var revenue=new Array(12).fill(0),cost=new Array(12).fill(0),realize=new Array(12).fill(0);
  groups.forEach(function(g){
    var tgt=g.type==='revenue'?revenue:(g.type==='realize'?realize:cost);
    sub[g.id].forEach(function(v,m){ tgt[m]+=v; });
  });
  var saving=revenue.map(function(r,m){ return r-cost[m]; });
  var balance=[],run=state.opening;
  saving.forEach(function(s,m){ run+=s; balance[m]=run; });
  return {sub:sub,revenue:revenue,cost:cost,realize:realize,saving:saving,balance:balance};
}
/* yatırımda kalan (net): alım + realize ekler, satış düşer */
function investSplit(upto){
  var hisse=0,altin=0;
  function s(arr){ if(upto==null) return yearSum(arr); var t=0; for(var i=0;i<=upto;i++) t+=arr[i]; return t; }
  state.groups.forEach(function(g){
    var sign=g.type==='revenue'?-1:1;
    g.items.forEach(function(it){
      if(it.invest==='hisse') hisse+=sign*s(it.values);
      if(it.invest==='altin') altin+=sign*s(it.values);
    });
  });
  if(hisse<0) hisse=0; if(altin<0) altin=0;
  return {hisse:hisse,altin:altin,sum:hisse+altin};
}

function find(gid){ for(var i=0;i<state.groups.length;i++){ if(state.groups[i].id===gid) return state.groups[i]; } return null; }
function findItem(g,iid){ for(var i=0;i<g.items.length;i++){ if(g.items[i].id===iid) return g.items[i]; } return null; }
function setCell(gid,iid,m,raw){
  var g=find(gid),it=g&&findItem(g,iid); if(!it) return;
  it.values[m]=num(raw); touched(); refreshSummary();
}
function setName(gid,iid,name){
  var g=find(gid),it=g&&findItem(g,iid); if(!it) return;
  it.name=name; touched();
}
function addItem(gid){
  var g=find(gid); if(!g) return;
  g.items.push({id:uid('i'),name:'Yeni kalem',values:new Array(12).fill(0)});
  touched(); render();
}
function delItem(gid,iid){
  var g=find(gid); if(!g) return;
  g.items=g.items.filter(function(it){ return it.id!==iid; });
  touched(); render();
}
function setOpening(raw){
  state.opening=num(raw);
  STORE.years[state.year].opening=state.opening;
  touched(); refreshSummary();
}
function setYear(y){ bindYear(y); render(); }

/* ---------- yedek ---------- */
function exportBackup(){
  var blob=new Blob([payload()],{type:'application/json'});
  var url=URL.createObjectURL(blob);
  var a=document.createElement('a'); a.href=url; a.download='pnl-yedek.json';
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(function(){ URL.revokeObjectURL(url); },1000);
}
function importBackup(file,done){
  var reader=new FileReader();
  reader.onload=function(){
    try{
      var d=JSON.parse(reader.result);
      if(d.years) adopt(d);
      else if(Array.isArray(d.groups)){   // eski tek-yıl yedeği
        var y=d.year||state.year;
        STORE.years[y]={opening:(typeof d.opening==='number'?d.opening:0),groups:ensureGroups(d.groups)};
        bindYear(y);
      } else throw new Error('bilinmeyen biçim');
      touched(); render(); if(done) done(true);
    }catch(err){ if(done) done(false); else alert('Yedek dosyası okunamadı.'); }
  };
  reader.readAsText(file);
}

      '<polyline points="'+line+'" fill="none" stroke="#16a85a" stroke-width="2.5" stroke-linejoin="round"></polyline>'+
      dots+xlabels+

  var inv=investSplit(ytdLimit());

  var C=2*Math.PI*60;
  var hFrac=invSum>0?hisse/invSum:0,aFrac=invSum>0?altin/invSum:0;
  var donutHisse=(hFrac*C).toFixed(2)+' '+C.toFixed(2);

    '</div>'+

        '<text x="80" y="94" font-size="16" fill="#3a342c" text-anchor="middle" font-family="Fraunces" font-weight="600">'+fmt(invSum)+'</text>'+
      '</svg>'+
      '<div style="flex:1;display:flex;flex-direction:column;gap:12px">'+
        '<div><div style="display:flex;align-items:center;gap:7px"><span style="width:11px;height:11px;border-radius:3px;background:#3b82f6;flex:none"></span><span style="font-weight:700;font-size:14px">Hisse</span></div>'+

function numCellBase(extra){ return 'display:flex;align-items:center;justify-content:flex-end;padding:4px 8px;border-bottom:1px solid #f0e8d8;min-width:0;'+(extra||''); }
function totCellBase(extra){ return 'display:flex;align-items:center;justify-content:flex-end;padding:4px 12px;min-width:0;'+(extra||''); }
function labelBase(extra){ return 'position:sticky;left:0;z-index:1;display:flex;align-items:center;padding:4px 12px;border-bottom:1px solid #f0e8d8;min-width:0;'+(extra||''); }

function buildTableOrdered(){
  var c=compute(),cm=curMonth();
  var totRev=ytd(c.revenue),totCost=ytd(c.cost),netSav=totRev-totCost;
  var sideHL='inset 1px 0 0 #e3a23f, inset -1px 0 0 #e3a23f';
  var topHL='inset 0 2px 0 #e3a23f, inset 1px 0 0 #e3a23f, inset -1px 0 0 #e3a23f';
  var botHL='inset 0 -2px 0 #e3a23f, inset 1px 0 0 #e3a23f, inset -1px 0 0 #e3a23f';

  var head='<div style="display:grid;grid-template-columns:'+GRID+';background:#f3ecdd">'+
    '<div style="position:sticky;left:0;z-index:3;background:#f3ecdd;display:flex;align-items:center;padding:9px 12px;font-size:11px;letter-spacing:.5px;text-transform:uppercase;color:#a8987c;font-weight:700;min-width:172px;border-bottom:1px solid #e4d9c2">Kalem</div>'+
    MONTHS.map(function(t,m){
      if(m===cm) return '<div style="display:flex;align-items:center;justify-content:flex-end;padding:9px 8px;font-size:11px;font-weight:700;color:#b5552e;background:rgba(227,162,63,.18);border-bottom:1px solid #e4d9c2;box-shadow:'+topHL+'">'+t+'</div>';
      return '<div style="display:flex;align-items:center;justify-content:flex-end;padding:9px 8px;font-size:11px;font-weight:700;color:#a8987c;border-bottom:1px solid #e4d9c2">'+t+'</div>';
    }).join('')+
    '<div style="display:flex;align-items:center;justify-content:flex-end;padding:9px 12px;font-size:11px;letter-spacing:.5px;text-transform:uppercase;color:#7a6e58;font-weight:700;background:#efe7d6;border-bottom:1px solid #e4d9c2">Yıl</div>'+
  '</div>';

  function groupBlock(g){
    var isRealize=(g.type==='realize');
    var tint=rgba(g.color,0.1);
    var gB='1px solid '+rgba(g.color,0.25);
    var html='';
    html+='<div style="display:grid;grid-template-columns:'+GRID+';background:'+tint+'">'+
      '<div style="'+labelBase('background:'+tint+';color:'+g.color+';border-left:3px solid '+g.color+';border-bottom:'+gB)+'">'+
        '<span style="display:inline-flex;align-items:center;justify-content:space-between;width:100%">'+
          '<span style="font-family:\'Fraunces\';font-size:13.5px;font-weight:600;letter-spacing:.3px">'+esc(g.name)+'</span>'+
          '<button data-act="add" data-g="'+g.id+'" style="background:none;border:1px solid currentColor;color:inherit;opacity:.6;border-radius:6px;font-size:11px;font-weight:700;padding:1px 6px;cursor:pointer;flex:none">+ satır</button>'+
        '</span>'+
      '</div>'+
      MONTHS.map(function(_,m){ return '<div style="'+numCellBase('background:'+tint+';border-bottom:'+gB+';'+(m===cm?'box-shadow:'+sideHL+';':''))+'"></div>'; }).join('')+
      '<div style="'+totCellBase('background:'+tint+';border-bottom:'+gB)+'"></div>'+
    '</div>';
    g.items.forEach(function(it){
      var cells=it.values.map(function(v,m){
        var hl=(m===cm);
        return '<div style="'+numCellBase((hl?'background:rgba(227,162,63,.08);box-shadow:'+sideHL+';':''))+'">'+
          '<input class="pnl-cell" data-act="cell" data-g="'+g.id+'" data-i="'+it.id+'" data-m="'+m+'" value="'+(v===0?'':String(v))+'" inputmode="text" placeholder="0" '+
            'style="width:100%;border:none;background:transparent;text-align:right;font-size:12px;color:'+(isRealize&&v<0?'#dc2626':'#3a342c')+';padding:3px 2px;outline:none">'+
        '</div>';
      }).join('');
      var ytotal=yearSum(it.values);
      html+='<div style="display:grid;grid-template-columns:'+GRID+';background:#fbf8f2">'+
        '<div style="'+labelBase('background:#fbf8f2')+'">'+
          '<span style="display:inline-flex;align-items:center;gap:6px;width:100%">'+
            '<input data-act="name" data-g="'+g.id+'" data-i="'+it.id+'" value="'+esc(it.name)+'" style="flex:1;min-width:0;border:none;background:transparent;font-size:12.5px;color:#3a342c;font-weight:500;outline:none;padding:2px 0">'+
            '<button data-act="del" data-g="'+g.id+'" data-i="'+it.id+'" style="background:none;border:none;color:#cdbb9c;font-size:13px;cursor:pointer;flex:none;line-height:1">×</button>'+
          '</span>'+
        '</div>'+cells+
        '<div data-itemtotal="'+g.id+':'+it.id+'" style="'+totCellBase('border-bottom:1px solid #f0e8d8;color:'+(isRealize&&ytotal<0?'#dc2626':'#8a7f6f')+';font-weight:600')+'">'+fmtPlain(ytotal)+'</div>'+
      '</div>';
    });
    var st=c.sub[g.id],stYear=yearSum(st);
    var subLabel=g.type==='revenue'?('Toplam '+g.name):(isRealize?'Net Realize K/Z':('Toplam '+g.name));
    var subColor=isRealize?(stYear<0?'#dc2626':(stYear>0?'#16a85a':g.color)):g.color;
    html+='<div style="display:grid;grid-template-columns:'+GRID+';background:#f3ecdd">'+
      '<div style="'+labelBase('background:#f3ecdd;color:'+subColor+';font-weight:700;border-bottom:1px solid #e4d9c2')+'">'+subLabel+'</div>'+
      st.map(function(v,m){
        var col=isRealize?(v<0?'#dc2626':(v>0?'#16a85a':'#5a5142')):'#5a5142';
        return '<div data-subcell="'+g.id+':'+m+'" style="'+numCellBase('background:#f3ecdd;border-bottom:1px solid #e4d9c2;font-weight:700;color:'+col+';'+(m===cm?'box-shadow:'+sideHL+';':''))+'">'+(v?fmtPlain(v):'')+'</div>';
      }).join('')+
      '<div data-subtotal="'+g.id+'" style="'+totCellBase('background:#f3ecdd;border-bottom:1px solid #e4d9c2;font-weight:700;color:'+subColor+';font-family:Fraunces')+'">'+fmt(stYear)+'</div>'+
    '</div>';
    return html;
  }
  function savingRow(){
    return '<div style="display:grid;grid-template-columns:'+GRID+';background:#efe7d6">'+
      '<div style="'+labelBase('background:#efe7d6;font-weight:700;font-family:Fraunces;font-size:13px;border-top:2px solid #ddceb2')+'">Tasarruf</div>'+
      c.saving.map(function(v,m){ return '<div data-savcell="'+m+'" style="'+numCellBase('background:#efe7d6;border-top:2px solid #ddceb2;font-weight:700;color:'+(v<0?'#ef4444':'#16a85a')+';'+(m===cm?'box-shadow:'+sideHL+';':''))+'">'+fmtPlain(v)+'</div>'; }).join('')+
      '<div data-savtotal="1" style="'+totCellBase('background:#efe7d6;border-top:2px solid #ddceb2;font-weight:700;font-family:Fraunces;color:'+(netSav<0?'#ef4444':'#16a85a'))+'">'+fmt(netSav)+'</div>'+
    '</div>';
  }
  function balanceRow(){
    return '<div style="display:grid;grid-template-columns:'+GRID+';background:#3a342c">'+
      '<div style="'+labelBase('background:#3a342c;color:#f3ecdf;font-weight:700;font-family:Fraunces;font-size:13px;border-bottom:none')+'">Bakiye</div>'+
      c.balance.map(function(v,m){ return '<div data-balcell="'+m+'" style="'+numCellBase('background:#3a342c;border-bottom:none;font-weight:700;color:'+(v<0?'#ff9b8e':'#e3c98a')+';'+(m===cm?'box-shadow:'+botHL+';':''))+'">'+fmtPlain(v)+'</div>'; }).join('')+
      '<div data-baltotal="1" style="'+totCellBase('background:#3a342c;color:#e3a23f;font-weight:700;font-family:Fraunces')+'">'+fmt(c.balance[11])+'</div>'+
    '</div>';
  }
  function realizeDivider(){
    return '<div style="grid-column:1 / -1;padding:16px 14px 8px;background:#fbf8f2;border-top:1px dashed #d9ccb5">'+
      '<div style="font-family:\'Fraunces\';font-size:13px;font-weight:600;color:#a8957a;letter-spacing:.4px;text-transform:uppercase">Yatırım Satışı &amp; Realize K/Z</div>'+
      '<div style="font-size:12px;color:#a8987c;margin-top:2px;max-width:840px;line-height:1.5">Bir satışta iki yere giriş yap: <b>“Yatırım Satışları”</b>na eline geçen nakti yaz, <b>“Realize K/Z”</b>ye kâr/zararı (<b>zarar = eksi</b>, örn. −270; kâr = artı). İkisi birlikte yukarıdaki <b>“Yatırımda Kalan”</b> grafiğinden düşülür — pozisyonu tamamen kapattıysan o varlık <b>0’a iner</b>. Bakiyene eline geçen nakit girer; zarar zaten alış–satış farkından otomatik düşülür. <b>Örnek:</b> 2070’lik altının tamamını 1800’e sattın, 270 zarar → “Altın Satışı” = 1800, “Altın K/Z” = −270 ⇒ grafikte altın <b>0</b> olur, bakiyene 1800 girer (net −270).</div>'+
    '</div>';
  }

  var body='';
  state.groups.forEach(function(g){ if(g.type!=='realize') body+=groupBlock(g); });
  body+=savingRow();
  body+=balanceRow();
  var hasRealize=state.groups.some(function(g){ return g.type==='realize'; });
  if(hasRealize){ body+=realizeDivider(); state.groups.forEach(function(g){ if(g.type==='realize') body+=groupBlock(g); }); }
  return head+body;
}

function refreshSummary(){
  if(view.mode!=='web') return;
  var tz=document.getElementById('topzone');
  if(tz) tz.innerHTML=buildTop();
  var c=compute();
  var netSav=ytd(c.revenue)-ytd(c.cost);
  state.groups.forEach(function(g){
    g.items.forEach(function(it){
      var el=document.querySelector('[data-itemtotal="'+g.id+':'+it.id+'"]');
      if(el){ var yt=yearSum(it.values); el.textContent=fmtPlain(yt); el.style.color=(g.type==='realize'&&yt<0)?'#dc2626':'#8a7f6f'; }
    });
    var st=c.sub[g.id];
    st.forEach(function(v,m){
      var el=document.querySelector('[data-subcell="'+g.id+':'+m+'"]');
      if(el){ el.textContent=v?fmtPlain(v):''; if(g.type==='realize') el.style.color=(v<0?'#dc2626':(v>0?'#16a85a':'#5a5142')); }
    });
    var tEl=document.querySelector('[data-subtotal="'+g.id+'"]');
    if(tEl){ var sy=yearSum(st); tEl.textContent=fmt(sy); if(g.type==='realize') tEl.style.color=(sy<0?'#dc2626':(sy>0?'#16a85a':g.color)); }
  });
  c.saving.forEach(function(v,m){ var el=document.querySelector('[data-savcell="'+m+'"]'); if(el){ el.textContent=fmtPlain(v); el.style.color=(v<0?'#ef4444':'#16a85a'); } });
  var savT=document.querySelector('[data-savtotal]'); if(savT){ savT.textContent=fmt(netSav); savT.style.color=(netSav<0?'#ef4444':'#16a85a'); }
  c.balance.forEach(function(v,m){ var el=document.querySelector('[data-balcell="'+m+'"]'); if(el){ el.textContent=fmtPlain(v); el.style.color=(v<0?'#ff9b8e':'#e3c98a'); } });
  var balT=document.querySelector('[data-baltotal]'); if(balT){ balT.textContent=fmt(c.balance[11]); }
  paintSync();
}

var SVG={
  plus:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>',
  left:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg>',
  right:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5l7 7-7 7"/></svg>'
};
/* her kategoriye kendi pastel rengi */
var PASTEL={
  'Gelir':'#7FA98C','Yatırım Satışları':'#8FB2A6','Ev':'#8FAFCB','Günlük':'#E2A57E',
  'Krediler':'#A79CC9','Sabit':'#86BDBD','Değişken':'#D6A0B6','Realize K/Z':'#C98F82'
};
var PASTEL_POOL=['#8FAFCB','#E2A57E','#A79CC9','#86BDBD','#D6A0B6','#B5B078','#C98F82','#96B8A4','#CBA98F','#9BAECF'];
function gcolor(g){
  if(PASTEL[g.name]) return PASTEL[g.name];
  var i=state.groups.indexOf(g); if(i<0) i=0;
  return PASTEL_POOL[i%PASTEL_POOL.length];
}
function initialOf(name){
  var t=String(name||'').trim();
  if(!t) return '·';
  return t.charAt(0).toLocaleUpperCase('tr');
}
/* o ay hisseye giden nakit (alım − satış) */
function stockFlow(m){
  var v=0;
  state.groups.forEach(function(g){
    if(g.type==='realize') return;
    var sign=g.type==='revenue'?-1:1;
    g.items.forEach(function(it){ if(it.invest==='hisse') v+=sign*(+it.values[m]||0); });
  });
  return v;
}
function clampPct(x){ return Math.max(0,Math.min(100,Math.round(x))); }

/* ---------- MOBİL · AY ---------- */
function mobMonth(){
  var c=compute(), m=view.month, y=view.year;
  var scroll=document.getElementById('mScroll');
  scroll.innerHTML='';
  var f=document.createDocumentFragment();

  setMTitle(MONTHS_L[m],openMonthPick);
  setMNav(function(d){
    var nm=m+d;
    if(nm<0){ nm=11; if(YEARS.indexOf(y-1)>=0) bindYear(y-1); else nm=0; }
    else if(nm>11){ nm=0; if(YEARS.indexOf(y+1)>=0) bindYear(y+1); else nm=11; }
    view.month=nm; renderMob();
  });

  var netM=c.saving[m], yearNet=yearSum(c.saving), stockM=stockFlow(m);

  /* hero — nakit net + bu ay hisseye ayrılan */
  f.appendChild(h('<div class="hero">'+
    '<div class="hero-r"><div class="hero-l">'+MONTHS_L[m]+' · nakit</div><div class="hero-l">'+y+' neti</div></div>'+
    '<div class="hero-b">'+
      '<div class="hero-big tnum">'+signedM(netM)+'</div>'+
      '<div class="hero-sm tnum" style="color:'+(yearNet>=0?'#7fd1a6':'#e5a08e')+'">'+signedM(yearNet)+'</div>'+
    '</div>'+
    '<div class="hero-g three">'+
      '<div><div class="k">Gelir</div><div class="v tnum">'+fmtM(c.revenue[m])+'</div></div>'+
      '<div><div class="k">Gider</div><div class="v tnum">'+fmtM(c.cost[m])+'</div></div>'+
      '<div><div class="k">Hisseye</div><div class="v tnum" style="color:'+(stockM>0?'#8fd2e8':'rgba(246,245,242,.75)')+'">'+(stockM>0?'+':'')+fmtM(stockM)+'</div></div>'+
    '</div>'+
  '</div>'));

  /* yıl genel bakışı */
  var mx=Math.max(1,Math.max.apply(null,c.saving.map(function(v){return Math.abs(v);})));
  var bars=c.saving.map(function(v,i){
    var hgt=Math.round(Math.abs(v)/mx*38);
    var low=c.balance[i]<(STORE.alert||0);

    return '<div style="height:'+Math.max(2,hgt)+'px;background:'+col+'"></div>';
  }).join('');
  var lows=[];
  c.balance.forEach(function(v,i){ if(v<(STORE.alert||0)) lows.push({m:i,bal:v}); });
  var lowest=c.balance.reduce(function(a,v,i){ return v<a.bal?{m:i,bal:v}:a; },{m:0,bal:c.balance[0]});

    '</div>'+
    '<div class="rowsm" style="margin-top:4px">'+
      '<div>Yıl sonu nakit</div><div class="tnum" style="color:'+(c.balance[11]>=0?GREEN:RUST)+';font-weight:700">'+fmtM(c.balance[11])+'</div>'+
    '</div>'+
    '<div class="spark">'+bars+'</div>'+
    '<div class="sparkx">'+MONTHS.map(function(n,i){ return '<div style="color:'+(i===m?INK:'')+'">'+n[0]+'</div>'; }).join('')+'</div>'+
    (lows.length
      ? '<div class="warn">'+MONTHS_L[lows[0].m]+' ayında nakit '+fmtM(lows[0].bal)+'\u2019ya düşüyor. Önceki aylardan biriktirmen gereken tutar: '+fmtM(Math.abs(lowest.bal-(STORE.alert||0)))+'.</div>'
      : '<div class="ok">Yıl boyunca nakit hiç '+fmtM(STORE.alert||0)+' altına düşmüyor.</div>')+
  '</button>');
  ovc.querySelector('button').onclick=function(){ view.tab='yil'; renderMob(); };
  f.appendChild(ovc);

  /* ── TOPLAM VARLIK: nakit + hisse ── */
  var cashM=c.balance[m],  stkM=investSplit(m).hisse,  totM=cashM+stkM;
  var cashY=c.balance[11], stkY=investSplit(11).hisse, totY=cashY+stkY;
  var goal=STORE.goal||0;
  var pct=goal>0?clampPct(totM/goal*100):0;
  var pctEnd=goal>0?clampPct(totY/goal*100):0;

  var gc=h('<div class="card">'+
    '<div class="hero-r"><div class="sh-t" style="font-size:14px">Toplam varlık</div>'+
      '<button class="tnum" style="font-size:12.5px;font-weight:600;color:var(--m5)" id="goalEdit">Hedef '+fmtM(goal)+' ›</button></div>'+
    '<div class="tsav">'+
      '<div><div class="k">'+MONTHS_L[m]+' sonu nakit</div>'+
        '<div class="v tnum" style="color:'+(cashM>=0?INK:RUST)+'">'+fmtM(cashM)+'</div></div>'+
      '<div><div class="k">'+MONTHS_L[m]+' sonu hisse</div>'+
        '<div class="v tnum" style="color:'+C_HISSE+'">'+fmtM(stkM)+'</div></div>'+
    '</div>'+
    '<div class="tot"><span class="a">'+MONTHS_L[m]+' sonu toplam</span><span class="b tnum">'+fmtM(totM)+'</span></div>'+
    '<button class="opn" id="openEdit">Açılış bakiyesi '+fmtM(state.opening)+' dahil · değiştir ›</button>'+
    '<div class="bar" style="margin-top:14px"><div style="width:'+pct+'%"></div></div>'+
    '<div class="rowsm"><div>Hedefin '+pct+'%\u2019i</div><div class="tnum">'+fmtM(goal)+'</div></div>'+
    '<div style="margin-top:14px;padding-top:14px;border-top:1px solid rgba(27,26,24,.07);display:flex;align-items:center;gap:10px">'+
      '<div style="font-size:12px;color:var(--m5);flex:1;line-height:1.4">'+y+' sonunda<br>nakit + hisse</div>'+

        '<div class="tnum" style="font-size:19px;font-weight:700;color:'+(totY>=goal&&goal>0?GREEN:INK)+'">'+fmtM(totY)+'</div>'+

  gc.querySelector('#goalEdit').onclick=openGoal;
  gc.querySelector('#openEdit').onclick=openOpening;
  f.appendChild(gc);

  /* kategoriler — her grup kendi pastel renginde */
  f.appendChild(h('<div class="sechd"><div class="t">Kategoriler · '+MONTHS_L[m]+'</div>'+
    '<div class="m">'+MONTHS[m]+' '+y+'</div></div>'));

  function drawCats(type,total,emptyMsg,label){
    var rows=state.groups.filter(function(g){ return g.type===type; })
      .map(function(g){ return {g:g,name:g.name,val:c.sub[g.id][m]}; })
      .filter(function(r){ return Math.abs(r.val)>0.5; })
      .sort(function(a,b){ return Math.abs(b.val)-Math.abs(a.val); });

        '<div class="cat-a tnum">'+fmtM(r.val)+'</div><div class="cat-p">'+p+'%</div></div>'+
        '<div class="cat-b"><div style="width:'+p+'%;background:'+gcolor(r.g)+'"></div></div></div>'));
    });
    return cw;
  }
  f.appendChild(drawCats('cost',c.cost[m],'Bu ay gider kaydı yok.','Gider'));
  f.appendChild(drawCats('revenue',c.revenue[m],'Bu ay gelir kaydı yok.','Gelir'));

  /* o ayın kalemleri — dokununca düzenlenir */
  var items=[];
  state.groups.forEach(function(g){
    g.items.forEach(function(it){

    var order=state.groups.filter(function(g){
      return items.some(function(x){ return x.g.id===g.id; });

      return Math.abs(c.sub[b.id][m])-Math.abs(c.sub[a.id][m]);

        '<div class="s tnum" style="color:'+(inc?GREEN:'var(--m5)')+'">'+(inc?'+':'')+fmtM(tot)+'</div></div>'));
      rows.forEach(function(x){
        var neg=x.v<0;
        var amtCol=inc?GREEN:(g.type==='realize'?(neg?RUST:GREEN):INK);

          '<div class="li-d" style="background:'+col+';color:#fff;font-size:13px">'+esc(initialOf(x.it.name))+'</div>'+
          '<div style="flex:1;min-width:0"><div class="li-n">'+esc(x.it.name)+'</div>'+
          '<div class="li-s">'+esc(g.name)+'</div></div>'+
          '<div class="li-a tnum" style="color:'+amtCol+'">'+(inc?'+':'')+fmtM(x.v)+'</div></button>');
        node.querySelector('button').onclick=function(){ openItemSheet(g.id,x.it.id); };
        list.appendChild(node);
      });
    });
  }
  f.appendChild(list);

  var gd=h('<button class="ghost" style="margin-top:16px;margin-bottom:56px;font-size:13px">Senkron · yedek · yıl</button>');
  gd.querySelector('button').onclick=openSyncSheet;
  f.appendChild(gd);

  scroll.appendChild(f);
  scroll.scrollTop=0;
}

var sheetOpen=false;
function closeSheet(){ var hst=document.getElementById('sheetHost'); if(hst) hst.innerHTML=''; sheetOpen=false; }
function sheet(inner){
  sheetOpen=true;
  var host=document.getElementById('sheetHost');
  host.innerHTML='';
  var scrim=document.createElement('div'); scrim.className='scrim';
  var spacer=document.createElement('div'); spacer.style.flex='1'; spacer.onclick=closeSheet;
  var s=document.createElement('div'); s.className='sheet';
  s.appendChild(inner);
  scrim.appendChild(spacer); scrim.appendChild(s);
  host.appendChild(scrim);
  return s;
}
function toast(msg){
  var host=document.getElementById('toastHost');

  host.innerHTML='<div class="toast">'+esc(msg)+'</div>';
  setTimeout(function(){ host.innerHTML=''; },1900);
}

/* ---------- MOBİL: kalem ekle / düzenle ---------- */
function defaultGroupId(){
  var g=state.groups.filter(function(x){ return x.name==='Değişken'; })[0]
      || state.groups.filter(function(x){ return x.type==='cost'; })[0]
      || state.groups[0];
  return g?g.id:null;
}
function mobSaveItem(orig,next){
  var target=find(next.gid); if(!target) return;
  var it=null;
  if(orig&&orig.iid){
    var og=find(orig.gid);
    it=og&&findItem(og,orig.iid);
    if(it&&og.id!==target.id){
      og.items=og.items.filter(function(x){ return x.id!==it.id; });
      target.items.push(it);
    }
  }
  /* yeni kalem eklerken aynı adlı kalem varsa onu güncelle, kopya oluşturma */
  if(!it){
    var key=String(next.name||'').trim().toLocaleLowerCase('tr');
    it=target.items.filter(function(x){ return String(x.name||'').trim().toLocaleLowerCase('tr')===key; })[0]||null;
  }
  if(!it){ it={id:uid('i'),name:'',values:new Array(12).fill(0)}; target.items.push(it); }
  it.name=String(next.name||'').trim()||'Yeni kalem';
  if(next.every){ for(var i=next.month;i<12;i++) it.values[i]=next.amount; }
  else it.values[next.month]=next.amount;
  touched(); renderMob();
}
function mobDeleteItem(gid,iid){
  var g=find(gid); if(!g) return;
  g.items=g.items.filter(function(x){ return x.id!==iid; });
  touched(); renderMob();
}
function openItemSheet(gid,iid){
  var m=view.month;
  var g=gid?find(gid):null;
  var it=(g&&iid)?findItem(g,iid):null;
  var draft={
    gid:g?g.id:defaultGroupId(),
    name:it?it.name:'',
    amount:it?String(it.values[m]||''):'',
    every:false
  };
  var picks=state.groups.map(function(x){
    return '<button data-g="'+x.id+'" class="'+(x.id===draft.gid?'on':'')+'">'+
      '<i style="background:'+gcolor(x)+'"></i><span>'+esc(x.name)+'</span></button>';
  }).join('');

  var inner=h('<div>'+
    '<div class="grab"></div>'+
    '<div class="sh-h"><div class="sh-t">'+(it?'Kalemi düzenle':'Yeni kalem')+' · '+MONTHS_L[m]+'</div>'+
      '<button class="sh-x">Vazgeç</button></div>'+
    '<div class="field"><input class="inp" id="itName" placeholder="Kira, market, hisse…" value="'+esc(draft.name)+'" autocomplete="off"></div>'+
    '<div class="field"><input class="inp tnum" id="itAmt" inputmode="decimal" placeholder="0" value="'+esc(draft.amount)+'"></div>'+
    '<div class="lab">Kategori</div>'+
    '<div class="gpick" id="itGrp">'+picks+'</div>'+
    '<div class="lab">Ne zaman</div>'+
    '<div class="seg" id="itSeg">'+
      '<button data-e="0" class="on">Sadece bu ay</button>'+
      '<button data-e="1">Bu aydan itibaren her ay</button>'+
    '</div>'+
    '<button class="save" id="itSave">Kaydet</button>'+
    (it?'<button class="del" id="itDel">Kalemi tamamen sil</button>':'')+
    '<div class="note">Tutarı 0 yazarsan kalem bu aydan kalkar ama diğer aylarda durur. Zarar girmek için başına eksi koy.</div>'+
  '</div>');

  var sh=sheet(inner);
  sh.querySelector('.sh-x').onclick=closeSheet;

  sh.querySelectorAll('#itGrp button').forEach(function(b){
    b.onclick=function(){
      draft.gid=b.getAttribute('data-g');
      sh.querySelectorAll('#itGrp button').forEach(function(x){ x.className=''; });
      b.className='on';
    };
  });
  sh.querySelectorAll('#itSeg button').forEach(function(b){
    b.onclick=function(){
      draft.every=b.getAttribute('data-e')==='1';
      sh.querySelectorAll('#itSeg button').forEach(function(x){ x.className=''; });
      b.className='on';
    };
  });
  sh.querySelector('#itSave').onclick=function(){
    var nm=sh.querySelector('#itName').value.trim();
    if(!nm){ toast('Kaleme bir ad ver'); return; }
    mobSaveItem(it?{gid:g.id,iid:it.id}:null,{
      gid:draft.gid, name:nm,
      amount:num(sh.querySelector('#itAmt').value),
      month:m, every:draft.every
    });
    closeSheet(); toast(it?'Güncellendi':'Eklendi');
  };
  if(it){
    sh.querySelector('#itDel').onclick=function(){
      mobDeleteItem(g.id,it.id);
      closeSheet(); toast('Silindi');
    };
  }
}

/* ════════════════════════════════════════════════════════════
   10 · SENKRON PANELİ  (her iki görünümde de aynı)
   ════════════════════════════════════════════════════════════ */
function syncPanelHTML(){
  return '<div class="grab"></div>'+
    '<div class="sh-h"><div class="sh-t">Senkron</div><button class="sh-x">Kapat</button></div>'+
    '<div class="note" style="text-align:left;margin-top:10px;font-size:12.5px" id="syncLbl">'+esc(syncLabel())+'</div>'+
    '<div class="lab">GitHub token</div>'+
    '<div class="field"><input class="inp" id="tkIn" placeholder="ghp_…" value="'+esc(SY.token)+'" autocomplete="off" spellcheck="false"></div>'+
    '<div class="lab">Gist kimliği</div>'+
    '<div class="field"><input class="inp" id="gsIn" placeholder="boş bırak → kendi bulur" value="'+esc(SY.gist)+'" autocomplete="off" spellcheck="false"></div>'+
    '<button class="save" id="skSave">Bağlan ve eşitle</button>'+
    '<button class="ghost" id="skPull" style="margin-top:9px">Buluttan çek</button>'+
    '<button class="ghost" id="skPush" style="margin-top:9px">Buluta gönder</button>'+
    '<button class="ghost" id="skExp" style="margin-top:9px">Yedek dosyası indir</button>'+
    '<button class="del" id="skOff">Bu cihazda senkronu kapat</button>'+
    '<div class="note">Token yalnızca bu cihazda saklanır, veriler gizli bir Gist içinde tutulur.</div>';
}
function wireSyncPanel(s,after){
  s.querySelector('.sh-x').onclick=after.close;
  s.querySelector('#skSave').onclick=function(){
    SY.token=s.querySelector('#tkIn').value.trim();
    SY.gist=s.querySelector('#gsIn').value.trim();
    localStorage.setItem('pnl_gh_token',SY.token);
    localStorage.setItem('pnl_gist_id',SY.gist);
    if(!SY.token){ setSync('off','Senkron kapalı'); after.done('Senkron kapatıldı'); return; }
    setSync('busy','Bağlanılıyor…');
    pull().then(function(){ after.done('Bağlandı'); });
  };
  s.querySelector('#skPull').onclick=function(){ pull().then(function(){ after.done('Buluttan çekildi'); }); };
  s.querySelector('#skPush').onclick=function(){ STORE.updatedAt=Date.now(); persist(); push().then(function(){ after.done('Buluta gönderildi'); }); };
  s.querySelector('#skExp').onclick=function(){ exportBackup(); };
  s.querySelector('#skOff').onclick=function(){
    SY.token=''; SY.gist='';
    localStorage.removeItem('pnl_gh_token'); localStorage.removeItem('pnl_gist_id');
    setSync('off','Senkron kapalı'); after.done('Senkron kapatıldı');
  };
}
function openSyncSheet(){
  var s=sheet(h('<div>'+syncPanelHTML()+'</div>'));
  wireSyncPanel(s,{
    close:closeSheet,
    done:function(msg){ closeSheet(); renderMob(); toast(msg); }
  });
}
/* web tarafı için basit modal */
function openSyncModal(){
  var back=document.createElement('div');
  back.style.cssText='position:fixed;inset:0;z-index:80;background:rgba(58,52,44,.34);display:flex;align-items:center;justify-content:center;padding:20px';
  var box=document.createElement('div');
  box.className='mobscope';
  box.style.cssText='background:#f6f5f2;color:#1b1a18;border-radius:22px;max-width:400px;width:100%;max-height:88vh;overflow-y:auto;padding:16px 22px 26px;font-family:-apple-system,BlinkMacSystemFont,system-ui,sans-serif;'+
    '--ink:#1b1a18;--paper:#f6f5f2;--card:#fff;--green:#2f7a5b;--rust:#b4622f;--m1:rgba(27,26,24,.06);--m2:rgba(27,26,24,.08);--m4:rgba(27,26,24,.42);--m5:rgba(27,26,24,.45);--m6:rgba(27,26,24,.6);--safeB:0px';
  box.innerHTML=syncPanelHTML();
  /* modal içinde mobil sınıf stilleri geçerli olsun diye body'ye geçici kanca */
  document.body.classList.add('mob-scope');
  back.appendChild(box);
  back.onclick=function(e){ if(e.target===back) cleanup(); };
  document.body.appendChild(back);
  function cleanup(){ back.remove(); document.body.classList.remove('mob-scope'); }
  wireSyncPanel(box,{
    close:cleanup,
    done:function(msg){ cleanup(); render(); }
  });
}

/* ════════════════════════════════════════════════════════════
   11 · GÖRÜNÜM SEÇİMİ & OLAYLAR
   ════════════════════════════════════════════════════════════ */
var MQ=window.matchMedia('(max-width: 820px)');
function wantMode(){ return MQ.matches?'mob':'web'; }

function applyBodyClass(mode){
  document.body.className=(mode==='mob'?'mob':'web');
  document.documentElement.className=(mode==='mob'?'mob':'');
}
function render(){
  var mode=wantMode();
  view.mode=mode;
  applyBodyClass(mode);
  if(mode==='web'){ root.innerHTML=buildWeb(); paintSync(); }
  else renderMob();
}
MQ.addEventListener?MQ.addEventListener('change',function(){ render(); })
  :window.addEventListener('resize',function(){ if(wantMode()!==view.mode) render(); });

/* web olay delegasyonu */
root.addEventListener('change',function(e){
  if(view.mode!=='web') return;
  var t=e.target,act=t.getAttribute&&t.getAttribute('data-act'); if(!act) return;
  if(act==='cell') setCell(t.getAttribute('data-g'),t.getAttribute('data-i'),+t.getAttribute('data-m'),t.value);
  else if(act==='name') setName(t.getAttribute('data-g'),t.getAttribute('data-i'),t.value);
  else if(act==='opening') setOpening(t.value);
  else if(act==='import'){
    var file=t.files&&t.files[0];
    if(file) importBackup(file,function(okz){ if(!okz) alert('Yedek dosyası okunamadı.'); });
    t.value='';
  }
});
root.addEventListener('click',function(e){
  if(view.mode!=='web') return;
  var t=e.target,act=t.getAttribute&&t.getAttribute('data-act'); if(!act) return;
  if(act==='add') addItem(t.getAttribute('data-g'));
  else if(act==='del') delItem(t.getAttribute('data-g'),t.getAttribute('data-i'));
  else if(act==='year') setYear(+t.getAttribute('data-y'));
  else if(act==='export') exportBackup();
  else if(act==='sync') openSyncModal();
});

/* ════════════════════════════════════════════════════════════
   12 · BAŞLAT
   ════════════════════════════════════════════════════════════ */
loadStore();
bindYear(2026);
if(!STORE.updatedAt) STORE.updatedAt=Date.now();
persist();
setSync(syncOn()?'busy':'off',syncOn()?'Bağlanılıyor…':'Senkron kapalı');
render();
if(syncOn()) pull();

})();
</script>
